<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Pick Overlay</title>
  <!-- Broadcast v2: same stack as gameplay-hud.html (Task 4) + bg-helper.js —
       this scene is full-screen (petal texture, no plain black voids) rather
       than a transparent HUD strip. theme-v2.css/fonts-v2.css/animations.css
       own tokens + shared component-internal styles; this file's own <style>
       owns scene-local layout (header chips, map columns, column states). -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* ── Two positioned wrapper slots (built ONCE by shell) ─────────────── */
    .mp-slot { position: absolute; }
    #mp-header { top: 20px; left: 0; right: 0; }
    #mp-grid   { top: 210px; left: 40px; right: 40px; bottom: 40px; }
    /* #mp-grid resolves a definite height from its absolute top+bottom, but
       .slot-content (the plain div the shell wraps render's output in) is
       otherwise auto-height — without this, .mp-columns's height:100% below
       has nothing definite to resolve against and every column collapses to
       fit its content instead of filling the grid area down to the footer. */
    #mp-grid .slot-content { height: 100%; }

    /* overlay-core appends its volatile render container as #root's LAST
       child (after the shell wrappers). This scene never uses it directly —
       render() writes into each wrapper's persistent .slot-content instead
       (the render-vs-reflow split, same as gameplay-hud.html) — so the
       trailing, id-less container is hidden. Every shell wrapper has an id,
       so this only matches that container. */
    #root > div:not([id]) { display: none; }

    /* ── Header row: team chips flanking the pinwheel crest ─────────────── */
    .mp-header-row { display: flex; align-items: center; justify-content: center; gap: 60px; }
    .mp-chip { display: flex; align-items: center; gap: 14px; }
    .mp-chip-right { flex-direction: row-reverse; }
    .mp-chip-logo {
      width: 44px; height: 44px; border-radius: var(--panel-radius);
      object-fit: cover; border: 1px solid rgba(255,255,255,0.15); flex: none;
    }
    .mp-chip-name {
      font-size: 26px; font-weight: 800; color: #fff; text-transform: uppercase;
      letter-spacing: 0.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.7); white-space: nowrap;
    }
    .mp-chip-score {
      font-size: 28px; font-weight: 800; color: #fff; padding: 4px 16px;
      border-radius: var(--panel-radius); line-height: 1;
    }
    /* Crest: pinwheel medallion with the event title + gradient underline
       hanging below it (absolute, so it doesn't grow the header row's
       height or shift the chips off the shared center line — v4 mockup). */
    .mp-crest { position: relative; flex: none; }
    .mp-event-block {
      position: absolute; top: 100%; left: 50%; transform: translateX(-50%);
      margin-top: 10px; text-align: center; white-space: nowrap;
    }
    .mp-event-title {
      font-size: 22px; font-weight: 800; color: #fff; text-transform: uppercase;
      letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    .mp-event-underline { width: 150px; margin: 6px auto 0; }

    /* ── Map columns ──────────────────────────────────────────────────── */
    .mp-columns { display: flex; gap: 10px; height: 100%; }
    .mp-col {
      position: relative; flex: 1 1 0; min-width: 0; box-sizing: border-box;
      display: flex; flex-direction: column; overflow: hidden;
      background: rgba(8,10,15,0.9); border: 1px solid rgba(255,255,255,0.12);
      border-radius: var(--panel-radius);
    }
    /* Live column reads a hair wider than its neighbors (v4 mockup) — a
       white glow border carries "now" the same way .v2-pip-live does. */
    .mp-col-current { flex: 1.15 1 0; border: 2px solid #fff; box-shadow: 0 0 24px rgba(255,255,255,0.28); }
    .mp-col-decider { opacity: 0.75; }
    .mp-col-completed .mp-col-art-bg { filter: brightness(0.5) saturate(0.55); }

    .mp-col-art { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    /* Dedicated class (NOT a bare `.mp-col-art img` descendant selector) — the
       winner logo <img> also lives inside .mp-col-art, and a descendant `img`
       selector would win over `.mp-winner-logo`'s own sizing (equal-looking
       but higher specificity: one class + one type vs. one class) and force
       it to position:absolute;inset:0;100%x100%, collapsing it into whatever
       box its remaining in-flow sibling (the score text) shrink-to-fit to.
       Scoping this rule to the background art image only avoids that collision
       structurally, for this image and any future one added inside the card. */
    .mp-col-art-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .mp-col-art-placeholder {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(180deg, #2e3440, #1b1f28); padding: 20px; text-align: center;
    }
    .mp-col-art-placeholder-text {
      font-size: 28px; font-weight: 800; color: rgba(255,255,255,0.35);
      text-transform: uppercase; letter-spacing: 2px;
    }
    .mp-col-wash { position: absolute; inset: 0; pointer-events: none; }

    .mp-col-chip {
      position: absolute; top: 10px; left: 10px; background: rgba(8,10,15,0.85);
      color: rgba(255,255,255,0.8); font-size: 22px; font-weight: 800;
      letter-spacing: 1px; padding: 5px 12px; border-radius: var(--panel-radius);
      text-transform: uppercase;
    }
    .mp-col-current .mp-col-chip { background: #fff; color: #0a0c11; }
    .mp-col-live-chip {
      position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 8px;
      background: rgba(8,10,15,0.85); padding: 5px 14px; border-radius: var(--panel-radius);
    }
    .mp-live-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--elmt-red); }
    .mp-live-text { font-size: 22px; font-weight: 800; color: #fff; letter-spacing: 1px; }

    .mp-winner-wrap { position: absolute; left: 50%; bottom: 16%; transform: translateX(-50%); text-align: center; }
    .mp-winner-logo {
      width: 92px; height: 92px; border-radius: 50%; object-fit: cover;
      border: 3px solid #fff; display: block; margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
    }
    .mp-winner-score {
      margin-top: 8px; font-size: 32px; font-weight: 800; color: #fff;
      text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }

    .mp-col-foot { padding: 12px 8px 16px; text-align: center; flex: 0 0 auto; }
    .mp-col-name {
      font-size: 34px; font-weight: 800; color: #fff; text-transform: uppercase;
      letter-spacing: 0.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    .mp-col-current .mp-col-name { font-size: 40px; }

    .mp-pick-pill {
      /* 18px is a deliberate exception to the readability floor: the pill is a
         redundant "<TEAM> PICK" label beside the already-large map name, and
         the owner asked for it slightly smaller (QA batch 1). */
      display: inline-block; font-size: 18px; font-weight: 800; letter-spacing: 0.8px;
      padding: 5px 16px; border-radius: var(--panel-radius); margin-top: 8px;
      text-transform: uppercase;
    }
    .mp-pick-pill-neutral { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); color: rgba(255,255,255,0.5); }

    /* Per-column hero bans. EVERY played column shows its two ban tiles now
       (completed maps included), so this row lives in every footer, not just
       the live one. The footer is flex:0 0 auto and the art above is
       flex:1 1 auto/min-height:0, so a taller footer shrinks the art rather
       than overflowing the column (overflow:hidden) — the single consistent
       rule that keeps 56px tiles + map name + pick pill fitting in every
       column. Tiles are nameless (hideName), so no name-plate height to budget
       for. margin-top kept tight (10px) so completed columns' smaller art still
       reads. banColIdx's column uses 84px tiles, the rest 56px (set inline via
       banTile's size option). */
    .mp-col-bans { display: flex; justify-content: center; gap: 12px; margin-top: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + bg helper
       must all be global before overlay-core wires the render loop. NO ?./??
       in the inline script (OBS Chromium 103 floor); template literals/const/
       arrow are fine. -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];
    var mapData = [];

    // Deps (overlay-core loads both before the first render).
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }

    function loadMaps() {
      return fetch(API + '/api/maps')
        .then(function (r) { return r.json(); })
        .then(function (d) { mapData = Array.isArray(d) ? d : []; })
        .catch(function () { mapData = []; });
    }

    // Local API (cached server-side, local-first pack) match against a map
    // name — normMapName (theme-helpers.js) handles the OverFast curly-
    // apostrophe / diacritic mismatches a raw lowercase compare falls through
    // on (was silently landing on the tiny FACEIT fallback image). The `key`
    // fallback matters separately: manual/scrim entries and faceit.js's
    // `{id, name:id}` degenerate case produce slug-shaped names ("kings-row"),
    // which normMapName's display-name comparison never matches — slugify the
    // incoming name the same way server/map-image-resolver.js's
    // normalizeMapName does (apostrophes stripped outright, not folded) and
    // compare against the catalog's `key`.
    function getMapScreenshot(mapName, faceitImage) {
      if (!mapName) return proxyImg(faceitImage);
      var n = normMapName(mapName);
      var slug = mapName.normalize('NFD').replace(/[̀-ͯ]/g, '')
        .replace(/[‘’']/g, '').toLowerCase()
        .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      var match = null;
      for (var i = 0; i < mapData.length; i++) {
        var m = mapData[i];
        if (m && m.name && (normMapName(m.name) === n || m.key === slug)) { match = m; break; }
      }
      return proxyImg(match ? match.screenshot : faceitImage);
    }

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }

    // Resolves a locked ban ({name, role, image}) to a portrait + label.
    // findHeroEntry's pre-proxied portrait wins when the ban's hero name
    // matches the roster; otherwise fall back to the ban's own .image
    // through proxyImg so an unrecognized/renamed hero still shows *something*.
    function resolveBanPortrait(ban) {
      var hero = findHeroEntry(heroData, ban.name);
      if (hero) return { portrait: hero.portrait, heroName: hero.name };
      return { portrait: proxyImg(ban.image || ''), heroName: ban.name || '' };
    }

    // ── shell: builds the two entrance-animated wrappers exactly ONCE ────────
    // Same inline-animation-string mechanism as gameplay-hud.html: state-sync's
    // replayAnimation() re-runs these on OBS show/hide. render() only ever
    // rewrites the inner .slot-content divs, so these wrapper animations NEVER
    // replay on a data change (score tick, ban lock, map completing) — that's
    // the fix for the "chrome re-slides on every update" bug class. This is
    // also why NO element render() writes gets an animation of its own: a
    // fresh .slot-content innerHTML always creates brand-new DOM nodes, so a
    // CSS-class animation on those nodes would replay on every single render,
    // not just on scene entry. .map-grid's entrance is staggered a beat after
    // the header (0.20s vs 0.10s delay) — both wrappers, not per-column.
    function shell(root) {
      root.setAttribute('data-shell-marker', 'map-pick-v2');
      applyTextureBg(root);
      root.innerHTML =
        '<div id="mp-header" class="mp-slot" style="animation: scaleIn 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="mp-grid" class="mp-slot" style="animation: slideUp 0.5s ease-out 0.20s both;">' +
          '<div class="slot-content"></div></div>';
    }

    // ── key: EXACTLY the state leaves render reads ──────────────────────────
    // heroBans is intentionally NOT keyed (and NOT read by render): the old
    // scene fell back to heroBans.team{1,2}[0] for the current map's bans when
    // perMapBans was empty. perMapBans is populated by the same producer
    // action that sets heroBans, so that fallback was dead weight, not a real
    // resilience path — dropped here rather than kept+keyed. swapSides is also
    // not keyed: this scene (like the pre-v2 version) doesn't honor it — teams
    // stay in their true team1/team2 screen positions; the pinwheel crest
    // colors are TRUE team colors regardless, same invariant as the HUD.
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var maps = (state.maps || []).map(function (m) {
        return [m.name, m.mode, m.status, m.image, m.winner, m.roundScore];
      });
      var perMapBans = (state.perMapBans || []).map(function (pb) {
        pb = pb || {};
        return [pb.picker, pb.team1Ban, pb.team2Ban];
      });
      return [
        t1.name, t1.logo, t1.score, t1.color,
        t2.name, t2.logo, t2.score, t2.color,
        maps, perMapBans, state.activeBanMapIdx,
        state.bestOf, state.eventName,
        theme.team1Color, theme.team2Color
      ];
    }

    // One team chip: logo | name | score. `side==='right'` mirrors the row
    // (score-adjacent-to-crest, logo on the outer edge — v4 mockup) via
    // .mp-chip-right's flex-direction reverse.
    function chip(team, color, side) {
      var sideClass = side === 'right' ? ' mp-chip-right' : '';
      // v2-idle-breathe (owner QA batch 3): leaf img inside the chip — the
      // entrance `both` fill lives on the shell wrapper, not on this element,
      // so the idle transform is safe per theme-v2.css's idle-motion rules.
      var logoHtml = team.logo ? safeImg(team.logo, { 'class': 'mp-chip-logo v2-idle-breathe', alt: team.name || '' }) : '';
      return '<div class="mp-chip' + sideClass + '">' +
        logoHtml +
        '<div class="mp-chip-name">' + escapeHtml(team.name || '') + '</div>' +
        '<div class="mp-chip-score" style="background:' + escapeHtml(color) + ';color:' + escapeHtml(textOnColor(color)) + '">' + escapeHtml(String(scoreOf(team))) + '</div>' +
        '</div>';
    }

    // Header row: chips flank a plain pinwheel medallion (no hub text — this
    // is a series-identity crest, not a score hub like the HUD's); the event
    // title + gradient underline hang below it via .mp-event-block (absolute,
    // so they don't grow the row and de-center the chips from the crest).
    function headerHtml(t1, t2, t1color, t2color, eventName) {
      return '<div class="mp-header-row">' +
        chip(t1, t1color, 'left') +
        '<div class="mp-crest">' +
          // Idle glow on the crest medallion (owner QA batch 3 eye candy) —
          // opacity/filter based, so it can't collide with any transform.
          '<div class="v2-medallion v2-idle-glow">' + pinwheelSVG({ color1: t1color, color2: t2color, size: 100 }) + '</div>' +
          '<div class="mp-event-block">' +
            '<div class="mp-event-title">' + escapeHtml(eventName || 'MATCH') + '</div>' +
            '<div class="v2-underline mp-event-underline"></div>' +
          '</div>' +
        '</div>' +
        chip(t2, t2color, 'right') +
        '</div>';
    }

    // One map column. `ctx`: { t1, t2, t1color, t2color, bestOf, mapBans, banColIdx }.
    // Any column with revealed bans shows them (nameless); banColIdx sizes the
    // active column's tiles larger (84px vs 56px). States (v4 mockup):
    //  - completed: team-color border/wash + circled winner logo + roundScore
    //  - current (live): white glow border, LIVE chip, name >=40px
    //  - decider: LAST column, still unplayed (not completed/current) — dimmed
    //    (a decider can be played out even when the series is already
    //    decided, so no conditional-play watermark — just the DECIDER pill
    //    in the foot). A plain "upcoming, not last" column (will definitely
    //    be played) gets none of the completed/current/decider treatment —
    //    just the base panel + its picker pill.
    function mapColumn(i, map, ctx) {
      map = map || {};
      var status = map.status || 'upcoming';
      var isCompleted = status === 'completed';
      var isCurrent = status === 'current';
      var isLast = i === ctx.bestOf - 1;
      var isDecider = isLast && !isCompleted && !isCurrent;

      var winnerColor = '';
      if (isCompleted && map.winner) {
        winnerColor = map.winner === 'team1' ? ctx.t1color : (map.winner === 'team2' ? ctx.t2color : '');
      }

      var colClasses = 'mp-col';
      if (isCompleted) colClasses += ' mp-col-completed';
      if (isCurrent) colClasses += ' mp-col-current';
      if (isDecider) colClasses += ' mp-col-decider';
      var colStyle = winnerColor ? (' style="border-color:' + escapeHtml(hexToAlpha(winnerColor, 0.6)) + '"') : '';

      var chipHtml = '<div class="mp-col-chip">MAP ' + (i + 1) + (map.mode ? ' · ' + escapeHtml(map.mode) : '') + '</div>';
      var liveChipHtml = isCurrent
        ? '<div class="mp-col-live-chip"><div class="mp-live-dot"></div><div class="mp-live-text">LIVE</div></div>'
        : '';

      var imgSrc = getMapScreenshot(map.name, map.image);
      var artInner;
      if (imgSrc) {
        artInner = '<img class="mp-col-art-bg" src="' + escapeHtml(imgSrc) + '" alt="' + escapeHtml(map.name || '') + '">';
        if (winnerColor) {
          artInner += '<div class="mp-col-wash" style="background:linear-gradient(180deg, transparent 40%, ' +
            escapeHtml(hexToAlpha(winnerColor, 0.35)) + ' 100%)"></div>';
        }
      } else {
        artInner = '<div class="mp-col-art-placeholder"><div class="mp-col-art-placeholder-text">' +
          escapeHtml(map.name || '—') + '</div></div>';
      }

      var winnerHtml = '';
      if (isCompleted && map.winner) {
        var wteam = map.winner === 'team1' ? ctx.t1 : ctx.t2;
        var wlogoHtml = wteam.logo
          ? safeImg(wteam.logo, { 'class': 'mp-winner-logo', alt: wteam.name || '' })
          : '<div class="mp-winner-logo" style="background:' + escapeHtml(winnerColor) + '"></div>';
        var scoreHtml = map.roundScore ? '<div class="mp-winner-score">' + escapeHtml(map.roundScore) + '</div>' : '';
        winnerHtml = '<div class="mp-winner-wrap">' + wlogoHtml + scoreHtml + '</div>';
      }

      var artHtml = '<div class="mp-col-art">' + artInner + winnerHtml + chipHtml + liveChipHtml + '</div>';

      // Footer: name + picker pill + bans (on every played column that has
      // them; ctx.banColIdx just picks the 84px vs 56px tile size). Only
      // rendered once the slot actually has a map name — an unconfigured
      // trailing slot (bestOf > maps.length) gets the bare placeholder art and
      // no footer.
      var footHtml = '';
      if (map.name) {
        var mapBans = ctx.mapBans || {};
        var picker = mapBans.picker;
        var pickPillHtml;
        if (picker) {
          var pickerTeam = picker === 'team1' ? ctx.t1 : ctx.t2;
          var pickerColor = picker === 'team1' ? ctx.t1color : ctx.t2color;
          var pillText = escapeHtml(pickerTeam.name || 'TEAM') + ' PICK';
          pickPillHtml = '<div class="mp-pick-pill" style="background:' + escapeHtml(hexToAlpha(pickerColor, 0.22)) +
            ';border:1px solid ' + escapeHtml(hexToAlpha(pickerColor, 0.55)) +
            ';color:' + escapeHtml(legibleColor(pickerColor, 0.45)) + '">' + pillText + '</div>';
        } else if (isDecider) {
          pickPillHtml = '<div class="mp-pick-pill mp-pick-pill-neutral">DECIDER</div>';
        } else {
          // Mid-series map with picker data not yet set: empty pill slot, not
          // a misleading DECIDER label.
          pickPillHtml = '';
        }

        // Bans on EVERY played column that has them (completed maps included),
        // not just the live/last one. The current-or-last-played column
        // (ctx.banColIdx) shows them at 84px; other columns at 56px so the
        // board reads "here's what got banned across the whole series". NO name
        // captions on any board tile (hideName) — owner: "we don't need the
        // names"; the portrait + slash carry the identity.
        var bansHtml = '';
        var b1 = mapBans.team1Ban;
        var b2 = mapBans.team2Ban;
        if (b1 || b2) {
          var banSize = (i === ctx.banColIdx) ? 84 : 56;
          bansHtml = '<div class="mp-col-bans">';
          if (b1) {
            var r1 = resolveBanPortrait(b1);
            bansHtml += banTile({ portrait: r1.portrait, heroName: r1.heroName, teamColor: ctx.t1color, size: banSize, hideName: true });
          }
          if (b2) {
            var r2 = resolveBanPortrait(b2);
            bansHtml += banTile({ portrait: r2.portrait, heroName: r2.heroName, teamColor: ctx.t2color, size: banSize, hideName: true });
          }
          bansHtml += '</div>';
        }

        footHtml = '<div class="mp-col-foot">' +
          '<div class="mp-col-name">' + escapeHtml(map.name) + '</div>' +
          pickPillHtml +
          bansHtml +
          '</div>';
      }

      return '<div class="' + colClasses + '"' + colStyle + '>' + artHtml + footHtml + '</div>';
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var maps = state.maps || [];
      var bestOf = state.bestOf || maps.length || 5;
      var perMapBans = state.perMapBans || [];

      document.querySelector('#mp-header .slot-content').innerHTML = headerHtml(t1, t2, t1color, t2color, state.eventName);

      // Which column gets the LARGER (84px) ban tiles — the "active" map. Prefer
      // the server's DERIVED resolver answer (state.activeBanMapIdx, from
      // getActiveBanIdx) so the board's emphasized column stays in lockstep with
      // the Ban Reveal: same map is highlighted here and labeled there, and it
      // also honors the producer-selected map + the between-maps upcoming window
      // that the local heuristic below can't see. Fall back to the local
      // current-else-last-completed scan for pre-fix servers/persisted states
      // with no activeBanMapIdx. (This only sizes tiles; every played column
      // still shows its bans regardless.)
      var banColIdx = (typeof state.activeBanMapIdx === 'number' && state.activeBanMapIdx >= 0)
        ? state.activeBanMapIdx : -1;
      if (banColIdx < 0) {
        for (var bc = 0; bc < maps.length; bc++) { if (maps[bc] && maps[bc].status === 'current') banColIdx = bc; }
        if (banColIdx < 0) { for (var bd = maps.length - 1; bd >= 0; bd--) { if (maps[bd] && maps[bd].status === 'completed') { banColIdx = bd; break; } } }
      }

      var ctx = { t1: t1, t2: t2, t1color: t1color, t2color: t2color, bestOf: bestOf, banColIdx: banColIdx };
      var colsHtml = '';
      for (var i = 0; i < bestOf; i++) {
        ctx.mapBans = perMapBans[i];
        colsHtml += mapColumn(i, maps[i], ctx);
      }
      document.querySelector('#mp-grid .slot-content').innerHTML = '<div class="mp-columns">' + colsHtml + '</div>';
    }

    var handle = defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render,
      deps: [loadHeroes, loadMaps]
    });

    // Map screenshots load in the background (loadMaps is also a `deps` entry,
    // so this only ever does work when that first attempt came back empty —
    // e.g. OverFast was down and there's no stale cache yet). Runtime escape
    // hatch: retry every 5s while mapData is empty, call forceRender() on the
    // first success (the key wouldn't otherwise change — map images aren't
    // keyed, matching/screenshot resolution happens at render time off
    // mapData), then stop. Replaces the old hand-rolled lastRenderKey reset.
    var mapsRetryTimer = setInterval(function () {
      if (mapData.length > 0) { clearInterval(mapsRetryTimer); return; }
      loadMaps().then(function () {
        if (mapData.length > 0) {
          clearInterval(mapsRetryTimer);
          handle.forceRender();
        }
      });
    }, 5000);
  </script>
</body>
</html>
