<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Between Matches</title>
  <!-- Broadcast v2 (Plan 3 Task 5): rebuilt on the casters.html cam-scene
       template — see that file for the long-form cutout invariant writeup.
       This is a SINGLE-CAM-ONLY scene: CAM_LAYOUTS.wide has only a `single`
       key (no `dual`), so unlike casters.html/casters-scoreboard.html/
       casters-lobby.html/casters-map-score.html this scene does NOT branch
       on state.casterLayout at all — there is exactly one cam window,
       always CAM_LAYOUTS.wide.single[0]. Do NOT copy the
       `layout === 1 ? single : dual` selector from the desk scenes here
       (flagged explicitly by the Task 4 review as a trap for this task).

       CAM RECT: { x:115, y:84, w:1690, h:860 } — CENTERED with equal 115px
       side margins (owner QA batch 1: the inherited v1 200-left/30-right
       margins left the window visibly off-center). Top pushed to y:84 so
       the event header band sits FULLY ABOVE the cutout (no overlap — the
       owner reported the old y:30 cam with the header floating over its top
       edge as "weirdly cut"). Bottom edge at y=944, leaving an 84px strip
       ABOVE the cam and a 136px strip BELOW it (944-1080) before the canvas
       edge. That geometry drives one layout decision that differs from the
       desk scenes:

       1) NO NAME PILL on the cam frame (camFrame({..., name: ''})). The
          desk scenes' pills identify WHICH caster is in which seat; this
          scene has exactly one big "waiting room" cam with no comparable
          identity to label (it's not a specific named caster's seat, it's
          just the show camera between matches) — an empty pill would be
          dead chrome. camFrame() already omits the pill element entirely
          when name is '' (see components-v2.js), so this falls out for
          free; no bg=transparent-style branching needed.

       HEADER CLEARANCE (owner QA batch 1): the event header band (top-center,
       per spec §5) is a ~44px pill; at top:22 it ends near y:66, a clean
       ~18px above the cam's y:84 top edge — no overlap. This replaces the
       pre-QA treatment where the header intentionally overlapped the top of
       a y:30 cam (which read as clipped text to the owner).

       EVENT TITLE OVERFLOW FIX (spec §5): eventHeader()'s `.v2-event-name`
       already ellipsizes via `flex:0 1 auto; min-width:0; overflow:hidden`
       (theme-v2.css) — but that only engages if some ANCESTOR constrains
       the header's width, same as map-intro's `#mi-top` carry-over fix.
       `#cd-header` here gets `max-width: 900px` for exactly that reason
       (this was the scene the overflow bug was originally reported against
       — spec §5 calls it out by name). A scene-local `padding-right` on the
       ellipsized name keeps the "…" off the pill edge so a truncated long
       name never looks jammed. Verified with a seeded 80+ char event name.

       COUNTDOWN CONTRACT (preserved EXACTLY from the pre-v2 scene, read the
       old buildKey/update comments before touching this):
       - Timer node id `bm-timer-text` is unchanged — countdown.js's
         startLocalTick() writes textContent directly to whatever node this
         id currently resolves to, once a second, via a SINGLETON interval.
       - startLocalTick's `el` param is a RESOLVER FUNCTION
         (`function(){ return document.getElementById('bm-timer-text'); }`),
         not a captured node reference — required because render() rebuilds
         `#cd-countdown .slot-content`'s innerHTML (and therefore the actual
         timer node) on every KEYED repaint; a captured-node reference would
         go stale the moment that happens. The resolver re-queries live.
       - `countdown.visible` is part of the render key (the box's very
         presence is state-driven), but the SECONDS TEXT is deliberately
         OUTSIDE the defineOverlay key/render cycle — ticking every real
         second must not depend on a state-sync poll landing in that same
         second (polls are 1.5-2.5s + jitter, and identical-state polls are
         suppressed entirely by state-sync.js's own JSON dedup). So this
         scene wires a SECOND, independent `stateSync()` subscriber
         (`trackCountdown`, registered alongside — not instead of —
         defineOverlay's own internal one) purely to keep `latestCountdown`
         fresh and re-arm startLocalTick's interval whenever the state
         object actually changes. This is the first defineOverlay scene to
         also own a live-ticking element; Task 6's countdown full-screens
         reuse this exact split.

       KEY READ-SET: the pre-v2 buildKey covered schedule
       (team1/team2/completed/score1/score2/team1Logo/team2Logo), the two
       team names, eventName, and countdown.visible — but did NOT key
       schedule.label/time/upNext, nor the teams.teamN.logo used by the
       empty-schedule FALLBACK panel. Both are real fields render() reads,
       so both are added to the key here (closing the same "read a field
       render uses, but don't key it" gap the audit fixed elsewhere for
       logos generally) rather than reproducing the old omission. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Petal-texture cutout layer — mask set in render() from the single
       fixed CAM_LAYOUTS.wide rect (never varies with state). */
    #cd-bg { position: absolute; inset: 0; }

    /* ── Positioned wrapper slots (built ONCE by shell) ──────────────────
       Centered wrappers use width:fit-content + margin:auto rather than
       left:50%+translateX(-50%) so the slideDown/slideUp entrance
       transforms never clobber the centering (same gotcha as every other
       v2 scene's shell wrappers). */
    #cd-header { position: absolute; top: 22px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 900px; }
    /* Keep the ellipsis of a truncated event name off the pill's right edge so
       a long name never looks jammed/"weirdly cut" (owner QA batch 1). */
    #cd-header .v2-event-name { padding-right: 8px; }
    #cd-cams { position: absolute; inset: 0; }

    /* Bottom band: cam window bottom is now y=944 (owner QA batch 1: cam
       recentered to y:84 + h:860). Start the band at 956 — a clean 12px
       below the cutout, matching the earlier polish commit's breathing room
       — and run to 16px off the canvas edge so a stacked panel (label + two
       32px logo rows) fits without grazing the overflow:hidden edges.
       Neither the countdown box nor the schedule row overlaps the cutout;
       both share the same top/bottom so their content baselines line up. */
    #cd-countdown { position: absolute; left: 24px; top: 956px; bottom: 16px; width: 240px; }
    #cd-schedule { position: absolute; left: 284px; right: 24px; top: 956px; bottom: 16px; }
    /* Both wrappers resolve a real height via top+bottom; .slot-content
       (a plain block child) needs an explicit height:100% to inherit it —
       height:100% on a descendant only resolves against an ancestor with a
       DEFINITE (non-auto) height, which top+bottom absolute positioning
       gives these two wrappers but a bare block child doesn't get for free. */
    #cd-countdown .slot-content, #cd-schedule .slot-content { height: 100%; }

    /* ── Countdown box ────────────────────────────────────────────────── */
    .bm-cd-panel {
      width: 100%; height: 100%; padding: 14px 18px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
    }
    .bm-cd-label {
      font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    .bm-cd-digits {
      font-size: 56px; font-weight: 800; letter-spacing: 1px; line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--grad4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* ── Schedule row ──────────────────────────────────────────────────────
       Team names sit on their OWN row (logo + name, full panel width) rather
       than side-by-side in one row — a 3-up strip at the >=28px name floor
       doesn't leave enough room for two team names AND a score/time AND two
       logos on a single line without crushing the names down to 3-4 visible
       characters (measured during Task 5 verification: "Ashen Vale" / "Solar
       Reach" side-by-side ellipsized to "ASHEN VA…"/"SOLAR RE…" — illegible).
       Score/time instead rides in the label row, right-aligned, where it has
       its own line and can't fight the names for width. ── */
    #cd-schedule .slot-content { display: flex; gap: 14px; }
    .bm-sched-panel {
      flex: 1; min-width: 0; position: relative; overflow: hidden;
      padding: 10px 16px; display: flex; flex-direction: column; justify-content: center; gap: 5px;
    }
    .bm-sched-panel.bm-upnext { border-color: rgba(255,255,255,0.4); }
    .bm-sched-label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .bm-sched-label {
      font-size: 22px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .bm-upnext .bm-sched-label { color: #fff; }
    .bm-sched-score, .bm-sched-time {
      font-size: 22px; font-weight: 800; flex: none; font-variant-numeric: tabular-nums;
      color: rgba(255,255,255,0.6); white-space: nowrap;
    }
    .bm-sched-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .bm-sched-logo { width: 32px; height: 32px; border-radius: var(--panel-radius); object-fit: cover; flex: none; border: 1px solid rgba(255,255,255,0.15); }
    .bm-sched-logo-empty { background: rgba(255,255,255,0.08); }
    .bm-sched-name {
      font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1;
    }
    .bm-upnext-underline { position: absolute; left: 0; right: 0; bottom: 0; }

    /* ── Fallback single-match UP NEXT strip (schedule empty) ──────────────
       The stacked-rows panel above is sized for a 3-up schedule split; when
       the whole band is ONE panel (the teams-state fallback), that layout
       strands a tiny label top-left, abuses the time slot for a floating
       "VS" at the far right, and leaves the middle empty (owner QA batch 3).
       This variant lays the single matchup out horizontally instead: a
       bordered UP NEXT label block, then a 1fr|auto|1fr grid so the VS chip
       sits at the exact center of the remaining width with the two teams
       reading toward it (same centering rationale as map-intro's .mi-match). */
    .bm-next-strip {
      width: 100%; height: 100%; position: relative; overflow: hidden;
      display: flex; align-items: center; gap: 30px; padding: 0 34px;
    }
    .bm-next-label {
      flex: none; font-size: 24px; font-weight: 800; letter-spacing: 2.5px;
      text-transform: uppercase; color: #fff;
      padding-right: 30px; border-right: 1px solid rgba(255,255,255,0.18);
    }
    .bm-next-match {
      flex: 1; min-width: 0; display: grid; grid-template-columns: 1fr auto 1fr;
      align-items: center; column-gap: 40px;
    }
    .bm-next-team { display: flex; align-items: center; gap: 18px; min-width: 0; }
    .bm-next-team-left { justify-content: flex-end; }
    .bm-next-team-right { justify-content: flex-start; }
    .bm-next-logo {
      width: 56px; height: 56px; border-radius: var(--panel-radius); object-fit: cover;
      flex: none; border: 1px solid rgba(255,255,255,0.2); background: rgba(8,10,15,0.6);
    }
    .bm-next-logo-empty { background: rgba(255,255,255,0.08); }
    /* Team-color accent: a slim vertical cap on each team block's outer edge
       (color = identity accent, panel stays neutral — the package rule). */
    .bm-next-accent { width: 5px; height: 44px; border-radius: 2px; flex: none; }
    .bm-next-name {
      font-size: 36px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
    }
    .bm-next-vs {
      font-size: 26px; font-weight: 800; letter-spacing: 3px; flex: none;
      color: rgba(255,255,255,0.45); padding: 8px 18px;
      border: 1px solid rgba(255,255,255,0.14); border-radius: var(--panel-radius);
      background: rgba(255,255,255,0.04);
    }

    /* overlay-core appends its volatile render container as #root's LAST
       child; this scene never uses it directly (render() writes into each
       wrapper's persistent .slot-content). Every shell child above carries
       an id, so this only matches that trailing container. */
    #root > div:not([id]) { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + component builders + cam geometry +
       countdown engine must all be global before overlay-core wires the
       render loop. NO ?./?? in the inline script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./cam-layout.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./countdown.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    function scoreVal(v) {
      return (v === undefined || v === null) ? '' : v;
    }

    // One schedule slot: label row (label + right-aligned score/time) then
    // one full-width logo+name row PER team, stacked — see the CSS comment
    // above .bm-sched-label-row for why this isn't a single side-by-side
    // row. `isNext` gets the accent border + gradient underline treatment.
    function schedTeamRowHtml(name, logo) {
      var logoHtml = logo
        ? safeImg(logo, { 'class': 'bm-sched-logo', alt: name || '' })
        : '<div class="bm-sched-logo bm-sched-logo-empty"></div>';
      return '<div class="bm-sched-row">' + logoHtml +
        '<span class="bm-sched-name">' + escapeHtml(name || 'TBD') + '</span></div>';
    }

    function schedItemHtml(m, i, isNext) {
      var completed = !!m.completed;
      var labelText = m.label || ('MATCH ' + (i + 1));
      var rightHtml = completed
        ? '<span class="bm-sched-score">' + escapeHtml(String(scoreVal(m.score1))) + '&ndash;' + escapeHtml(String(scoreVal(m.score2))) + '</span>'
        : (m.time ? '<span class="bm-sched-time">' + escapeHtml(m.time) + '</span>' : '');

      return '<div class="bm-sched-panel v2-panel' + (isNext ? ' bm-upnext' : '') + '">' +
        '<div class="bm-sched-label-row">' +
          '<span class="bm-sched-label">' + escapeHtml(labelText) + '</span>' + rightHtml +
        '</div>' +
        schedTeamRowHtml(m.team1, m.team1Logo) +
        schedTeamRowHtml(m.team2, m.team2Logo) +
        (isNext ? '<span class="v2-underline bm-upnext-underline"></span>' : '') +
        '</div>';
    }

    // Fallback UP NEXT strip (schedule empty): horizontal single-matchup band —
    // see the .bm-next-strip CSS comment. Team colors ride as slim outer accent
    // caps; the VS chip is pinned to the center of the post-label width.
    function nextStripTeamHtml(name, logo, color, side) {
      var logoHtml = logo
        ? safeImg(logo, { 'class': 'bm-next-logo v2-idle-breathe', alt: name || '' })
        : '<div class="bm-next-logo bm-next-logo-empty"></div>';
      var accentHtml = '<div class="bm-next-accent" style="background:' + escapeHtml(color) + '"></div>';
      var nameHtml = '<span class="bm-next-name">' + escapeHtml(name || 'TBD') + '</span>';
      var inner = side === 'left'
        ? accentHtml + logoHtml + nameHtml
        : nameHtml + logoHtml + accentHtml;
      return '<div class="bm-next-team bm-next-team-' + side + '">' + inner + '</div>';
    }

    function nextStripHtml(t1, t2, t1color, t2color) {
      return '<div class="bm-next-strip v2-panel bm-upnext">' +
        '<div class="bm-next-label">Up Next</div>' +
        '<div class="bm-next-match">' +
          nextStripTeamHtml(t1.name, t1.logo, t1color, 'left') +
          '<div class="bm-next-vs">VS</div>' +
          nextStripTeamHtml(t2.name, t2.logo, t2color, 'right') +
        '</div>' +
        '<span class="v2-underline bm-upnext-underline"></span>' +
        '</div>';
    }

    function countdownBoxHtml(remainingSeconds) {
      return '<div class="bm-cd-panel v2-panel">' +
        '<div class="bm-cd-label">Starting In</div>' +
        '<div class="bm-cd-digits" id="bm-timer-text">' + formatTime(remainingSeconds) + '</div>' +
        '</div>';
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'between-matches-v2');
      root.innerHTML =
        '<div id="cd-bg"></div>' +
        '<div id="cd-header" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-cams" style="animation: fadeIn 0.5s ease-out 0.15s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-countdown" style="animation: slideUp 0.5s ease-out 0.20s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-schedule" style="animation: slideUp 0.5s ease-out 0.25s both;">' +
          '<div class="slot-content"></div></div>';
      applyTextureBg(document.getElementById('cd-bg'));
    }

    // ── key: EXACTLY the state leaves render reads (see the file-header
    // comment for why this is a superset of the pre-v2 buildKey). ───────────
    function key(state) {
      var schedule = state.schedule || [];
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var countdown = state.countdown || {};
      var sched = schedule.map(function (m) {
        return [m.team1, m.team2, m.team1Logo, m.team2Logo, m.completed, m.score1, m.score2, m.label, m.time, m.upNext];
      });
      // Team colors feed the fallback strip's accent caps (render reads them
      // via the same theme-first fallback chain as the other scenes), so they
      // must be keyed or a color-only edit would never repaint the strip.
      var theme = state.theme || {};
      return [
        sched, t1.name, t1.logo, t1.color, t2.name, t2.logo, t2.color,
        state.eventName, countdown.visible !== false,
        theme.team1Color, theme.team2Color
      ];
    }

    function render(state) {
      applyTheme(state);

      var camRect = CAM_LAYOUTS.wide.single[0];
      applyCutoutMask(document.getElementById('cd-bg'), [camRect]);

      document.querySelector('#cd-header .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT Season 8', subtitle: 'COMING UP' });

      // No name pill (name: '') — see the file-header comment, decision (1).
      document.querySelector('#cd-cams .slot-content').innerHTML =
        camFrame({ rect: camRect, name: '' });

      var countdown = state.countdown || null;
      var countdownVisible = !countdown || countdown.visible !== false;
      var countdownWrap = document.getElementById('cd-countdown');
      countdownWrap.style.display = countdownVisible ? '' : 'none';
      document.querySelector('#cd-countdown .slot-content').innerHTML =
        countdownVisible ? countdownBoxHtml(getRemaining(countdown, Date.now())) : '';

      var schedule = state.schedule || [];
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var itemsHtml;
      if (schedule.length === 1) {
        // A single scheduled match gets the same horizontal strip as the
        // no-schedule fallback (owner QA batch 3 release sweep: one entry
        // through the 3-up stacked path fills the whole band with the old
        // awkward corner-label layout). Accent colors resolve by matching
        // the scheduled names against the loaded teams; unknown teams get a
        // neutral cap — the logos carry identity.
        var m1 = schedule[0];
        var theme1 = state.theme || {};
        var nameEq = function (a, b) {
          return a && b && String(a).trim().toLowerCase() === String(b).trim().toLowerCase();
        };
        var NEUTRAL = 'rgba(255,255,255,0.25)';
        var c1 = nameEq(m1.team1, t1.name) ? (theme1.team1Color || t1.color || NEUTRAL)
          : (nameEq(m1.team1, t2.name) ? (theme1.team2Color || t2.color || NEUTRAL) : NEUTRAL);
        var c2 = nameEq(m1.team2, t2.name) ? (theme1.team2Color || t2.color || NEUTRAL)
          : (nameEq(m1.team2, t1.name) ? (theme1.team1Color || t1.color || NEUTRAL) : NEUTRAL);
        itemsHtml = nextStripHtml(
          { name: m1.team1, logo: m1.team1Logo },
          { name: m1.team2, logo: m1.team2Logo },
          c1, c2);
      } else if (schedule.length) {
        var nextIdx = -1;
        for (var i = 0; i < schedule.length; i++) {
          if (!schedule[i].completed) { nextIdx = i; break; }
        }
        itemsHtml = schedule.map(function (m, idx) {
          return schedItemHtml(m, idx, !!m.upNext || idx === nextIdx);
        }).join('');
      } else {
        var theme = state.theme || {};
        var t1color = theme.team1Color || t1.color || '#3b82f6';
        var t2color = theme.team2Color || t2.color || '#ef4444';
        itemsHtml = nextStripHtml(t1, t2, t1color, t2color);
      }
      document.querySelector('#cd-schedule .slot-content').innerHTML = itemsHtml;
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });

    // ── Countdown live-tick wiring (decoupled from the keyed render above —
    // see the file-header comment). Registered as its own stateSync
    // subscriber so `latestCountdown` and the local 1s tick stay fresh on
    // every real state change, independent of whether the visual key
    // changed. startLocalTick's resolver re-queries #bm-timer-text live, so
    // it survives #cd-countdown's innerHTML being rebuilt by render(). ────
    var latestCountdown = null;
    function trackCountdown(state) {
      latestCountdown = state.countdown || null;
      startLocalTick(function () { return document.getElementById('bm-timer-text'); }, function () { return latestCountdown; });
    }
    stateSync(trackCountdown);
  </script>
</body>
</html>
