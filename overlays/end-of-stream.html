<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>End of Stream</title>
  <!-- Broadcast v2 (Plan 3 Task 6): full-screen, rebuilt onto overlay-core's
       defineOverlay. Unlike starting-soon.html/brb.html this scene had NO
       countdown and used raw stateSync(update) with no dedup key AT ALL —
       it rebuilt its entire innerHTML on every single state-sync tick
       (~every 1.5-2.5s) even though almost nothing here is state-driven.
       Given a real key now (see below).

       TEXTURE LAYER: applyTextureBg() directly on #root (map-pick.html
       pattern) — no cam cutout, same rationale as starting-soon.html/
       brb.html (documented there in full).

       BRAND MARK: the raster ./org.png (top-right, 80px, static — no
       animation in the pre-v2 scene) is replaced by a small pinwheelSVG
       crest in the same position, for the same package-wide vector-brand
       consistency as starting-soon.html/brb.html (see starting-soon.html's
       file-header comment). It keeps its NO-animation-beyond-entrance
       treatment from the original (a light scaleIn on scene load, nothing
       ongoing) — this scene doesn't call for brb.html's idle-breathing
       treatment, which the plan reserves for the "please stand by" wait
       state specifically. Crest colors are neutral ELEMENT BRAND accents
       (--elmt-red/--elmt-gold as literal hsl() strings — pinwheelSVG needs
       a literal color string, not a var()).

       SOCIALS (spec §6 / plan explicit for this scene): the 4 emoji icons
       (📺🎮💬🐦) are replaced with the SAME inline-SVG chip row as
       starting-soon.html (YouTube/Twitch/Discord markup copied verbatim —
       emoji render inconsistently in OBS's embedded CEF, this package's
       existing convention) PLUS a 4th chip for the emoji-🐦 slot: the
       classic Twitter bird mark (viewBox 0 0 24 24) — a brand icon like the
       YouTube/Twitch/Discord glyphs beside it, used the same way: to label
       the org's own social links. Label kept as "Twitter" (visual-only
       emoji swap, not a rebrand). Fully static (no state schema for
       socials) — built once in shell(), not re-emitted by render().

       KEY: this scene had none before v2. Real key now: `state.eventName`
       only — render() doesn't read theme team colors or anything else
       (the heading/crest/socials are all static; the badge only ever
       reads eventName), so per defineOverlay's "key EXACTLY what render
       reads" contract, theme team colors are deliberately NOT included —
       unlike interview.html/casters scenes, which key theme colors because
       they visibly PAINT with them (cam-frame accents, wash colors, plate
       glows). Nothing on this screen does. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    #eos-crest { position: absolute; top: 40px; right: 60px; }
    #eos-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    #eos-socials { position: absolute; left: 0; right: 0; bottom: 70px; margin: 0 auto; width: fit-content; }

    /* overlay-core appends its volatile render container as #root's LAST
       child; this scene never uses it directly (render() writes into
       #eos-event's persistent .slot-content). Every shell child above
       carries an id, so this only matches that trailing container. */
    #root > div:not([id]) { display: none; }

    .eos-heading {
      font-size: 140px; font-weight: 800; line-height: 1; letter-spacing: 6px;
      text-transform: uppercase; text-shadow: 0 6px 40px rgba(0,0,0,0.5);
    }
    #eos-event { margin-top: 26px; }

    .eos-social-row { display: flex; gap: 16px; align-items: center; }
    .eos-social-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; background: var(--panel-bg); border: var(--panel-border); border-radius: var(--panel-radius);
      font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }
    .eos-social-chip svg { width: 26px; height: 26px; fill: rgba(255,255,255,0.55); flex: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + bg helper
       must all be global before overlay-core wires the render loop. NO
       ?./?? in the inline script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    // Brand crest palette — literal hsl() strings mirroring theme-v2.css's
    // --elmt-red/--elmt-gold/--elmt-green/--elmt-blue in canonical order
    // (see file-header comment). Neutral scene → full 4-color brand mark.
    var EOS_BRAND = ['hsl(0 85% 60%)', 'hsl(45 95% 55%)', 'hsl(140 70% 50%)', 'hsl(200 90% 55%)'];

    // ── Static socials row (no state) — same SVG markup as starting-soon.html
    // plus a 4th "Twitter" chip replacing the old 🐦 emoji (see file-header
    // comment). Built once by shell(), not render(). ────────────────────────
    function socialsHtml() {
      return '<div class="eos-social-row">' +
        '<div class="eos-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/></svg>' +
          '<span>YouTube</span></div>' +
        '<div class="eos-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>' +
          '<span>Twitch</span></div>' +
        '<div class="eos-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>' +
          '<span>Discord</span></div>' +
        '<div class="eos-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M23.953 4.57a10 10 0 0 1-2.825.775 4.958 4.958 0 0 0 2.163-2.723c-.951.555-2.005.959-3.127 1.184a4.92 4.92 0 0 0-8.384 4.482C7.69 8.095 4.067 6.13 1.64 3.162a4.822 4.822 0 0 0-.666 2.475c0 1.71.87 3.213 2.188 4.096a4.904 4.904 0 0 1-2.228-.616v.06a4.923 4.923 0 0 0 3.946 4.827 4.996 4.996 0 0 1-2.212.085 4.936 4.936 0 0 0 4.604 3.417 9.867 9.867 0 0 1-6.102 2.105c-.39 0-.779-.023-1.17-.067a13.995 13.995 0 0 0 7.557 2.209c9.053 0 13.998-7.496 13.998-13.985 0-.21 0-.42-.015-.63a9.935 9.935 0 0 0 2.46-2.548l-.047-.02z"/></svg>' +
          '<span>Twitter</span></div>' +
        '</div>';
    }

    // ── shell: builds the persistent chrome exactly ONCE — heading + socials
    // are 100% static (never state-driven); only #eos-event is re-emitted by
    // render(). ──────────────────────────────────────────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'end-of-stream-v2');
      applyTextureBg(root);
      root.innerHTML =
        '<div id="eos-crest" style="animation: scaleIn 0.6s ease-out 0.10s both;">' +
          pinwheelSVG({ colors: EOS_BRAND, size: 72 }) +
        '</div>' +
        '<div id="eos-content">' +
          '<div class="eos-heading" style="animation: fadeIn 0.7s ease-out 0.15s both;">SEE YOU<br>NEXT TIME!</div>' +
          '<div id="eos-event" style="animation: fadeIn 0.7s ease-out 0.30s both;"><div class="slot-content"></div></div>' +
        '</div>' +
        '<div id="eos-socials" style="animation: slideUp 0.5s ease-out 0.35s both;">' + socialsHtml() + '</div>';
    }

    // ── key: eventName only (see file-header comment). ──────────────────
    function key(state) {
      return [state.eventName];
    }

    function render(state) {
      applyTheme(state);
      document.querySelector('#eos-event .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT SEASON 8' });
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });
  </script>
</body>
</html>
