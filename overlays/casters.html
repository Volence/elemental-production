<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Casters</title>
  <!-- Broadcast v2: same stack as gameplay-hud.html/hero-bans.html — no Google
       Fonts (Geist via @font-face in fonts-v2.css); theme-v2.css/fonts-v2.css/
       animations.css own tokens + shared component-internal styles; this
       file's own <style> owns scene-local layout. This is the Plan 3 Task 2
       cam-scene TEMPLATE — Tasks 3-4's caster variants copy this skeleton and
       only swap the deck. The cam-cutout mask machinery (camMaskDataUri +
       applyCutoutMask) is NOT copied inline anymore — it lives in
       bg-helper.js (shared with every scene that needs a cutout layer);
       just include the script tag and call applyCutoutMask(bgEl, camRects).

       Layout A (design spec §5 / casters-layout.html mockup, option A —
       option B's rail is REJECTED): two equal cams high-center, transparent
       CUTOUTS (camFrame() — hairline border, gradient-underline base edge, a
       name pill hanging off the bottom), event header top-center, a matchup
       deck below the cams. The old hardcoded rainbow accent bars are gone —
       v2 uses camFrame's built-in gradient-4 underline instead.

       THE CUTOUT INVARIANT: caster/interviewee browser sources sit BEHIND
       this overlay in OBS, so anywhere this page paints opaque pixels the
       cam is hidden. Every other v2 scene calls applyTextureBg(root) directly
       on #root — that would paint the petal texture straight over the cam
       windows too. Instead the texture lives on a DEDICATED layer (#cd-bg,
       a shell-built, id'd sibling of the cam/header/deck wrappers, never
       #root itself) with a CSS mask: an inline data: SVG (white rect = keep,
       black rect = hole, one hole per active cam rect) punches transparent
       windows at exactly CAM_LAYOUTS.desk's coordinates. Rebuilt (well,
       re-pointed — see applyCutoutMask() in bg-helper.js) whenever
       casterLayout changes, via style.setProperty on the SAME persistent
       #cd-bg node — same "touch a custom property on a persistent shell
       node, don't rebuild the node" pattern hero-bans.html's wash divs use
       for team-color changes. ?bg=transparent (preserved from the old scene,
       used for flythrough-style embeds) skips building #cd-bg entirely —
       frames and deck still render over a fully transparent page. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Petal-texture cutout layer (see the cutout invariant comment above).
       Full canvas; the mask (set in render, not here — it depends on the
       live casterLayout) punches the transparent cam windows. Absent
       entirely under ?bg=transparent. */
    #cd-bg { position: absolute; inset: 0; }

    /* ── Three positioned wrapper slots (built ONCE by shell) ────────────
       Centered wrappers use width:fit-content + margin:auto rather than
       left:50%+translateX(-50%): the slideDown/slideUp shell entrances
       animate `transform`, and its `both` fill would otherwise clobber a
       translateX and de-center the wrapper permanently (same gotcha
       documented on gameplay-hud's #hud-center / map-intro's #mi-deck). */
    #cd-header { position: absolute; top: 40px; left: 0; right: 0; margin: 0 auto; width: fit-content; }
    /* Cam frames sit directly in canvas coordinates (CAM_LAYOUTS rects are
       already 1920x1080-space) — this wrapper is a plain full-canvas
       positioning context, not itself animated independently of its rects
       (camFrame's own inline geometry IS the positioning). */
    #cd-cams { position: absolute; inset: 0; }
    #cd-deck { position: absolute; bottom: 7%; left: 0; right: 0; margin: 0 auto; width: fit-content; }

    /* ── Matchup deck (layout-0 "no frames" case still shows this, centered
       under where the cams would be — deck position never depends on
       casterLayout) ── */
    .cd-deck-panel {
      display: flex; align-items: center; gap: 20px;
      background: var(--panel-bg); border: var(--panel-border); border-radius: var(--panel-radius);
      padding: 12px 24px;
    }
    .cd-deck-team { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .cd-deck-team-right { flex-direction: row-reverse; }
    .cd-deck-logo {
      width: 32px; height: 32px; border-radius: var(--panel-radius);
      object-fit: cover; flex: none; border: 1px solid rgba(255,255,255,0.15);
    }
    .cd-deck-swatch { width: 32px; height: 32px; border-radius: var(--panel-radius); flex: none; }
    .cd-deck-name {
      font-size: 28px; font-weight: 800; color: #fff; text-transform: uppercase;
      letter-spacing: 0.5px; white-space: nowrap;
    }
    .cd-deck-hub { display: flex; align-items: center; flex: none; }
    .cd-deck-sep { color: rgba(255,255,255,0.3); font-size: 22px; flex: none; }
    .cd-next-chip {
      color: rgba(255,255,255,0.6); font-weight: 700; font-size: 22px;
      letter-spacing: 0.5px; text-transform: uppercase; white-space: nowrap; flex: none;
    }

    /* overlay-core appends its volatile render container as #root's LAST
       child (after everything shell builds). This scene never uses it —
       render() writes into each wrapper's persistent .slot-content instead
       (the render-vs-reflow split, same as the other v2 scenes) — so the
       trailing, id-less container is hidden. Every shell child above
       (#cd-bg/#cd-header/#cd-cams/#cd-deck) carries an id, so this only
       matches that container. */
    #root > div:not([id]) { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + the cam
       geometry constants must all be global before overlay-core wires the
       render loop. NO ?./?? in the inline script (OBS Chromium 103 floor);
       var/function/string-concat style for consistency with the other v2
       scenes. -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./cam-layout.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }

    // One deck-scale team block: logo/swatch + name. `side` mirrors the row
    // (logo outer, name inner toward the hub) — same left/right convention as
    // components-v2.js's teamPlate()/map-intro's teamBlockHtml().
    function teamBlockHtml(team, color, side) {
      var sideClass = side === 'right' ? ' cd-deck-team-right' : '';
      // v2-idle-breathe (Owner QA batch 2 Task 3b): leaf under #cd-deck's own
      // entrance `both` fill — safe, see theme-v2.css's idle-motion rules.
      var logoHtml = team.logo
        ? safeImg(team.logo, { 'class': 'cd-deck-logo v2-idle-breathe', alt: team.name || '' })
        : '<div class="cd-deck-swatch" style="background:' + escapeHtml(color) + '"></div>';
      return '<div class="cd-deck-team' + sideClass + '">' + logoHtml +
        '<div class="cd-deck-name">' + escapeHtml(team.name || '') + '</div></div>';
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    // #cd-bg (texture + cutout mask target) is built here but its mask is set
    // by render (depends on casterLayout). The three slot wrappers carry the
    // ONLY entrance animations (state-sync's replayAnimation re-runs them on
    // OBS show/hide); render() only ever rewrites their .slot-content, so
    // they never replay on a data tick. data-shell-marker proves the shell
    // ran once, same convention as the other v2 scenes.
    function shell(root) {
      root.setAttribute('data-shell-marker', 'casters-v2');
      var transparent = new URLSearchParams(window.location.search).get('bg') === 'transparent';
      var bgHtml = transparent ? '' : '<div id="cd-bg"></div>';
      root.innerHTML =
        bgHtml +
        '<div id="cd-header" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-cams" style="animation: fadeIn 0.5s ease-out 0.15s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-deck" style="animation: slideUp 0.5s ease-out 0.25s both;">' +
          '<div class="slot-content"></div></div>';
      if (!transparent) applyTextureBg(document.getElementById('cd-bg'));
    }

    // ── key: EXACTLY the state leaves render reads ──────────────────────────
    // maps is reduced to [status, name] per entry — that's all findCurrentMap
    // needs (the deck's NEXT chip). casters is reduced to just the names —
    // camUrl/visible aren't rendered by this overlay (the cam feed itself is
    // an OBS source behind the cutout, not something this page draws).
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var casters = (state.casters || []).map(function (c) { return c && c.name; });
      var maps = (state.maps || []).map(function (m) { return [m.status, m.name]; });
      return [
        t1.name, t1.logo, t1.color, scoreOf(t1),
        t2.name, t2.logo, t2.color, scoreOf(t2),
        casters, state.casterLayout,
        maps, state.eventName,
        theme.team1Color, theme.team2Color
      ];
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var casters = state.casters || [];
      var layout = (state.casterLayout === undefined || state.casterLayout === null) ? 2 : state.casterLayout;
      var camRects = layout === 0 ? [] : (layout === 1 ? CAM_LAYOUTS.desk.single : CAM_LAYOUTS.desk.dual);

      applyCutoutMask(document.getElementById('cd-bg'), camRects);

      // ── header: event name + gradient underline, top-center ────────────
      document.querySelector('#cd-header .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT Season 8' });

      // ── cam frames: one camFrame() per active rect, casters[i].name in
      // its pill (layout 0 -> camRects is empty -> no frames at all) ──────
      var camsHtml = '';
      for (var i = 0; i < camRects.length; i++) {
        var caster = casters[i] || {};
        camsHtml += camFrame({ rect: camRects[i], name: caster.name || '' });
      }
      document.querySelector('#cd-cams .slot-content').innerHTML = camsHtml;

      // ── matchup deck: team blocks flanking a pinwheel hub carrying the
      // TRUE series score, + a NEXT: <map> chip when findCurrentMap has one
      // (mirrors gameplay-hud/map-intro's hubText + currentMapName pattern) ──
      var maps = state.maps || [];
      var current = findCurrentMap(maps);
      var hubText = scoreOf(t1) + '·' + scoreOf(t2);
      var nextHtml = current.name
        ? '<span class="cd-deck-sep">|</span><div class="cd-next-chip">NEXT: ' + escapeHtml(current.name) + '</div>'
        : '';
      document.querySelector('#cd-deck .slot-content').innerHTML =
        '<div class="cd-deck-panel">' +
          teamBlockHtml(t1, t1color, 'left') +
          '<div class="cd-deck-hub">' + pinwheelSVG({ color1: t1color, color2: t2color, size: 48, hubText: hubText }) + '</div>' +
          teamBlockHtml(t2, t2color, 'right') +
          nextHtml +
        '</div>';
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });
  </script>
</body>
</html>
