<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Casters Scoreboard</title>
  <!-- Broadcast v2 (Plan 3 Task 3): a RESKIN of the v1 scoreboard onto the
       casters.html cam-scene template. The chrome (petal texture + cutout cam
       frames + event header) and the deck's LOOK are v2; the DATA machinery
       (playerStats table, per-map bans fallback chain, map-index resolution,
       auto-advance, switchMap interactivity) is preserved verbatim, only
       re-expressed on overlay-core.

       Cutout invariant (see casters.html for the long form): caster browser
       sources sit BEHIND this overlay in OBS; the petal texture lives on a
       dedicated #cd-bg layer with a CSS luminance mask (applyCutoutMask,
       bg-helper.js) that punches transparent windows at exactly
       CAM_LAYOUTS.desk's coordinates — the SAME rects as casters.html (the v1
       420x240 divergence is gone). ?bg=transparent is deliberately NOT
       supported here (a casters.html-only feature); this scene always paints
       the texture.

       overlay-core mapping of the v1 hand-rolled loop:
       - switchMap(i): v1 set the local `currentMap` then nulled lastRenderKey
         and re-ran update(); v2 sets `currentMap` then calls the captured
         handle.forceRender() (the sanctioned "repaint with unchanged state"
         escape hatch). `currentMap` is LOCAL interaction state and is NOT in
         the key — forceRender is its repaint path.
       - the malformed-round guard: v1 early-returned AFTER stashing lastState
         but WITHOUT committing lastRenderKey, so a corrected same-key frame
         still repainted. v2 expresses this as `validate` returning false for a
         malformed selected round — overlay-core commits the key ONLY at a
         genuine render point, so a false from validate gives the no-latch
         behavior for free.
       - auto-advance (new map's stats -> show latest): v1 reset currentMap
         when playerStats.length changed; v2 runs the same reset inside
         validate (pre-dedup, pre-render) so a local switchMap click — which
         doesn't change the stats length — never trips it. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Petal-texture cutout layer (mask set in render from the live layout). */
    #cd-bg { position: absolute; inset: 0; }

    /* Positioned wrapper slots (built ONCE by shell). Centered wrappers use
       width:fit-content + margin:auto rather than left:50%+translateX so the
       slideDown/slideUp entrance transforms don't clobber the centering. */
    #cd-header { position: absolute; top: 40px; left: 0; right: 0; margin: 0 auto; width: fit-content; }
    #cd-cams { position: absolute; inset: 0; }
    /* Deck sits below the cam frames. render() sets the exact `top` per layout
       (dual cams end higher than single, and layout 0 has no cams at all) so
       each layout gets the most vertical room; the CSS default is the single-
       cam value. fitPanelToCanvas zoom-shrinks the panel if the dense table
       would still run past 1080. The cam frames NEVER move — only the deck
       panel is repositioned/scaled. */
    #cd-deck { position: absolute; top: 610px; left: 0; right: 0; margin: 0 auto; width: fit-content; }

    /* ── Scoreboard deck panel ─────────────────────────────────────────────
       .v2-panel supplies the surface (dark panel + hairline + sharp corners);
       these own the scoreboard-local layout. Densities are tuned so the full
       10-player table + totals stays under the single-cam vertical budget at
       the fitPanel 0.6 floor (no bottom clipping). */
    /* Owner QA batch 2 (3a): +200px (~15%) — measured comfortably inside the
       1920 canvas since #cd-deck centers via margin:auto/fit-content; the
       deck sits well below the cam frames (top 610 vs cams' max bottom
       ~547px) so no horizontal collision either. fitPanelToCanvas still
       guards vertical overflow unchanged. */
    .sb-panel { width: 1560px; padding: 14px 24px; }

    .sb-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 10px; padding-bottom: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sb-title-area { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .sb-title-row { display: flex; align-items: baseline; gap: 12px; }
    .sb-title {
      font-size: 30px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .sb-map-mode {
      font-size: 16px; font-weight: 700; color: rgba(255,255,255,0.4);
      text-transform: uppercase; letter-spacing: 1px; white-space: nowrap;
    }
    .sb-title-underline { width: 220px; }
    .sb-header-right { display: flex; align-items: center; gap: 18px; }
    .sb-score { font-size: 34px; font-weight: 800; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
    .sb-score .sb-dash { color: rgba(255,255,255,0.25); }

    /* Map selector — v2 chips; active = white glow (same "now" signal as the
       live pip / map-pick's live column). */
    .sb-map-selector { display: flex; gap: 6px; }
    .sb-map-btn {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.16);
      border-radius: var(--panel-radius); padding: 7px 14px; font-size: 15px; font-weight: 800;
      color: rgba(255,255,255,0.65); cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px;
      pointer-events: auto; white-space: nowrap;
    }
    .sb-map-btn:hover { background: rgba(255,255,255,0.12); }
    .sb-map-btn.active { background: #fff; color: #0a0c11; border-color: #fff; box-shadow: 0 0 10px rgba(255,255,255,0.7); }

    /* Hero bans row */
    .sb-bans {
      display: flex; align-items: flex-start; justify-content: center; gap: 22px;
      margin-bottom: 8px; padding-bottom: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
    .sb-ban-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .sb-ban-label {
      font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
      color: rgba(255,255,255,0.4); align-self: center; padding-top: 18px;
    }

    /* Two-team grid */
    .sb-teams-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .sb-team-block { border-radius: var(--panel-radius); overflow: hidden; }
    .sb-team-heading {
      padding: 4px 10px; font-size: 28px; font-weight: 800;
      display: flex; justify-content: space-between; align-items: center;
      text-transform: uppercase; letter-spacing: 0.5px;
    }
    .sb-team-heading .sb-team-logo { width: 30px; height: 30px; border-radius: var(--panel-radius); object-fit: cover; margin-right: 10px; }
    .sb-team-heading .sb-team-info { display: flex; align-items: center; min-width: 0; }
    .sb-team-heading .sb-team-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-win-badge {
      background: var(--elmt-green); color: #06210f; font-size: 13px; font-weight: 800;
      padding: 3px 9px; border-radius: var(--panel-radius); text-transform: uppercase; letter-spacing: 1px; flex: none;
    }
    .sb-stat-header {
      display: grid; grid-template-columns: 150px repeat(6, 1fr);
      gap: 2px; padding: 3px 10px; font-size: 14px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.5px; color: rgba(255,255,255,0.35);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .sb-player-row {
      display: grid; grid-template-columns: 150px repeat(6, 1fr);
      gap: 2px; padding: 3px 10px; font-size: 22px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .sb-player-name { font-weight: 700; display: flex; align-items: center; gap: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-role-tag {
      font-size: 12px; font-weight: 800; padding: 2px 6px; border-radius: 2px;
      text-transform: uppercase; flex: none; letter-spacing: 0.5px;
    }
    .sb-role-tank { background: rgba(245,158,11,0.22); color: var(--elmt-gold); }
    .sb-role-damage { background: rgba(239,68,68,0.22); color: var(--elmt-red); }
    .sb-role-support { background: rgba(34,197,94,0.22); color: var(--elmt-green); }
    .sb-role-unknown { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.55); }
    .sb-stat-val { text-align: center; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.8); font-weight: 600; }

    /* Comparison totals footer */
    .sb-totals { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255,255,255,0.1); }
    .sb-totals-section-label {
      font-size: 16px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px;
      color: rgba(255,255,255,0.35); text-align: center; margin-bottom: 6px;
    }
    .sb-totals-names { display: grid; grid-template-columns: 1fr auto 1fr; margin-bottom: 4px; }
    .sb-totals-name-left { text-align: right; padding-right: 22px; font-size: 20px; font-weight: 800; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-totals-name-right { text-align: left; padding-left: 22px; font-size: 20px; font-weight: 800; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .sb-totals-name-spacer { min-width: 120px; }
    .sb-totals-row {
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .sb-totals-row:last-child { border-bottom: none; }
    .sb-totals-val-left { text-align: right; padding-right: 22px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sb-totals-val-right { text-align: left; padding-left: 22px; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .sb-totals-label {
      text-align: center; font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
      color: rgba(255,255,255,0.4); min-width: 120px;
    }
    .sb-totals-val-left.higher, .sb-totals-val-right.higher { color: var(--elmt-green); }

    /* Empty state */
    .sb-empty { padding: 40px; text-align: center; color: rgba(255,255,255,0.4); font-size: 20px; font-weight: 600; }

    /* Hide overlay-core's trailing volatile container (this scene renders into
       each shell wrapper's .slot-content instead). Every shell child is id'd,
       so this only matches that container. */
    #root > div:not([id]) { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./cam-layout.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];

    // LOCAL interaction state (deliberately NOT in the key — forceRender is its
    // repaint path). currentMap: overlay map-button selection (-1 = auto).
    // lastStatsLen: drives the auto-advance reset in validate().
    var currentMap = -1;
    var lastStatsLen = 0;

    var roleOrder = { 'Tank': 0, 'Damage': 1, 'Support': 2 };

    // Dep: hero portraits for the ban tiles (server pre-injects __HERO_DATA__).
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }
    function heroNameToKey(name) {
      var hero = findHeroEntry(heroData, name);
      return hero ? hero.key : '';
    }
    function getHeroPortrait(key) {
      var hero = findHeroEntry(heroData, key);
      return hero ? hero.portrait : '';
    }

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }
    function normalizeLayout(v) {
      return (v === undefined || v === null) ? 2 : v;
    }

    // Map-index resolution chain (verbatim from v1): overlay click > dashboard
    // selection > latest map with stats. currentMap is applied only when >= 0.
    function resolveIdx(state) {
      var stats = state.playerStats || [];
      if (currentMap >= 0) return Math.min(currentMap, stats.length - 1);
      var serverIdx = state.selectedMapIdx;
      if (serverIdx !== undefined && serverIdx !== null && serverIdx >= 0) {
        return Math.min(serverIdx, stats.length - 1);
      }
      return stats.length - 1;
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'casters-scoreboard-v2');
      root.innerHTML =
        '<div id="cd-bg"></div>' +
        '<div id="cd-header" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-cams" style="animation: fadeIn 0.5s ease-out 0.15s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-deck" style="animation: slideUp 0.5s ease-out 0.25s both;">' +
          '<div class="slot-content"></div></div>';
      applyTextureBg(document.getElementById('cd-bg'));
    }

    // ── validate: auto-advance + malformed-round guard (see header comment) ──
    function validate(state) {
      var stats = state.playerStats || [];
      // Auto-advance: a new map's stats (length changed) drop any sticky
      // overlay-click selection so the freshest map shows. Here (pre-dedup) so
      // a local switchMap click — stats length unchanged — never trips it.
      // CAUTION: this mutation relies on overlay-core calling validate exactly
      // ONCE per frame, pre-dedup — a speculative/double validate call would
      // double-fire the advance. Also note a deliberate ordering change vs v1:
      // auto-advance now runs BEFORE the empty-state check, so a transient
      // empty->repopulated stats blip resets a click selection to auto (v1
      // kept it). Freshest-map-wins is the safer on-air default.
      if (stats.length !== lastStatsLen) {
        lastStatsLen = stats.length;
        currentMap = -1;
      }
      var t1 = (state.teams && state.teams.team1) || {};
      // Empty state (no stats / no team) is a LEGITIMATE render (v1 committed
      // its key and drew the placeholder), so allow it.
      if (!stats.length || !t1.name) return true;
      // Malformed selected round -> skip WITHOUT committing the key so a
      // corrected same-key frame still repaints (v1's uncommitted early return).
      var round = stats[resolveIdx(state)];
      if (!round || !round.teams || round.teams.length < 2) return false;
      return true;
    }

    // ── key: the state leaves render reads. currentMap (local click state) is
    // intentionally absent — forceRender() is its repaint path. ──────────────
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var casters = (state.casters || []).map(function (c) { return c && c.name; });
      var maps = (state.maps || []).map(function (m) { return [m.status, m.name]; });
      return [
        t1.name, t1.logo, t1.color, scoreOf(t1),
        t2.name, t2.logo, t2.color, scoreOf(t2),
        casters, state.casterLayout,
        state.playerStats, state.bestOf, state.eventName,
        state.selectedMapIdx, state.heroBans, state.perMapBans,
        maps, theme.team1Color, theme.team2Color
      ];
    }

    function renderChrome(state, camRects) {
      document.querySelector('#cd-header .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT Season 8', subtitle: 'SCOREBOARD' });

      var casters = state.casters || [];
      var camsHtml = '';
      for (var i = 0; i < camRects.length; i++) {
        var caster = casters[i] || {};
        camsHtml += camFrame({ rect: camRects[i], name: caster.name || '' });
      }
      document.querySelector('#cd-cams .slot-content').innerHTML = camsHtml;
    }

    // One ban tile (v2 banTile — the red "denied" slash replaces v1's ✕). The
    // portrait resolves via heroData, falling back to the FACEIT-provided ban
    // image when the hero isn't in the pack.
    function banCell(ban, color) {
      var heroName = (typeof ban === 'string') ? ban : (ban && ban.name) || '';
      if (!heroName) return '';
      var heroKey = heroNameToKey(heroName);
      var portrait = getHeroPortrait(heroKey) || proxyImg((typeof ban === 'object' && ban) ? ban.image : '');
      return '<div class="sb-ban-cell">' +
        banTile({ portrait: portrait, heroName: heroName, teamColor: color, size: 56 }) +
        '</div>';
    }

    // Per-map bans fallback chain (verbatim from v1): perMapBans[idx] wins;
    // fall back to heroBans.team{1,2}[0] when this map has no per-map bans.
    function bansHtml(state, idx, t1Color, t2Color) {
      var perMapBans = state.perMapBans || [];
      var mapBans = perMapBans[idx];
      var t1Ban = '', t2Ban = '';
      if (mapBans && (mapBans.team1Ban || mapBans.team2Ban)) {
        t1Ban = mapBans.team1Ban ? banCell(mapBans.team1Ban, t1Color) : '';
        t2Ban = mapBans.team2Ban ? banCell(mapBans.team2Ban, t2Color) : '';
      } else {
        var hb = state.heroBans || {};
        t1Ban = (hb.team1 || [])[0] ? banCell((hb.team1 || [])[0], t1Color) : '';
        t2Ban = (hb.team2 || [])[0] ? banCell((hb.team2 || [])[0], t2Color) : '';
      }
      if (!t1Ban && !t2Ban) return '';
      return '<div class="sb-bans">' + t1Ban +
        '<span class="sb-ban-label">Bans</span>' + t2Ban + '</div>';
    }

    function teamBlockHtml(team, teamData, color) {
      var players = (team.players || []).slice().sort(function (a, b) {
        return (roleOrder[a.role] === undefined ? 9 : roleOrder[a.role]) -
               (roleOrder[b.role] === undefined ? 9 : roleOrder[b.role]);
      });
      var rows = players.map(function (p) {
        var role = p.role || 'Unknown';
        var roleTag = '<span class="sb-role-tag sb-role-' + escapeHtml(role.toLowerCase()) + '">' +
          escapeHtml(role.charAt(0)) + '</span>';
        var kd = (p.kdRatio === undefined || p.kdRatio === null) ? 0 : p.kdRatio;
        return '<div class="sb-player-row">' +
          '<div class="sb-player-name">' + roleTag + '<span>' + escapeHtml(p.nickname || '') + '</span></div>' +
          '<div class="sb-stat-val">' + Number(kd).toFixed(1) + '</div>' +
          '<div class="sb-stat-val">' + (p.kills || 0) + '</div>' +
          '<div class="sb-stat-val">' + (p.deaths || 0) + '</div>' +
          '<div class="sb-stat-val">' + (p.finalBlows || 0) + '</div>' +
          '<div class="sb-stat-val">' + Number(p.damageDealt || 0).toLocaleString() + '</div>' +
          '<div class="sb-stat-val">' + Number(p.healingDone || 0).toLocaleString() + '</div>' +
          '</div>';
      }).join('');

      // v2-idle-breathe (Owner QA batch 2 Task 3b): leaf under #cd-deck's
      // entrance `both` fill — safe, see theme-v2.css's idle-motion rules.
      var logoHtml = (teamData && teamData.logo)
        ? safeImg(teamData.logo, { 'class': 'sb-team-logo v2-idle-breathe', alt: team.name || '' }) : '';
      var winBadge = (team.stats && team.stats.teamWin) ? '<span class="sb-win-badge">Win</span>' : '';

      // Legibility floor per theme-helpers' legibleColor doc: applies to
      // text AND thin strokes (this 3px border-top qualifies), not just
      // fills/washes/swatches — so both the border and the heading text use
      // the same lifted color.
      var legible = legibleColor(color, 0.45);
      return '<div class="sb-team-block" style="border-top:3px solid ' + escapeHtml(legible) + '">' +
        '<div class="sb-team-heading" style="color:' + escapeHtml(legible) + '">' +
          '<div class="sb-team-info">' + logoHtml +
            '<span class="sb-team-name">' + escapeHtml(team.name || '') + '</span></div>' +
          winBadge +
        '</div>' +
        '<div class="sb-stat-header">' +
          '<div>Player</div><div class="sb-stat-val">K/D</div><div class="sb-stat-val">Elims</div>' +
          '<div class="sb-stat-val">Deaths</div><div class="sb-stat-val">FB</div>' +
          '<div class="sb-stat-val">Dmg</div><div class="sb-stat-val">Heal</div>' +
        '</div>' + rows +
        '</div>';
    }

    function totalsHtml(round, t1, t2, t1Color, t2Color) {
      // Raw team-color TEXT (not fills) — legibility floor per theme-helpers'
      // legibleColor, same treatment as sb-team-heading above.
      var t1Legible = legibleColor(t1Color, 0.45);
      var t2Legible = legibleColor(t2Color, 0.45);
      var r1 = round.teams[0], r2 = round.teams[1];
      var t1Dmg = r1.players.reduce(function (s, p) { return s + (p.damageDealt || 0); }, 0);
      var t2Dmg = r2.players.reduce(function (s, p) { return s + (p.damageDealt || 0); }, 0);
      var t1Heal = r1.players.reduce(function (s, p) { return s + (p.healingDone || 0); }, 0);
      var t2Heal = r2.players.reduce(function (s, p) { return s + (p.healingDone || 0); }, 0);
      var s1 = r1.stats || {}, s2 = r2.stats || {};

      var rows = [
        ['Eliminations', s1.totalEliminations, s2.totalEliminations],
        ['Deaths', s1.totalDeaths, s2.totalDeaths],
        ['Final Blows', s1.totalFinalBlows, s2.totalFinalBlows],
        ['Damage', t1Dmg, t2Dmg],
        ['Healing', t1Heal, t2Heal]
      ];
      if (s1.objectiveTime !== undefined && s1.objectiveTime !== null) {
        rows.push(['Obj Time', s1.objectiveTime, s2.objectiveTime]);
      }

      var rowsHtml = rows.map(function (row) {
        var label = row[0], v1 = row[1], v2 = row[2];
        var isTime = label === 'Obj Time';
        var d1 = isTime ? (v1 + 's') : Number(v1 || 0).toLocaleString();
        var d2 = isTime ? (v2 + 's') : Number(v2 || 0).toLocaleString();
        var lowerBetter = label === 'Deaths';
        var h1 = lowerBetter ? (v1 < v2) : (v1 > v2);
        var h2 = lowerBetter ? (v2 < v1) : (v2 > v1);
        var st1 = h1 ? '' : (' style="color:' + escapeHtml(t1Legible) + '"');
        var st2 = h2 ? '' : (' style="color:' + escapeHtml(t2Legible) + '"');
        return '<div class="sb-totals-row">' +
          '<div class="sb-totals-val-left ' + (h1 ? 'higher' : '') + '"' + st1 + '>' + d1 + '</div>' +
          '<div class="sb-totals-label">' + escapeHtml(label) + '</div>' +
          '<div class="sb-totals-val-right ' + (h2 ? 'higher' : '') + '"' + st2 + '>' + d2 + '</div>' +
          '</div>';
      }).join('');

      return '<div class="sb-totals">' +
        '<div class="sb-totals-section-label">Team Totals</div>' +
        '<div class="sb-totals-names">' +
          '<div class="sb-totals-name-left" style="color:' + escapeHtml(t1Legible) + '">' + escapeHtml(t1.name || '') + '</div>' +
          '<div class="sb-totals-name-spacer"></div>' +
          '<div class="sb-totals-name-right" style="color:' + escapeHtml(t2Legible) + '">' + escapeHtml(t2.name || '') + '</div>' +
        '</div>' + rowsHtml +
        '</div>';
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1Color = theme.team1Color || t1.color || '#3b82f6';
      var t2Color = theme.team2Color || t2.color || '#ef4444';
      // Raw team-color TEXT (not fills) — legibility floor, hoisted once for
      // this render's header score span (same pattern as totalsHtml above).
      var t1Legible = legibleColor(t1Color, 0.45);
      var t2Legible = legibleColor(t2Color, 0.45);

      var layout = normalizeLayout(state.casterLayout);
      var camRects = layout === 0 ? [] : (layout === 1 ? CAM_LAYOUTS.desk.single : CAM_LAYOUTS.desk.dual);
      applyCutoutMask(document.getElementById('cd-bg'), camRects);
      renderChrome(state, camRects);

      // Deck top per layout: dual cams end at y~482 (+pill ~532), single at
      // y~547 (+pill ~597), layout 0 has no cams. Placing the deck just under
      // each maximises the fitPanel budget so the common dual view barely
      // shrinks while single (taller cams) shrinks more. Cam frames don't move.
      document.getElementById('cd-deck').style.top =
        layout === 0 ? '170px' : (layout === 1 ? '610px' : '545px');

      var deck = document.querySelector('#cd-deck .slot-content');
      var stats = state.playerStats || [];

      // Empty state (no stats / no team): v2 panel placeholder. Header + cams
      // still render above.
      if (!stats.length || !t1.name) {
        deck.innerHTML = '<div class="sb-panel v2-panel"><div class="sb-empty">' +
          'No stats available — load a match to see the scoreboard</div></div>';
        return;
      }

      var idx = resolveIdx(state);
      var round = stats[idx];

      // Map selector chips
      var mapBtns = stats.map(function (r, i) {
        var mapName = (state.maps && state.maps[i] && state.maps[i].name) || ('Map ' + (i + 1));
        return '<button class="sb-map-btn ' + (i === idx ? 'active' : '') + '" onclick="switchMap(' + i + ')">' +
          escapeHtml(mapName) + '</button>';
      }).join('');

      // Title = the real map name for the displayed round (state.maps is the
      // source of truth). NEVER round.map — that's a FACEIT hex map id
      // (e.g. 0X0800000000000827), which the owner saw printed on stream.
      var titleName = (state.maps && state.maps[idx] && state.maps[idx].name) || 'Match Stats';
      var headerHtml =
        '<div class="sb-header">' +
          '<div class="sb-title-area">' +
            '<div class="sb-title-row">' +
              '<span class="sb-title">' + escapeHtml(titleName) + '</span>' +
              '<span class="sb-map-mode">' + escapeHtml(round.mapMode || '') + '</span>' +
            '</div>' +
            '<span class="v2-underline sb-title-underline"></span>' +
          '</div>' +
          '<div class="sb-header-right">' +
            '<div class="sb-score">' +
              '<span style="color:' + escapeHtml(t1Legible) + '">' + scoreOf(t1) + '</span>' +
              '<span class="sb-dash"> - </span>' +
              '<span style="color:' + escapeHtml(t2Legible) + '">' + scoreOf(t2) + '</span>' +
            '</div>' +
            '<div class="sb-map-selector">' + mapBtns + '</div>' +
          '</div>' +
        '</div>';

      var teamHtml =
        '<div class="sb-teams-grid">' +
          teamBlockHtml(round.teams[0], t1, t1Color) +
          teamBlockHtml(round.teams[1], t2, t2Color) +
        '</div>';

      deck.innerHTML =
        '<div class="sb-panel v2-panel">' +
          headerHtml +
          bansHtml(state, idx, t1Color, t2Color) +
          teamHtml +
          totalsHtml(round, t1, t2, t1Color, t2Color) +
        '</div>';

      // Single-cam layout grows the cam frame, and the dense table can run past
      // 1080 — zoom-shrink the DECK PANEL only (never the cam frames, whose OBS
      // caster sources are aligned to the canonical rects).
      fitPanelToCanvas(deck.querySelector('.sb-panel'));
    }

    var handle = defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      validate: validate,
      render: render,
      deps: [loadHeroes]
    });

    // Map-button interactivity: set the local selection then force a repaint
    // (state is unchanged by a local click, so the key wouldn't move — that's
    // exactly what forceRender is for). Replaces v1's lastRenderKey=null hack.
    window.switchMap = function (i) {
      currentMap = i;
      handle.forceRender();
    };

    // The first render can land while Geist is still loading (fallback-font
    // metrics are TALLER, so the deck measures ~120px too tall) and/or during
    // the deck's entrance animation. fitPanelToCanvas then over-shrinks, and on
    // a static scene with no later data tick that zoom sticks. Re-fit once the
    // real font is ready AND once more after the entrance (0.75s) settles — a
    // fresh render at steady state measures correctly.
    function refitDeck() { handle.forceRender(); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitDeck);
    setTimeout(refitDeck, 1200);
  </script>
</body>
</html>
