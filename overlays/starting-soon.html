<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Starting Soon Overlay</title>
  <!-- Broadcast v2 (Plan 3 Task 6): countdown full-screen, rebuilt onto
       overlay-core's defineOverlay (was hand-rolled buildKey/lastBuiltKey +
       raw stateSync(update) — no shell/render split, no dedup helper, and
       ES2020 ?. throughout, which the OBS Chromium 103 floor + this
       package's "scene scripts ES2019-safe, no ?./??" rule both forbid).

       TEXTURE LAYER: no cam cutout in this scene (full-screen, no cams) —
       applyTextureBg() is called directly on #root, exactly like
       map-pick.html, rather than a separate #xx-bg + applyCutoutMask layer
       like between-matches.html/interview.html use. That two-layer split
       exists ONLY to carve a transparent cam hole out of the texture; with
       no cam window to cut, a plain single-layer texture on #root is the
       correct (simpler) choice. brb.html and end-of-stream.html make the
       same choice for the same reason — documented once here, referenced
       there.

       BRAND MARK: the raster ./org.png logo is replaced by a small
       pinwheelSVG crest in all three Task 6 scenes (this file, brb.html,
       end-of-stream.html) — package-wide consistency with every other v2
       scene's medallion (gameplay-hud/map-pick/map-intro/casters), rather
       than mixing a v1 raster mark into an otherwise all-vector v2 package.
       brb.html's spec line explicitly mandates this swap for its breathing
       treatment; the same swap is applied here and in end-of-stream.html by
       extension for visual consistency across the trio. Crest colors are
       the neutral ELEMENT BRAND accents (--elmt-red / --elmt-gold), NOT
       team colors — these are idle/context-free scenes, same "brand not
       team" rationale the stinger scene (Task 8) will use. pinwheelSVG
       needs a literal CSS color string (it's spliced into an SVG fill
       attribute), not a var() custom property, hence the hardcoded hsl()
       literals below mirroring theme-v2.css's --elmt-red/--elmt-gold.

       COUNTDOWN CONTRACT (preserved EXACTLY, id `countdown-timer`): same
       split as between-matches.html/interview.html's countdown sibling —
       render() (key-gated) owns the countdown box's PRESENCE (countdown.
       visible toggles the wrapper + rebuilds the digits node), while a
       SECOND, independent stateSync subscriber (trackCountdown) keeps
       `latestCountdown` fresh and re-arms startLocalTick every real state
       change, decoupled from whether the keyed render fired. startLocalTick's
       `el` is a resolver function so it survives #ss-cd's innerHTML being
       rebuilt on a keyed repaint (a captured node reference would go stale
       the instant that happens).

       KEY READ-SET: old buildKey covered t1/t2 name, event (eventTitle||
       matchTitle), schedule fields (team1/team2/logos/time/label), and
       countdown.visible — but NOT t1.logo/t2.logo, which render's
       empty-schedule FALLBACK panel reads. Added here (same "read a field
       render uses, but don't key it" gap the audit fixed elsewhere for
       logos generally), same fix between-matches.html already made.

       EVENT TITLE: `state.eventTitle || state.matchTitle` fallback is
       preserved verbatim per the plan, even though neither field exists in
       server/state.js's defaultState or is set by any known producer path
       today (grep turned up nothing) — kept as dead-but-harmless per the
       explicit "preserve" instruction; a future producer field can light it
       up for free.

       SOCIALS: no state schema for socials (unchanged) — the row is fully
       static (YouTube/Twitch/Discord), so it lives directly in shell()'s
       one-time markup rather than being rebuilt by render() on every keyed
       repaint (it never needs to). Icons render as inline SVG (not emoji —
       OBS's embedded CEF renders emoji inconsistently, this package's
       existing convention) at 26px, matching interview.html's iv-team-chip-
       logo precedent for an icon paired with adjacent label text (the
       theme-v2.css "info icons >=44px" floor targets standalone icon-only
       indicators, not a glyph that already duplicates its neighboring
       label's information). -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* ── Positioned wrapper slots (built ONCE by shell) ──────────────────
       #ss-hero flex-centers its whole column (crest/heading/countdown/event
       pill) across the full canvas — a flex `justify-content/align-items`
       center rather than left:50%+translate(-50%,-50%), because the wrapper
       itself also carries the scaleIn entrance transform; translate-based
       centering would collide with that transform's own translate/scale
       the same way the package's other centered wrappers avoid it with
       width:fit-content+margin:auto (that trick only solves ONE axis —
       flex centering is this scene's two-axis equivalent, and scaleIn has
       no translate component so there's no collision). */
    #ss-hero {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    #ss-schedule { position: absolute; right: 60px; bottom: 60px; width: 480px; }
    #ss-socials { position: absolute; left: 60px; bottom: 60px; }

    /* overlay-core appends its volatile render container as #root's LAST
       child; this scene never uses it directly (render() writes into each
       wrapper's persistent .slot-content). Every shell child above carries
       an id, so this only matches that trailing container. */
    #root > div:not([id]) { display: none; }

    /* ── Hero column ──────────────────────────────────────────────────── */
    .ss-crest { margin-bottom: 22px; }
    .ss-heading {
      font-size: 118px; font-weight: 800; line-height: 0.95;
      text-transform: uppercase; letter-spacing: 6px;
      text-shadow: 0 4px 40px rgba(0,0,0,0.6), 0 0 80px rgba(249,115,22,0.12);
      margin-bottom: 28px;
    }
    #ss-cd { margin-bottom: 24px; }
    .ss-cd-panel {
      padding: 20px 44px; display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .ss-cd-label {
      font-size: 22px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }
    /* Hero element of the scene (spec §6) — the largest text on screen,
       well above the ≥64px countdown-digit floor for this scene. */
    .ss-cd-digits {
      font-size: 104px; font-weight: 800; letter-spacing: 2px; line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--grad4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* ── Schedule (bottom-right) ──────────────────────────────────────── */
    .ss-schedule-label {
      font-size: 22px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.5); text-align: right; margin-bottom: 10px;
    }
    .ss-sched-panel {
      margin-bottom: 10px; padding: 10px 16px; position: relative; overflow: hidden;
      display: flex; flex-direction: column; gap: 5px;
    }
    .ss-sched-panel.ss-upnext { border-color: rgba(255,255,255,0.4); }
    .ss-sched-label-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .ss-sched-label {
      font-size: 22px; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,0.4);
    }
    .ss-upnext .ss-sched-label { color: #fff; }
    .ss-sched-time { font-size: 22px; font-weight: 800; flex: none; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.6); }
    .ss-sched-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .ss-sched-logo { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; flex: none; border: 1px solid rgba(255,255,255,0.15); }
    .ss-sched-logo-empty { background: rgba(255,255,255,0.08); }
    .ss-sched-name {
      font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1;
    }
    .ss-upnext-underline { position: absolute; left: 0; right: 0; bottom: 0; }

    /* ── Socials (bottom-left) ────────────────────────────────────────── */
    .ss-social-row { display: flex; gap: 16px; align-items: center; }
    .ss-social-chip {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 20px; background: var(--panel-bg); border: var(--panel-border); border-radius: var(--panel-radius);
      font-size: 22px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.65);
    }
    .ss-social-chip svg { width: 26px; height: 26px; fill: rgba(255,255,255,0.55); flex: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + bg helper
       + countdown engine must all be global before overlay-core wires the
       render loop. NO ?./?? in the inline script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./countdown.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    // Brand crest colors — literal hsl() strings mirroring theme-v2.css's
    // --elmt-red/--elmt-gold (see file-header comment: pinwheelSVG needs a
    // literal color string, not a CSS custom property, since it's spliced
    // into an SVG fill attribute).
    var SS_ACCENT_1 = 'hsl(0 85% 60%)';
    var SS_ACCENT_2 = 'hsl(45 95% 55%)';

    // ── Static socials row (no state) — built once by shell(), not render(). ──
    function socialsHtml() {
      return '<div class="ss-social-row">' +
        '<div class="ss-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814z"/></svg>' +
          '<span>YouTube</span></div>' +
        '<div class="ss-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714Z"/></svg>' +
          '<span>Twitch</span></div>' +
        '<div class="ss-social-chip">' +
          '<svg viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03z"/></svg>' +
          '<span>Discord</span></div>' +
        '</div>';
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'starting-soon-v2');
      applyTextureBg(root);
      root.innerHTML =
        '<div id="ss-hero" style="animation: scaleIn 0.6s ease-out 0.10s both;">' +
          '<div class="ss-crest">' + pinwheelSVG({ color1: SS_ACCENT_1, color2: SS_ACCENT_2, size: 92 }) + '</div>' +
          '<div class="ss-heading">STARTING SOON</div>' +
          '<div id="ss-cd"><div class="slot-content"></div></div>' +
          '<div id="ss-event"><div class="slot-content"></div></div>' +
        '</div>' +
        '<div id="ss-schedule" style="animation: slideUp 0.5s ease-out 0.25s both;"><div class="slot-content"></div></div>' +
        '<div id="ss-socials" style="animation: slideUp 0.5s ease-out 0.30s both;">' + socialsHtml() + '</div>';
    }

    // One schedule slot — same panel anatomy as between-matches.html's
    // schedule row (label row, then one full-width logo+name row per team),
    // adapted to this scene's original next-detection: index 0 is always
    // "up next" (starting-soon's schedule has no completed/upNext fields,
    // unlike between-matches' richer schema — preserved from the pre-v2
    // scene, not upgraded here).
    function schedTeamRowHtml(name, logo) {
      var logoHtml = logo
        ? safeImg(logo, { 'class': 'ss-sched-logo', alt: name || '' })
        : '<div class="ss-sched-logo ss-sched-logo-empty"></div>';
      return '<div class="ss-sched-row">' + logoHtml +
        '<span class="ss-sched-name">' + escapeHtml(name || 'TBD') + '</span></div>';
    }

    function schedItemHtml(m, isNext) {
      var labelText = isNext ? 'UP NEXT' : (m.label || '');
      var rightHtml = (!isNext && m.time) ? '<span class="ss-sched-time">' + escapeHtml(m.time) + '</span>' : '';
      return '<div class="ss-sched-panel v2-panel' + (isNext ? ' ss-upnext' : '') + '">' +
        '<div class="ss-sched-label-row">' +
          '<span class="ss-sched-label">' + escapeHtml(labelText) + '</span>' + rightHtml +
        '</div>' +
        schedTeamRowHtml(m.team1, m.team1Logo) +
        schedTeamRowHtml(m.team2, m.team2Logo) +
        (isNext ? '<span class="v2-underline ss-upnext-underline"></span>' : '') +
        '</div>';
    }

    function scheduleHtml(state) {
      var schedule = state.schedule || [];
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var itemsHtml;
      if (schedule.length) {
        itemsHtml = schedule.map(function (m, i) { return schedItemHtml(m, i === 0); }).join('');
      } else {
        itemsHtml = schedItemHtml({ team1: t1.name, team2: t2.name, team1Logo: t1.logo, team2Logo: t2.logo, label: '' }, true);
      }
      return '<div class="ss-schedule-label">Today&#39;s Schedule</div>' + itemsHtml;
    }

    // ── key: EXACTLY the state leaves render reads (see file-header comment
    // for the t1.logo/t2.logo gap-close). ────────────────────────────────
    function key(state) {
      var schedule = state.schedule || [];
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var countdown = state.countdown || {};
      var sched = schedule.map(function (m) {
        return [m.team1, m.team2, m.team1Logo, m.team2Logo, m.time, m.label];
      });
      return [
        sched, t1.name, t1.logo, t2.name, t2.logo,
        state.eventTitle, state.matchTitle,
        countdown.visible !== false
      ];
    }

    function render(state) {
      applyTheme(state);

      var countdown = state.countdown || null;
      var countdownVisible = !countdown || countdown.visible !== false;
      var cdWrap = document.getElementById('ss-cd');
      cdWrap.style.display = countdownVisible ? '' : 'none';
      document.querySelector('#ss-cd .slot-content').innerHTML = countdownVisible
        ? '<div class="ss-cd-panel v2-panel">' +
          '<div class="ss-cd-label">Starting In</div>' +
          '<div class="ss-cd-digits" id="countdown-timer">' + formatTime(getRemaining(countdown, Date.now())) + '</div>' +
          '</div>'
        : '';

      var eventTitle = state.eventTitle || state.matchTitle || '';
      document.querySelector('#ss-event .slot-content').innerHTML =
        eventTitle ? eventHeader({ eventName: eventTitle }) : '';

      document.querySelector('#ss-schedule .slot-content').innerHTML = scheduleHtml(state);
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });

    // ── Countdown live-tick wiring (decoupled from the keyed render above —
    // see file-header comment). Own stateSync subscriber so `latestCountdown`
    // and the 1s tick stay fresh on every real state change, independent of
    // whether the visual key changed. startLocalTick's resolver re-queries
    // #countdown-timer live, so it survives #ss-cd's innerHTML being rebuilt
    // by render(). ─────────────────────────────────────────────────────────
    var latestCountdown = null;
    function trackCountdown(state) {
      latestCountdown = state.countdown || null;
      startLocalTick(function () { return document.getElementById('countdown-timer'); }, function () { return latestCountdown; });
    }
    stateSync(trackCountdown);
  </script>
</body>
</html>
