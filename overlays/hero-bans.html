<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ban Reveal Overlay</title>
  <!-- Broadcast v2: same stack as gameplay-hud.html/map-pick.html — no Google
       Fonts (Geist via @font-face in fonts-v2.css); theme-v2.css/fonts-v2.css/
       animations.css own tokens + shared component-internal styles; this
       file's own <style> owns scene-local layout. Full-screen (petal texture),
       not the old transparent corner strip. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Empty state is NO LONGER hidden. As a dedicated OBS scene, an all-black
       Ban Reveal reads as dead air; the producer's scene-switch is what decides
       visibility now. When both ban lists are empty we keep texture + washes +
       crest + "HERO BANS" heading and show a dimmed AWAITING BANS chip where the
       panels would be (see .hb-awaiting below). */

    /* overlay-core appends its volatile render container as #root's LAST
       child (after everything shell builds). This scene never uses it —
       render() writes into each wrapper's persistent .slot-content instead
       (the render-vs-reflow split, same as gameplay-hud.html/map-pick.html)
       — so the trailing, id-less container is hidden. Every shell wrapper
       below has an id, so this only matches that container. */
    #root > div:not([id]) { display: none; }

    /* ── Team washes (shell chrome, built ONCE) ──────────────────────────
       .v2-wash-left/.v2-wash-right (theme-v2.css) already do the gradient-
       from-edge look via a --wash-color custom property; stretched to full
       screen here (inset:0) rather than theme-v2's small-panel usage. Colors
       are DATA (team colors can change), but these two divs are NEVER
       rebuilt — render() only calls .style.setProperty('--wash-color', ...)
       on the same persistent nodes, which repaints the gradient without
       touching innerHTML. That's the point: if a team's color changed while
       this scene stayed mounted, the wash must NOT replay its fade-in (that
       would be the same "chrome re-animates on every data tick" bug the HUD's
       shell/render split fixes) — only a genuine shell rebuild (page
       load/OBS scene switch, via state-sync's replayAnimation) replays it. */
    .hb-wash { position: absolute; inset: 0; pointer-events: none; }

    /* ── Heading block (shell wrapper, entrance-animated) ────────────────
       Crest + "HERO BANS" + map-context chip are all DATA (pinwheel colors,
       chip text) so they're written into .slot-content by render(), same
       split as gameplay-hud's #hud-center — only the wrapper's entrance
       animation is shell-owned and never replays on a data tick. */
    #hb-heading { position: absolute; top: 3.5%; left: 0; right: 0; text-align: center; z-index: 3; }
    .hb-medallion { display: flex; justify-content: center; }
    .hb-heading-text {
      margin-top: 8px; font-size: 44px; font-weight: 800; color: #fff;
      letter-spacing: 4px; text-shadow: 0 1px 6px rgba(0,0,0,0.7);
    }
    .hb-heading-underline { width: 150px; margin: 8px auto 0; }
    .hb-map-chip {
      margin-top: 10px; display: inline-block; color: rgba(255,255,255,0.55);
      font-weight: 700; font-size: 22px; letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* ── Panels area (shell wrapper — plain positioned box, NO entrance
       animation of its own). Unlike the heading/washes above, this wrapper's
       CHILDREN (the ban panels) are the animated elements, and they ARE
       rebuilt by render() every time — see the big comment on panelHtml()
       below for why that's intentional here, in contrast to the HUD's
       "chrome never replays" rule. */
    #hb-panels { position: absolute; inset: 0; z-index: 2; }

    .hb-side { position: absolute; top: 24%; bottom: 9%; width: 37%; display: flex; flex-direction: column; }
    .hb-side-left { left: 6%; }
    .hb-side-right { right: 6%; }
    .hb-side-label { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; flex: 0 0 auto; }
    .hb-side-right .hb-side-label { flex-direction: row-reverse; }
    .hb-side-swatch { width: 26px; height: 26px; border-radius: var(--panel-radius); flex: none; }
    .hb-side-name {
      color: #fff; font-weight: 800; font-size: 26px; text-transform: uppercase;
      letter-spacing: 1px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }

    .hb-columns { display: flex; gap: 16px; flex: 1 1 auto; min-height: 0; }

    /* ── AWAITING BANS placeholder (empty-state, shown in the panels area) ──
       Dimmed chip so the scene reads as "waiting" rather than dead-air black.
       ≥28px per plan; render() output, so its fadeIn is fine (only appears when
       heroBans is empty and render only re-runs when the key changes). */
    .hb-awaiting { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    .hb-awaiting-chip {
      font-weight: 800; font-size: 34px; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.34); background: rgba(8,10,15,0.35);
      border: 2px solid rgba(255,255,255,0.14); border-radius: var(--panel-radius);
      padding: 18px 44px; text-shadow: 0 1px 6px rgba(0,0,0,0.6);
      animation: fadeIn 0.6s ease-out 0.15s both;
    }

    /* ── One ban panel ────────────────────────────────────────────────── */
    /* Layout only — background/border/border-radius/box-sizing/overflow/
       position now live on the shared .v2-ban-art-tile class (banArtTile()
       in components-v2.js, Plan 3 Task 1 consolidation with map-intro's
       .mi-ban-tile). This scene keeps only what's specific to ITS layout:
       flex sizing within the .hb-columns row. */
    .hb-panel { flex: 1 1 0; min-width: 0; }
    /* Wash + BANNED chip + foot (role/name) stay scene-owned — hero-bans'
       reveal treatment is richer than banArtTile's shared anatomy (art +
       slash + optional name overlay), so these render as siblings alongside
       banArtTile()'s output rather than being folded into it. */
    .hb-panel-wash { position: absolute; inset: 0; pointer-events: none; }
    .hb-panel-banned-chip {
      position: absolute; top: 0; left: 0; font-weight: 800; font-size: 22px;
      letter-spacing: 1.5px; padding: 7px 20px; color: #fff;
    }
    .hb-panel-foot {
      position: absolute; left: 0; right: 0; bottom: 0; background: rgba(8,10,15,0.92);
      padding: 14px 18px; display: flex; align-items: center; gap: 12px;
    }
    .hb-panel-role {
      flex: none; font-weight: 800; font-size: 22px; letter-spacing: 1px; text-transform: uppercase;
    }
    .hb-panel-name {
      color: #fff; font-weight: 800; font-size: 36px; text-transform: uppercase;
      letter-spacing: 0.5px; text-shadow: 0 1px 4px rgba(0,0,0,0.7);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + bg helper
       must all be global before overlay-core wires the render loop. NO ?./??
       in the inline script (OBS Chromium 103 floor); template literals/const/
       arrow are fine, but this file follows the existing var/function/string-
       concat style for consistency with the other v2 scenes. -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];

    // Dep (overlay-core loads it before the first render).
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }

    // Role -> chip label + color. Text-only chip (no icon glyph — safer than
    // relying on emoji rendering inside OBS's embedded Chromium); the label
    // itself carries the info, color is a bonus, not a requirement (mobile
    // legibility floor: info must be readable by more than hue alone).
    function roleMeta(role) {
      if (role === 'tank') return { label: 'TANK', color: 'var(--elmt-blue)' };
      if (role === 'damage') return { label: 'DAMAGE', color: 'var(--elmt-red)' };
      if (role === 'support') return { label: 'SUPPORT', color: 'var(--elmt-green)' };
      return { label: '', color: 'rgba(255,255,255,0.5)' };
    }

    // One ban panel. `side` picks the slam-in direction (team1's side slams
    // from the left via slideRight, team2's from the right via slideLeft —
    // same left/right -> animation-name mapping gameplay-hud's shell uses for
    // its wrapper slots). `delay` (seconds, already staggered per-column by
    // the caller) drives both the slam-in and the slash sweep that follows it.
    //
    // IMPORTANT — deviation from the HUD/map-pick chrome rule, sanctioned by
    // the plan: everywhere else in the v2 package, shell wrappers hold the
    // ONLY entrance animations and render() never puts an `animation` on
    // anything it writes, specifically so a data tick (score change, ban
    // wing update) can't replay chrome. Here it's the opposite on purpose —
    // these panels ARE render() output (rebuilt fresh every time heroBans
    // changes) and DO carry their own inline animation, so a NEW ban slams in
    // and sweeps again exactly like the first reveal. That's correct for this
    // scene: a ban changing IS a fresh reveal moment, not an incidental data
    // tick to be hidden from the viewer.
    function panelHtml(heroKey, teamColor, side, delay) {
      var hero = findHeroEntry(heroData, heroKey);
      var heroName = hero ? hero.name : heroKey;
      var role = hero ? hero.role : '';
      var renderUrl = hero ? hero.render : null;
      var portrait = hero ? hero.portrait : '';

      var slamAnim = side === 'left' ? 'slideRight' : 'slideLeft';
      var slamStyle = 'animation:' + slamAnim + ' 0.5s ease-out ' + delay.toFixed(2) + 's both;';

      // Wash must paint BETWEEN the art and the slash (banArtTile's
      // beforeSlashHtml) so the DOM/paint order matches the pre-extraction
      // markup exactly: art, wash, slash, chip, name.
      var washHtml = '<div class="hb-panel-wash" style="background-image:linear-gradient(180deg, transparent 50%, ' +
        hexToAlpha(teamColor, 0.5) + ')"></div>';

      var chipHtml = '<div class="hb-panel-banned-chip" style="background:' + escapeHtml(teamColor) + '">BANNED</div>';

      var roleInfo = roleMeta(role);
      var roleHtml = roleInfo.label
        ? '<span class="hb-panel-role" style="color:' + roleInfo.color + '">' + roleInfo.label + '</span>'
        : '';
      var footHtml = '<div class="hb-panel-foot">' + roleHtml +
        '<span class="hb-panel-name">' + escapeHtml(heroName) + '</span>' +
        '</div>';

      // Shared render-vs-portrait art + sweep-in slash (components-v2.js,
      // Plan 3 Task 1 carry-over consolidation with map-intro's
      // banTileDeck()). animated:true because a ban changing IS a fresh
      // reveal moment here (see the big comment above on why this scene
      // deviates from the "chrome never replays" rule). nameOverlay stays
      // off — this scene shows the name (+ role) in its own foot bar below,
      // not overlaid on the art like map-intro's deck tiles.
      return banArtTile({
        renderUrl: renderUrl, portrait: portrait, heroName: heroName, teamColor: teamColor,
        animated: true, delay: delay,
        wrapperClass: 'hb-panel', extraStyle: slamStyle,
        beforeSlashHtml: washHtml, afterNameHtml: chipHtml + footHtml
      });
    }

    // One team's side: label row + N-wide column of panels. Base case (one
    // ban) is a single flex child that fills the whole side — the "two large
    // face-off panels" default from the mockup falls straight out of flexbox
    // rather than needing a special case. `startDelay` staggers this side
    // relative to the other (set by render()); each panel within a side
    // staggers further by its column index.
    function sideHtml(side, team, teamColor, bans, startDelay) {
      var labelHtml = '<div class="hb-side-label">' +
        '<div class="hb-side-swatch" style="background:' + escapeHtml(teamColor) + '"></div>' +
        '<div class="hb-side-name">' + escapeHtml(team.name || '') + '</div>' +
        '</div>';

      var panelsHtml = '';
      for (var i = 0; i < bans.length; i++) {
        panelsHtml += panelHtml(bans[i], teamColor, side, startDelay + i * 0.08);
      }

      return labelHtml + '<div class="hb-columns">' + panelsHtml + '</div>';
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    // Petal texture, the two team washes, and the heading wrapper are all
    // built here and never rebuilt; render() only ever touches their
    // .slot-content (heading) or a CSS custom property (washes). #hb-panels
    // itself is also shell-built (a plain positioned box, no animation of its
    // own — see the big comment above panelHtml() for why its CHILDREN
    // deliberately break the "chrome never replays" rule instead of it).
    // data-shell-marker proves the shell ran once, same convention as the
    // other v2 scenes.
    function shell(root) {
      root.setAttribute('data-shell-marker', 'hero-bans-v2');
      applyTextureBg(root);
      root.innerHTML =
        '<div id="hb-wash-left" class="hb-wash v2-wash-left" style="animation: fadeIn 0.6s ease-out 0.05s both;"></div>' +
        '<div id="hb-wash-right" class="hb-wash v2-wash-right" style="animation: fadeIn 0.6s ease-out 0.05s both;"></div>' +
        '<div id="hb-heading" style="animation: scaleIn 0.5s ease-out 0.10s both;"><div class="slot-content"></div></div>' +
        '<div id="hb-panels"><div class="slot-content"></div></div>';
    }

    // ── key: EXACTLY the state leaves render reads ──────────────────────────
    // Tightened from the old scene, which keyed state.teams and state.theme
    // wholesale (template style per the other v2 scenes: only the leaves
    // render() actually consumes). maps is reduced to [status, name] per
    // entry — that's all findCurrentMapIndex/findCurrentMap + the chip read.
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var hb = state.heroBans || {};
      var maps = (state.maps || []).map(function (m) {
        return [m.status, m.name];
      });
      return [
        t1.name, t1.color,
        t2.name, t2.color,
        hb.team1, hb.team2,
        maps, state.activeBanMapIdx,
        theme.team1Color, theme.team2Color
      ];
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var heroBans = state.heroBans || {};
      var t1bans = heroBans.team1 || [];
      var t2bans = heroBans.team2 || [];

      // Empty state is NOT hidden anymore — texture, washes, crest and heading
      // stay up and the panels area shows a dimmed AWAITING BANS chip, so a
      // dedicated Ban Reveal scene never reads as dead-air black. Visibility is
      // the producer's scene-switch decision now.
      var empty = t1bans.length === 0 && t2bans.length === 0;

      // Washes are persistent nodes (built once by shell) — setting the CSS
      // custom property repaints the gradient without touching innerHTML, so
      // this never replays their shell entrance fade (see the CSS comment).
      // Team colors fall back to the blue/red defaults above, so the washes
      // still give the scene life even with no teams loaded yet.
      document.getElementById('hb-wash-left').style.setProperty('--wash-color', hexToAlpha(t1color, 0.18));
      document.getElementById('hb-wash-right').style.setProperty('--wash-color', hexToAlpha(t2color, 0.18));

      // Heading: crest + map-context chip are DATA, written into the shell
      // wrapper's .slot-content every render (the wrapper's own entrance
      // animation is untouched by this — see shell()).
      //
      // Label the map from state.activeBanMapIdx — the server's DERIVED resolver
      // answer (getActiveBanIdx), so the chip always names the SAME map whose
      // bans are shown below (fixes the finished-series mismatch where the chip
      // named the trailing decider while the bans were the last-played map's).
      // Fall back to the old findCurrentMap path for pre-fix servers/persisted
      // states that have no activeBanMapIdx (-1/undefined).
      var maps = state.maps || [];
      var chipHtml = '';
      var abIdx = (typeof state.activeBanMapIdx === 'number') ? state.activeBanMapIdx : -1;
      if (abIdx >= 0 && maps[abIdx] && maps[abIdx].name) {
        chipHtml = '<div class="hb-map-chip">MAP ' + (abIdx + 1) + ' · ' + escapeHtml(maps[abIdx].name) + '</div>';
      } else if (maps.length > 0) {
        var mapIdx = findCurrentMapIndex(maps);
        var currentMap = findCurrentMap(maps);
        if (currentMap.name) {
          chipHtml = '<div class="hb-map-chip">MAP ' + (mapIdx + 1) + ' · ' + escapeHtml(currentMap.name) + '</div>';
        }
      }
      document.querySelector('#hb-heading .slot-content').innerHTML =
        '<div class="hb-medallion"><div class="v2-medallion">' + pinwheelSVG({ color1: t1color, color2: t2color, size: 46 }) + '</div></div>' +
        '<div class="hb-heading-text">HERO BANS</div>' +
        '<div class="v2-underline hb-heading-underline"></div>' +
        chipHtml;

      // Panels: team1 always left / team2 always right (no swapSides — same
      // as the pre-v2 scene; this is a bans-identity reveal, not a screen-side
      // presentation, and swapSides isn't in this scene's key). When empty, the
      // panels area holds the dimmed AWAITING BANS chip instead.
      if (empty) {
        document.querySelector('#hb-panels .slot-content').innerHTML =
          '<div class="hb-awaiting"><div class="hb-awaiting-chip">AWAITING BANS</div></div>';
        return;
      }
      var leftHtml = sideHtml('left', t1, t1color, t1bans, 0.15);
      var rightHtml = sideHtml('right', t2, t2color, t2bans, 0.15);
      document.querySelector('#hb-panels .slot-content').innerHTML =
        '<div class="hb-side hb-side-left">' + leftHtml + '</div>' +
        '<div class="hb-side hb-side-right">' + rightHtml + '</div>';
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render,
      deps: [loadHeroes]
    });
  </script>
</body>
</html>
