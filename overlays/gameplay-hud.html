<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gameplay HUD Overlay</title>
  <!-- Broadcast v2 — Concept D "Full Frame" (owner QA batch 3, approved from
       the concept artifact): the three floating regions of the previous HUD
       are replaced by a two-tier top frame, OWCS-style.

       Tier 1 (y 0-54, edge to edge): ban chip · logo · team name · SCORE BOX
       flanking a center chip (crest + "MAP n · NAME" + "FIRST TO x · MODE"),
       mirrored on the right. Tier 2 (y 54-92, SIDES ONLY — the center span
       x≈694-1226 stays open so the game's objective UI at x 710-1205 / y>=65
       is never covered): event/season strip on the left, PICK tag + named
       map track (mapPips) on the right. Side player rows start at y=112, so
       both tiers clear them.

       Geist via @font-face in fonts-v2.css (NO CDN hotlinks — forbidden in
       OBS). theme-v2.css owns tokens + shared component styles; this file's
       <style> owns scene-local layout, the score-pop moment, and the
       underline shimmer. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* ── Shell wrappers (built ONCE; entrance animations live here and never
       replay on a data tick — the render-vs-reflow split) ─────────────────── */
    #hud-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; }
    #hud-sub-left  { position: absolute; top: 54px; left: 0;  width: 694px; height: 38px; }
    #hud-sub-right { position: absolute; top: 54px; right: 0; width: 694px; height: 38px; }

    /* overlay-core's trailing volatile container is unused (render writes into
       the wrappers' .slot-content); every shell child is id'd so this matches
       only that container. */
    #root > div:not([id]) { display: none; }

    /* ── Tier 1 ──────────────────────────────────────────────────────────── */
    .hbar {
      display: flex; align-items: center; height: 54px;
      background: rgba(8,10,15,0.94);
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .hbar-side { display: flex; align-items: center; gap: 14px; flex: 1; min-width: 0; padding: 0 16px; }
    .hbar-side-right { flex-direction: row-reverse; }
    .hbar-logo { width: 40px; height: 40px; border-radius: 3px; object-fit: cover; flex: none; }
    .hbar-name {
      font-size: 28px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
      text-shadow: 0 1px 4px rgba(0,0,0,0.6);
    }
    .hbar-score {
      width: 54px; height: 54px; display: flex; align-items: center; justify-content: center;
      font-size: 34px; font-weight: 800; flex: none; color: #fff;
      font-variant-numeric: tabular-nums;
    }
    /* Score-change pop: attached inline by render() ONLY to a score box whose
       value changed since the previous render (scene-local lastScores diff) —
       so an unrelated data tick can't replay it. One-shot `both` fill. */
    @keyframes hudScorePop {
      0%   { transform: scale(1); filter: brightness(1); }
      35%  { transform: scale(1.28); filter: brightness(1.6); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    /* Ban chip: hero portrait(s) + BAN tag. Portraits are 40px (below the
       56px ban-tile floor, sanctioned: the red tag + slash-red color carry
       the meaning by shape/color alone at phone scale — owner-approved
       Concept D mockup geometry). */
    .hbar-bans { display: flex; align-items: center; gap: 8px; flex: none; }
    .hbar-side-right .hbar-bans { flex-direction: row-reverse; }
    .hbar-ban-img { width: 48px; height: 48px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.25); }
    .hbar-ban-tag {
      font-size: 12px; font-weight: 800; letter-spacing: 1.5px; padding: 3px 7px;
      background: #d92626; border-radius: 3px; flex: none;
    }

    /* Center keystone (owner QA batch 3e): a TALL drop block — the frame's
       centerpiece. The bar is 54px but the keystone runs 96px, hanging below
       the bar edge into the vertical room the owner pointed out, with the
       team-color pinwheel crest big and centered above the map/series lines.
       VERTICAL BUDGET: bottom edge at y=96. The control-mode objective
       cluster starts ~y118 (measured on the owner's fresh Lijiang capture);
       the older escort measurement put the payload bar's top at y>=65 for a
       much wider span — the keystone is only ~420px wide at true center
       where escort's bar is thinnest, but RE-VERIFY on a payload map and
       shrink KEYSTONE_H below if it grazes. */
    /* Height budget (owner QA batch 3f/3g): the game's objective cluster is
       NOT at a fixed y — it shifts with mode and round state, and a 92px
       vertical-stack keystone still read as touching it on Lijiang. So the
       keystone is a compact HORIZONTAL drop block instead: the 48px crest
       sits beside the text stack, the box ends at y=72 (18px below the bar —
       still clearly a keystone) and the shadow is tight, so the visual
       bottom ≈78 stays clear of anything the game draws in any mode. */
    .hbar-center {
      flex: none; align-self: flex-start; height: 72px; padding: 0 24px;
      position: relative;
      display: flex; align-items: center; gap: 14px;
      background: rgba(8,10,15,0.99);
      border-left: 1px solid rgba(255,255,255,0.16);
      border-right: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    }
    .hbar-center-stack { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .hbar-center-line1 { font-size: 21px; font-weight: 800; letter-spacing: 1px; line-height: 1.05; white-space: nowrap; text-transform: uppercase; }
    .hbar-center-line2 {
      font-size: 12px; font-weight: 700; letter-spacing: 2.5px; line-height: 1.1;
      color: rgba(255,255,255,0.55); white-space: nowrap; text-transform: uppercase;
    }
    .hbar-underline {
      position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; overflow: hidden;
    }
    /* Shimmer: a diagonal white highlight sweeps the underline once every
       ~32s (research: pro persistent HUDs keep decorative loops >=20s and
       low contrast). Opacity/transform on a pseudo-element — no collision
       with any entrance animation. */
    .hbar-underline::after {
      content: ''; position: absolute; inset: 0; transform: translateX(-110%);
      background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.65) 50%, transparent 70%);
      animation: hudShimmer 32s linear infinite;
    }
    @keyframes hudShimmer {
      0%   { transform: translateX(-110%); }
      4%   { transform: translateX(110%); }
      100% { transform: translateX(110%); }
    }

    /* ── Tier 2 ──────────────────────────────────────────────────────────── */
    .hsub {
      display: flex; align-items: center; height: 38px; padding: 0 16px; gap: 14px;
      background: rgba(8,10,15,0.82);
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .hsub-right { justify-content: flex-end; }
    .hsub-event {
      font-size: 20px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,0.55); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .hsub-pick {
      display: flex; align-items: center; gap: 7px; flex: none;
      font-size: 15px; font-weight: 800; letter-spacing: 1.5px;
      color: rgba(255,255,255,0.85); text-transform: uppercase;
    }
    .hsub-pick-swatch { width: 12px; height: 12px; border-radius: 2px; flex: none; }
    /* Named map track = shared mapPips, scaled for the tier (same pattern as
       map-intro's .mi-pips override). Winner colors are TRUE team identity —
       mapPips never swap-flips. */
    .hsub .v2-pips { gap: 7px; }
    .hsub .v2-pip { width: 54px; height: 26px; border-radius: 3px; font-size: 15px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders must all be
       global before overlay-core wires the render loop. NO ?./?? in the inline
       script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];

    // Dep (overlay-core loads it before the first render): hero portraits for
    // the ban chips. Per-dep catch in overlay-core means a fetch failure just
    // yields empty heroData rather than blocking the scene.
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }

    // Ban chip group: one 40px portrait per banned hero + a single BAN tag.
    // Empty bans -> no chip (no stray red tag with nothing to label).
    function banChips(keys) {
      if (!keys || keys.length === 0) return '';
      var imgs = '';
      for (var i = 0; i < keys.length; i++) {
        var hero = findHeroEntry(heroData, keys[i]);
        var portrait = hero ? hero.portrait : '';
        var heroName = hero ? hero.name : keys[i];
        if (portrait) imgs += safeImg(portrait, { 'class': 'hbar-ban-img', alt: heroName });
      }
      if (!imgs) return '';
      return '<div class="hbar-bans">' + imgs + '<span class="hbar-ban-tag">BAN</span></div>';
    }

    // One tier-1 team side: bans (inner edge? no — outer, matching the
    // approved mockup: bans outermost, then logo, then name, score toward
    // center). `side` mirrors via flex-direction. Logo gets the idle breathe
    // (leaf img — the entrance `both` fill lives on the shell wrapper).
    function sideHtml(team, bans, side) {
      var logoHtml = team.logo
        ? safeImg(team.logo, { 'class': 'hbar-logo v2-idle-breathe', alt: team.name || '' })
        : '';
      return '<div class="hbar-side hbar-side-' + side + '">' +
        banChips(bans) + logoHtml +
        '<span class="hbar-name">' + escapeHtml(team.name || '') + '</span>' +
        '</div>';
    }

    // ── shell: the three wrappers, built ONCE. Tier 1 drops in first, the two
    // tier-2 strips slide in from their screen edges just after. ────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'hud-v2');
      root.innerHTML =
        '<div id="hud-bar" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="hud-sub-left" style="animation: slideRight 0.5s ease-out 0.22s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="hud-sub-right" style="animation: slideLeft 0.5s ease-out 0.22s both;">' +
          '<div class="slot-content"></div></div>';
    }

    // ── key: EXACTLY the state leaves render reads. maps carries
    // status/winner/name (track + center context) + mode/picker (center line2
    // + PICK tag). font.family keyed for runtime-contract parity. ────────────
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var font = state.font || {};
      var hb = state.heroBans || {};
      var maps = (state.maps || []).map(function (m) {
        return [m.status, m.winner, m.name, m.mode, m.picker];
      });
      return [
        t1.name, t1.logo, t1.score, t1.color,
        t2.name, t2.logo, t2.score, t2.color,
        maps,
        hb.team1, hb.team2,
        state.swapSides, state.eventName, state.bestOf,
        theme.team1Color, theme.team2Color, font.family
      ];
    }

    // Scene-local score memory for the pop moment: render() compares each
    // TEAM's score (true identity, not screen side) against the previous
    // render and attaches the one-shot pop animation only to a box whose
    // value actually changed. First render never pops (lastScores starts
    // null) — the bar is sliding in anyway.
    var lastScores = null;

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var s1 = scoreOf(t1);
      var s2 = scoreOf(t2);
      var pop1 = lastScores !== null && lastScores.s1 !== s1;
      var pop2 = lastScores !== null && lastScores.s2 !== s2;
      lastScores = { s1: s1, s2: s2 };

      // Swap invariant: team blocks, their ban chips AND their score boxes
      // flip with swapSides — this bar is the scene's only score display, so
      // a score must sit beside the team it belongs to (the map-intro/
      // flythrough hub rule). The crest petals + map track keep TRUE
      // team1/team2 identity.
      var swap = !!state.swapSides;
      var heroBans = state.heroBans || {};
      var leftTeam  = swap ? t2 : t1;
      var rightTeam = swap ? t1 : t2;
      var leftColor  = swap ? t2color : t1color;
      var rightColor = swap ? t1color : t2color;
      var leftBans  = (swap ? heroBans.team2 : heroBans.team1) || [];
      var rightBans = (swap ? heroBans.team1 : heroBans.team2) || [];
      var leftScore  = swap ? s2 : s1;
      var rightScore = swap ? s1 : s2;
      var leftPop  = swap ? pop2 : pop1;
      var rightPop = swap ? pop1 : pop2;

      var maps = state.maps || [];
      var bestOf = state.bestOf || maps.length || 5;
      var threshold = Math.floor(bestOf / 2) + 1;

      // Center context: the map being PLAYED (findCurrentMapIndex — this is
      // the in-game scene, unlike hero-bans/map-intro which prefer the ban
      // resolver's map). Falls back to the last completed map when nothing is
      // live (post-series hold on the gameplay scene).
      var mapIdx = findCurrentMapIndex(maps);
      if (mapIdx < 0 || !maps[mapIdx]) {
        for (var mi = maps.length - 1; mi >= 0; mi--) {
          if (maps[mi] && maps[mi].status === 'completed') { mapIdx = mi; break; }
        }
      }
      var currentMap = (mapIdx >= 0 && maps[mapIdx]) ? maps[mapIdx] : {};
      var line1 = currentMap.name
        ? 'MAP ' + (mapIdx + 1) + ' · ' + currentMap.name
        : (state.eventName || 'MATCH');
      var line2 = 'FIRST TO ' + threshold + (currentMap.mode ? ' · ' + currentMap.mode : '');

      function scoreBox(score, color, pop) {
        var style = 'background:' + escapeHtml(color) + ';';
        if (pop) style += 'animation: hudScorePop 0.45s ease-out both;';
        return '<div class="hbar-score" style="' + style + '">' + score + '</div>';
      }

      document.querySelector('#hud-bar .slot-content').innerHTML =
        '<div class="hbar">' +
          sideHtml(leftTeam, leftBans, 'left') +
          scoreBox(leftScore, leftColor, leftPop) +
          '<div class="hbar-center">' +
            // The crest is the centerpiece now — big, team-colored, glowing.
            // Idle glow is opacity/filter, safe under the wrapper's slideDown
            // `both` fill.
            '<span class="v2-medallion v2-idle-glow">' +
              pinwheelSVG({ color1: t1color, color2: t2color, size: 48 }) + '</span>' +
            '<div class="hbar-center-stack">' +
              '<span class="hbar-center-line1">' + escapeHtml(line1) + '</span>' +
              '<span class="hbar-center-line2">' + escapeHtml(line2) + '</span>' +
            '</div>' +
            '<span class="hbar-underline v2-underline"></span>' +
          '</div>' +
          scoreBox(rightScore, rightColor, rightPop) +
          sideHtml(rightTeam, rightBans, 'right') +
        '</div>';

      // Tier 2 left: event/season context.
      var eventText = (state.eventName || 'MATCH') + ' · BO' + bestOf;
      document.querySelector('#hud-sub-left .slot-content').innerHTML =
        '<div class="hsub"><span class="hsub-event">' + escapeHtml(eventText) + '</span></div>';

      // Tier 2 right: PICK tag (live map's picker, swatch in the picker's
      // TRUE color — identity, not screen side) + the named map track.
      var pickHtml = '';
      var liveMap = (findCurrentMapIndex(maps) >= 0) ? maps[findCurrentMapIndex(maps)] : null;
      if (liveMap && liveMap.picker === 'team1') {
        pickHtml = '<span class="hsub-pick"><span class="hsub-pick-swatch" style="background:' + escapeHtml(t1color) + '"></span>' +
          escapeHtml(t1.name || 'TEAM 1') + ' PICK</span>';
      } else if (liveMap && liveMap.picker === 'team2') {
        pickHtml = '<span class="hsub-pick"><span class="hsub-pick-swatch" style="background:' + escapeHtml(t2color) + '"></span>' +
          escapeHtml(t2.name || 'TEAM 2') + ' PICK</span>';
      }
      document.querySelector('#hud-sub-right .slot-content').innerHTML =
        '<div class="hsub hsub-right">' + pickHtml +
        mapPips({ maps: maps, bestOf: bestOf, team1Color: t1color, team2Color: t2color }) +
        '</div>';
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render,
      deps: [loadHeroes]
    });
  </script>
</body>
</html>
