<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gameplay HUD Overlay</title>
  <!-- Broadcast v2: Geist via @font-face in fonts-v2.css (NO CDN hotlinks —
       forbidden in OBS). theme-v2.css owns the design tokens + shared
       component-internal styles; this file's own <style> owns only the
       scene's absolute positioning of the three wrapper slots. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* ── Three positioned wrapper slots (built ONCE by shell) ──────────────
       Layout budget (design spec §3, 1920x1080): side plates within y<110
       (full height of that band), center band within y<62, and the gap
       columns x≈590–710 (and mirrored 1210–1330) stay clear. The side
       regions are 510px wide from a 40px inset → left ends at x=550, right
       starts at x=1370, both clear of the gap columns. The center band is
       shrink-to-fit and centered above the objective panel. */
    .hud-slot { position: absolute; }
    #hud-left  { top: 14px; left: 40px;  width: 510px; }
    #hud-right { top: 14px; right: 40px; width: 510px; }
    /* Centered via left/right:0 + margin:auto on a fit-content box rather than
       translateX(-50%): the slideDown entrance animates `transform`, and its
       `both` fill would otherwise clobber a translateX and de-center the band.
       max-width caps the band to the free middle span (left region ends ≈x550,
       right starts ≈x1370 → ~820px, minus breathing room). fit-content keeps it
       compact + centered when content is short (no ellipsis); once content would
       exceed the cap it holds at 790px and the interior degrades gracefully (the
       event NAME ellipsizes — see .v2-event-* in theme-v2.css — while medallion,
       map pill, and pips never shrink), so the band never runs under #hud-right. */
    #hud-center { top: 0; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 790px; }

    /* Side region row: plate (outer) grows, ban wing (inner) is fixed width.
       .hud-row-right mirrors it so the plate stays on the outer edge. */
    .hud-row { display: flex; align-items: stretch; gap: 6px; }
    .hud-row-right { flex-direction: row-reverse; }
    .hud-row .v2-panel { flex: 1 1 auto; min-width: 0; }
    .hud-row .v2-wing  { flex: 0 0 auto; }

    /* Center band: winner pips sit to the right of the medallion (component
       styles for the pieces themselves live in theme-v2.css). The redundant
       current-map pill was removed in QA batch 1 — the map name already shows
       on the map board / lower third. */

    /* overlay-core appends its volatile render container as #root's LAST child
       (after the shell wrappers). This scene never uses it — render() writes
       into each wrapper's persistent .slot-content instead (the render-vs-reflow
       split) — so the trailing, id-less container is hidden. Every shell wrapper
       has an id, so this only matches that container. */
    #root > div:not([id]) { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders must all be
       global before overlay-core wires the render loop. NO ?./?? in the inline
       script (OBS Chromium 103 floor); template literals/const/arrow are fine. -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];

    // Dep (overlay-core loads it before the first render): hero portraits for
    // the ban wings. Per-dep catch in overlay-core means a fetch failure just
    // yields empty heroData rather than blocking the scene.
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }

    // One ban wing: findHeroEntry() resolves each stored hero key to a
    // (pre-proxied) portrait + display name, then banTile() renders the 56px
    // slash tile with its name label. Empty bans → no wing (avoid a stray box).
    function banWing(keys, teamColor) {
      if (!keys || keys.length === 0) return '';
      var html = '<div class="v2-wing" style="border-color:' + teamColor + '">';
      for (var i = 0; i < keys.length; i++) {
        var hero = findHeroEntry(heroData, keys[i]);
        var portrait = hero ? hero.portrait : '';
        var heroName = hero ? hero.name : keys[i];
        html += banTile({ portrait: portrait, heroName: heroName, teamColor: teamColor });
      }
      html += '</div>';
      return html;
    }

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }

    // ── shell: builds the three entrance-animated wrappers exactly ONCE ──────
    // Each wrapper carries an INLINE `animation:` (not an animations.css utility
    // class) so state-sync.js's replayAnimation() re-runs the entrance on OBS
    // show/hide: it snapshots each animated element's inline style.animation into
    // data-anim, sets animation:none, forces reflow, then restores from data-anim.
    // Inline strings round-trip through that path losslessly (a class would
    // restore via '' which also works, but inline is what the mechanism reads
    // first and keeps the exact timing/delay here in one place). render() only
    // ever rewrites the inner .slot-content, so these wrapper animations NEVER
    // replay on a data change — that's the fix for the old "team bars re-slide on
    // every score change" bug. data-shell-marker proves the shell was built once.
    function shell(root) {
      root.setAttribute('data-shell-marker', 'hud-v2');
      root.innerHTML =
        '<div id="hud-left" class="hud-slot" style="animation: slideRight 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="hud-center" class="hud-slot" style="animation: slideDown 0.5s ease-out 0.15s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="hud-right" class="hud-slot" style="animation: slideLeft 0.5s ease-out 0.20s both;">' +
          '<div class="slot-content"></div></div>';
    }

    // ── key: EXACTLY the state leaves render reads (per overlay-core's contract
    // and lower-third's comment style). applyTheme() also runs in render and sets
    // many CSS vars nothing here consumes; only the theme leaves this scene's
    // colors actually derive from (team1Color/team2Color) are keyed. font.family
    // is keyed for parity with the runtime contract even though the scene renders
    // in Geist (--font-v2); roundScore is keyed per spec though only
    // name/status/winner drive the current pips render. ──────────────────────
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var font = state.font || {};
      var hb = state.heroBans || {};
      var maps = (state.maps || []).map(function (m) {
        return [m.status, m.winner, m.name, m.roundScore];
      });
      return [
        t1.name, t1.logo, t1.score, t1.color,
        t2.name, t2.logo, t2.score, t2.color,
        maps,
        hb.team1, hb.team2,
        state.swapSides, state.eventName, state.bestOf,
        theme.team1Color, theme.team2Color, font.family
      ];
    }

    // ── render: writes into the shell's persistent .slot-content divs, NOT the
    // runtime's trailing container (which this scene hides). This is the sanctioned
    // three-region composition: topFrame() returns ONE flex row (plate·wing·center·
    // wing·plate) which map-intro/map-pick will use, but the HUD needs the plates at
    // the far screen edges and the center band centered — three separate screen
    // regions — so it composes the SAME component pieces (teamPlate, banTile wing,
    // eventHeader, pinwheelSVG medallion, map pill, mapPips) directly instead.
    //
    // swapSides is honored exactly like topFrame: the team OBJECTS and their colors
    // AND ban wings flip with the screen side, but the medallion hub scores/colors
    // and the winner pips keep TRUE team1/team2 identity (map results belong to the
    // team that won them, not to a screen side — same invariant as mapPips/mapStripClass).
    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      // Resolve team colors with the same precedence applyTheme uses
      // (theme override wins, then the team object's own color).
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var swap = !!state.swapSides;
      var leftTeam = swap ? t2 : t1;
      var rightTeam = swap ? t1 : t2;
      var leftColor = swap ? t2color : t1color;
      var rightColor = swap ? t1color : t2color;

      var heroBans = state.heroBans || {};
      var leftBans = (swap ? heroBans.team2 : heroBans.team1) || [];
      var rightBans = (swap ? heroBans.team1 : heroBans.team2) || [];

      var maps = state.maps || [];
      var bestOf = state.bestOf || maps.length || 5;

      // LEFT region: plate (outer edge) + ban wing (inner, toward center).
      document.querySelector('#hud-left .slot-content').innerHTML =
        '<div class="hud-row" style="--plate-color:' + leftColor + '">' +
          teamPlate({ side: 'left', name: leftTeam.name, logo: leftTeam.logo,
                      score: scoreOf(leftTeam), color: leftColor, linework: true }) +
          banWing(leftBans, leftColor) +
        '</div>';

      // RIGHT region: mirrored — plate on the outer edge, wing inner.
      document.querySelector('#hud-right .slot-content').innerHTML =
        '<div class="hud-row hud-row-right" style="--plate-color:' + rightColor + '">' +
          teamPlate({ side: 'right', name: rightTeam.name, logo: rightTeam.logo,
                      score: scoreOf(rightTeam), color: rightColor, linework: true }) +
          banWing(rightBans, rightColor) +
        '</div>';

      // CENTER band: event pill | pinwheel medallion (TRUE scores in hub, TRUE
      // team colors) | winner pips. (The current-map pill was removed in QA
      // batch 1 — it duplicated the map name already shown on the board.)
      var hubText = scoreOf(t1) + '·' + scoreOf(t2); // "2·1"
      document.querySelector('#hud-center .slot-content').innerHTML =
        '<div class="v2-center-block">' +
          eventHeader({ eventName: state.eventName || 'MATCH', subtitle: 'BO' + bestOf }) +
          '<div class="v2-medallion">' +
            pinwheelSVG({ color1: t1color, color2: t2color, size: 62, hubText: hubText }) +
          '</div>' +
          mapPips({ maps: maps, bestOf: bestOf, team1Color: t1color, team2Color: t2color }) +
        '</div>';
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render,
      deps: [loadHeroes]
    });
  </script>
</body>
</html>
