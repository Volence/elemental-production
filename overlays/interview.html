<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Interview</title>
  <!-- Broadcast v2 (Plan 3 Task 5): rebuilt on the casters.html cam-scene
       template — see that file for the long-form cutout invariant writeup.
       Center cam window is always CAM_LAYOUTS.interview.single[0]
       ({ x:580, y:120, w:760, h:520 } — same y:120 headroom as the desk
       scenes' cams, so the event header sits cleanly above it with no
       overlap). This scene does NOT branch on state.casterLayout.

       CASTER CORNER SLOTS (owner QA batch 1): CAM_LAYOUTS.interview.casters
       adds two bottom-corner cutouts ({x:60,y:760,...} / {x:1440,y:760,...})
       for the show casters during an interview. Each is rendered ONLY when
       the matching state.casters[i] is named (pill = that caster's name);
       the cutout mask includes a corner rect ONLY while its frame is shown,
       so an unnamed slot punches no hole. When any corner slot is active the
       centered player card gets `.has-casters` (narrower cap) so a wide name
       pill can't reach into the corners.

       Cam frame's name pill IS used here (unlike between-matches) — it
       shows the interviewee's name (escaped by camFrame itself), since
       this cam slot DOES have a specific identity: whoever is being
       interviewed. `accent` is the interviewee's team color so the frame
       border/underline read as "their" color, same idea as the desk
       scenes' per-seat accents.

       PLAYER CARD (spec §6 "pill + underline language, role/team chips
       from the site's chip vocabulary"): a single `#cd-card` wrapper
       (stacked flex column — no separate positioned elements for
       name/chips/label, they're one visual group) below the cam:
         - name pill: big Geist name, teamColor-tinted wash + border, a
           v2-underline gradient bar (same pill+underline anatomy as
           eventHeader()/v2-map-pill elsewhere in the package).
         - chip row: role chip (role -> color, REALIGNED to the same
           tank/damage/support -> blue/red/green mapping hero-bans.html's
           roleMeta() uses, rather than the old scene's one-off amber-for-
           tank scheme — same three semantic colors everywhere in the v2
           package now) + team chip (proxied teamLogo + team name,
           teamColor border via hexToAlpha).
         - label badge: the free-text interview label (e.g. "Post-Match
           Interview"), neutral panel styling.

       KEY: this scene had NO key at all before v2 (rebuilt on every single
       state-sync tick, ~every 1.5-2.5s, even when nothing interview-
       related changed). Real key now: every interviewee field render()
       reads (name/teamName/teamLogo/teamColor/role/label) + eventName +
       theme team colors (applyTheme() derives --team1-color/--team2-color
       from these — kept in the key for the same reason every other v2
       scene keys theme colors even where not painted directly: a producer
       correcting a team's color mid-broadcast must still trigger a repaint
       pass, and it costs nothing to include). -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Petal-texture cutout layer — mask set in render() from the single
       fixed CAM_LAYOUTS.interview rect (never varies with state). */
    #cd-bg { position: absolute; inset: 0; }

    /* ── Positioned wrapper slots (built ONCE by shell). Centered wrappers
       use width:fit-content + margin:auto rather than left:50%+
       translateX(-50%) so the slideDown/slideUp entrance transforms never
       clobber the centering (same convention as every other v2 scene). ── */
    #cd-header { position: absolute; top: 40px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 900px; }
    #cd-cams { position: absolute; inset: 0; }
    /* Cam bottom edge is y:640 (120+520); card starts a clean 40px below it. */
    #cd-card {
      position: absolute; top: 680px; left: 0; right: 0; margin: 0 auto; width: fit-content;
      max-width: 1600px; /* nowrap pills below: cap + ellipsis so an absurd name can't overflow the canvas */
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    /* When the bottom-corner caster slots are shown (owner QA batch 1), cap the
       centered card so a wide name pill can't reach into the corner cutouts —
       the slots occupy x<480 and x>1440, so 880px centered clears both with
       margin. Without casters the card keeps the full 1600px cap. */
    #cd-card.has-casters { max-width: 880px; }
    #cd-card .iv-name-pill, #cd-card .iv-chips { max-width: 100%; overflow: hidden; text-overflow: ellipsis; }

    /* ── Name pill: pill + underline anatomy (mirrors eventHeader()/
       v2-map-pill's shared look, scene-local since teamColor tinting is
       per-instance data, not a static component) ── */
    .iv-name-pill {
      position: relative; padding: 14px 36px 18px;
      background: var(--panel-bg); border: 1px solid; border-radius: var(--panel-radius);
      font-size: 48px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase;
      color: #fff; white-space: nowrap;
    }
    .iv-name-underline { position: absolute; left: 20px; right: 20px; bottom: 6px; }

    /* ── Chip row: role chip + team chip ── */
    .iv-chip-row { display: flex; align-items: center; gap: 12px; }
    .iv-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 16px; background: var(--panel-bg); border: 1px solid rgba(255,255,255,0.2);
      border-radius: var(--panel-radius); font-size: 22px; font-weight: 800;
      letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
    }
    .iv-role-chip { font-weight: 800; }
    .iv-team-chip-logo { width: 26px; height: 26px; border-radius: var(--panel-radius); object-fit: cover; flex: none; }
    .iv-team-chip span { color: #fff; }

    /* ── Label badge ── */
    .iv-label-badge {
      padding: 8px 24px; background: var(--panel-bg); border: var(--panel-border); border-radius: var(--panel-radius);
      font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,0.5);
    }

    /* overlay-core appends its volatile render container as #root's LAST
       child; this scene never uses it directly (render() writes into each
       wrapper's persistent .slot-content). Every shell child above carries
       an id, so this only matches that trailing container. */
    #root > div:not([id]) { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + component builders + cam geometry
       must all be global before overlay-core wires the render loop. NO
       ?./?? in the inline script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./cam-layout.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    // Role -> chip label + color, realigned to hero-bans.html's roleMeta()
    // tank/damage/support -> blue/red/green mapping (see file-header
    // comment). Interviewee.role values are Title-case ('Tank'/'Damage'/
    // 'Support', set by the dashboard's <select>), unlike the hero-data
    // role field hero-bans reads (lowercase) — so this is a separate,
    // Title-case-keyed copy, not a shared helper.
    function roleMeta(role) {
      if (role === 'Tank') return { label: 'TANK', color: 'var(--elmt-blue)' };
      if (role === 'Damage') return { label: 'DAMAGE', color: 'var(--elmt-red)' };
      if (role === 'Support') return { label: 'SUPPORT', color: 'var(--elmt-green)' };
      return null;
    }

    function chipsRowHtml(iv, teamColor) {
      var role = roleMeta(iv.role);
      var roleChipHtml = role
        ? '<div class="iv-chip iv-role-chip" style="color:' + role.color + ';border-color:' + role.color + '">' + role.label + '</div>'
        : '';

      var teamChipHtml = '';
      if (iv.teamName) {
        var logoHtml = iv.teamLogo ? safeImg(iv.teamLogo, { 'class': 'iv-team-chip-logo', alt: iv.teamName }) : '';
        var borderColor = teamColor || 'rgba(255,255,255,0.2)';
        teamChipHtml = '<div class="iv-chip iv-team-chip" style="border-color:' + escapeHtml(borderColor) + '">' +
          logoHtml + '<span>' + escapeHtml(iv.teamName) + '</span></div>';
      }

      return '<div class="iv-chip-row">' + roleChipHtml + teamChipHtml + '</div>';
    }

    function cardHtml(iv) {
      var teamColor = iv.teamColor || '';
      // hexToAlpha() is a pass-through for non-'#'-prefixed input (see its
      // own guard) — teamColor is untrusted (FACEIT-sourced), so its output
      // still needs escapeHtml() before splicing into a style attribute,
      // same defense-in-depth convention as banArtTile()/teamPlate() in
      // components-v2.js.
      var wash = escapeHtml(teamColor ? hexToAlpha(teamColor, 0.22) : 'transparent');
      var pillBorder = escapeHtml(teamColor || 'rgba(255,255,255,0.25)');
      var pillStyle = 'border-color:' + pillBorder +
        ';background-image:linear-gradient(100deg,' + wash + ',transparent 70%)';

      var nameHtml = '<div class="iv-name-pill" style="' + pillStyle + '">' +
        escapeHtml(iv.name || 'Player') +
        '<span class="v2-underline iv-name-underline"></span></div>';

      var labelHtml = '<div class="iv-label-badge">' + escapeHtml(iv.label || 'Post-Match Interview') + '</div>';

      return nameHtml + chipsRowHtml(iv, teamColor) + labelHtml;
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'interview-v2');
      root.innerHTML =
        '<div id="cd-bg"></div>' +
        '<div id="cd-header" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-cams" style="animation: fadeIn 0.5s ease-out 0.15s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-card" style="animation: slideUp 0.5s ease-out 0.25s both;">' +
          '<div class="slot-content"></div></div>';
      applyTextureBg(document.getElementById('cd-bg'));
    }

    // ── key: interviewee fields (name/teamName/teamLogo/teamColor/role/
    // label) + eventName + theme team colors (see file-header comment) +
    // the two corner caster NAMES (drive whether each corner slot renders). ─
    function key(state) {
      var iv = state.interviewee || {};
      var theme = state.theme || {};
      var casters = state.casters || [];
      return [
        iv.name, iv.teamName, iv.teamLogo, iv.teamColor, iv.role, iv.label,
        state.eventName,
        theme.team1Color, theme.team2Color,
        (casters[0] || {}).name || '', (casters[1] || {}).name || ''
      ];
    }

    function render(state) {
      applyTheme(state);

      var camRect = CAM_LAYOUTS.interview.single[0];
      var casterRects = CAM_LAYOUTS.interview.casters || [];
      var casters = state.casters || [];
      var iv = state.interviewee || {};

      // Center interviewee cam — name:'' since the player card below already
      // carries the interviewee's (bigger) name; a cam pill would duplicate it.
      var camsHtml = camFrame({ rect: camRect, name: '', accent: iv.teamColor || '' });

      // Corner caster slots: render + punch a mask hole ONLY for named casters.
      var activeRects = [camRect];
      var anyCaster = false;
      for (var i = 0; i < casterRects.length; i++) {
        var c = casters[i] || {};
        if (c.name) {
          anyCaster = true;
          activeRects.push(casterRects[i]);
          camsHtml += camFrame({ rect: casterRects[i], name: c.name });
        }
      }

      applyCutoutMask(document.getElementById('cd-bg'), activeRects);

      document.querySelector('#cd-header .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT Season 8', subtitle: 'INTERVIEW' });

      document.querySelector('#cd-cams .slot-content').innerHTML = camsHtml;

      document.getElementById('cd-card').classList.toggle('has-casters', anyCaster);
      document.querySelector('#cd-card .slot-content').innerHTML = cardHtml(iv);
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });
  </script>
</body>
</html>
