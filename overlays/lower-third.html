<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lower Third Overlay</title>
  <!-- Broadcast v2 (Plan 3 Task 7): visual-only restyle onto the v2 pill +
       gradient-underline language (spec §6 "Interview / Lower third: pill +
       underline language... from the site's chip vocabulary" — same anatomy
       interview.html's .iv-name-pill/.iv-name-underline already established
       for this package). No CDN font link (Geist via fonts-v2.css's
       --font-v2, hardcoded here rather than reading theme.fontFamily — see
       KEY note below for what that costs the key). This scene was already
       on overlay-core (Plan 1's proving ground for defineOverlay before
       Plan 2 wrote the shell/render convention this rewrite otherwise
       follows) — the runtime wiring below is UNCHANGED from that Plan 1
       version, only the CSS classes/markup and key contents moved.

       STATIC MARKUP, UNCHANGED DISCIPLINE: the #lt markup below is still
       fully static (never rebuilt) — only textContent and the "visible"
       class get mutated per state, so there's still no shell to build; the
       existing DOM IS the shell, same as before this restyle. `el:
       document.body` remains correct for the same reason it was before:
       this scene has no #root and never uses overlay-core's trailing render
       container (empty, unstyled, doesn't affect the absolutely-positioned
       #lt). Scenes with a positioned/animated #root should pass THAT
       element as el instead, per the note this file has carried since Plan 1.

       KEY RE-DERIVATION (the actual point of this restyle, spec-wise): the
       pre-restyle CSS read t.lowerThirdBg (via --lower-third-gradient, the
       left accent bar's background) and t.fontFamily (via --font-body), so
       both were tracked in the key alongside d.visible/d.title/d.subtitle.
       This restyle (a) drops the accent bar entirely in favor of the v2
       gradient underline (.v2-underline, always --grad4, never team- or
       theme-driven), and (b) hardcodes font-family: var(--font-v2) instead
       of var(--font-body) — so NEITHER t.lowerThirdBg NOR t.fontFamily is
       read by anything in this document anymore. Keeping them in the key
       would mean "keyed but not read": a theme.fontFamily/lowerThirdBg
       change alone would force a repaint (replaying the CSS transition on
       an unrelated identical-looking node) for a property this scene's
       render() no longer touches. So both are REMOVED here — the key is
       now exactly [d.visible, d.title, d.subtitle], matching applyTheme()
       still being called every render (harmless — it sets globals this
       document doesn't consume, same as before) but not gating on any of
       them. If a future restyle reintroduces a theme-driven visual here,
       add its leaf back to the key at the same time, not after. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }

    .lower-third {
      position: absolute;
      bottom: 120px;
      left: 60px;
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lower-third.visible {
      opacity: 1;
      transform: translateX(0);
    }

    /* Pill + underline anatomy (interview.html's .iv-name-pill/.iv-name-
       underline precedent) — v2-panel supplies background/border/radius;
       this scene owns padding/min-width and the underline's positioning
       within the pill only. */
    .lt-pill {
      position: relative;
      padding: 16px 32px 20px;
      min-width: 260px;
    }

    .lt-title {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #fff;
      line-height: 1.2;
    }

    /* Mobile legibility floor (theme-v2.css: labels >=22px). */
    .lt-subtitle {
      font-size: 24px;
      font-weight: 700;
      color: rgba(255,255,255,0.6);
      margin-top: 4px;
      letter-spacing: 0.3px;
    }

    .lt-underline { position: absolute; left: 20px; right: 20px; bottom: 6px; }
  </style>
</head>
<body>
  <!-- v2-idle-glow: this scene has no team-logo IMG (state.lowerThird is
       title/subtitle/visible only — see file-header key notes). #lt-pill
       hosts live 24-30px text (#lt-title/#lt-subtitle); .v2-idle-breathe's
       continuous transform:scale() re-rasterizes those glyphs every frame,
       which is fine for a logo IMG but can shimmer on an encoded broadcast
       feed for text. .v2-idle-glow (opacity/brightness only, no transform)
       gives the same "alive" idle read without touching text layout. Either
       class is a safe fit here: the entrance transform (translateX) lives on
       #lt via a CSS transition, not a keyframe `animation`, and #lt-pill owns
       no transform/animation of its own, so it is itself a safe leaf one
       level below the entrance wrapper (theme-v2.css idle-motion rule 1: no
       animated descendants, not the entrance owner). -->
  <div id="lt" class="lower-third">
    <div id="lt-pill" class="lt-pill v2-panel v2-idle-glow">
      <div id="lt-title" class="lt-title"></div>
      <div id="lt-subtitle" class="lt-subtitle"></div>
      <span class="v2-underline lt-underline"></span>
    </div>
  </div>

  <script src="./theme-helpers.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    defineOverlay({
      el: document.body,
      key: function(state) {
        var d = state.lowerThird || {};
        // See file-header "KEY RE-DERIVATION": no theme leaf is read by
        // this document's CSS anymore, so only the data this scene
        // actually displays is tracked.
        return [d.visible, d.title, d.subtitle];
      },
      render: function(state) {
        applyTheme(state);
        var lt = document.getElementById('lt');
        var data = state.lowerThird || {};

        if (data.visible && (data.title || data.subtitle)) {
          document.getElementById('lt-title').textContent = data.title || '';
          document.getElementById('lt-subtitle').textContent = data.subtitle || '';
          lt.classList.add('visible');
        } else {
          lt.classList.remove('visible');
        }
      }
    });
  </script>
</body>
</html>
