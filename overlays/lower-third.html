<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lower Third Overlay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: transparent; overflow: hidden; width: 1920px; height: 1080px; }

    .lower-third {
      position: absolute;
      bottom: 120px;
      left: 60px;
      display: flex;
      align-items: stretch;
      opacity: 0;
      transform: translateX(-20px);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .lower-third.visible {
      opacity: 1;
      transform: translateX(0);
    }

    .lt-accent {
      width: 4px;
      background: var(--lower-third-gradient, linear-gradient(180deg, #6366f1, #a78bfa));
      border-radius: 2px 0 0 2px;
    }

    .lt-content {
      background: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(20px);
      padding: 12px 24px;
      border-radius: 0 8px 8px 0;
      min-width: 250px;
    }

    .lt-title {
      font-family: var(--font-body, 'Inter', sans-serif);
      font-size: 22px;
      font-weight: 800;
      color: white;
      line-height: 1.2;
    }

    .lt-subtitle {
      font-family: var(--font-body, 'Inter', sans-serif);
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      margin-top: 2px;
    }
  </style>
  <link rel="stylesheet" href="./animations.css">
</head>
<body>
  <div id="lt" class="lower-third">
    <div class="lt-accent"></div>
    <div class="lt-content">
      <div id="lt-title" class="lt-title"></div>
      <div id="lt-subtitle" class="lt-subtitle"></div>
    </div>
  </div>

  <script src="./theme-helpers.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    // The #lt markup above is fully static (never rebuilt) — only textContent
    // and the "visible" class get mutated per state, so there's no shell to
    // build; the existing DOM IS the shell. The runtime's trailing render
    // container lands as the last child of <body>, after #lt — an empty,
    // unstyled sibling that doesn't affect the absolutely-positioned lower
    // third, so no wrapper element is needed here.
    // NOTE for scenes copying this migration: el: document.body is right
    // ONLY because this scene has no #root and never uses the render
    // container. Scenes with a positioned/animated #root should pass that
    // element as el so the container and any shell chrome live inside
    // state-sync's animation-replay scope (replayAnimation walks #root).
    defineOverlay({
      el: document.body,
      key: function(state) {
        var t = state.theme || {};
        var d = state.lowerThird || {};
        // Only the theme leaves this scene's CSS actually reads
        // (--lower-third-gradient, --font-body) are tracked here; applyTheme
        // also sets many other custom properties nothing in this document
        // consumes, so changes to those must not force a re-render.
        // Array/object entries (like lowerThirdBg) are fine — the key array
        // is JSON-serialized for comparison, so deep changes are caught.
        return [d.visible, d.title, d.subtitle, t.lowerThirdBg, t.fontFamily];
      },
      render: function(state) {
        applyTheme(state);
        var lt = document.getElementById('lt');
        var data = state.lowerThird || {};

        if (data.visible && (data.title || data.subtitle)) {
          document.getElementById('lt-title').textContent = data.title || '';
          document.getElementById('lt-subtitle').textContent = data.subtitle || '';
          lt.classList.add('visible');
        } else {
          lt.classList.remove('visible');
        }
      }
    });
  </script>
</body>
</html>
