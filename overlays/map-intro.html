<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Intro Overlay</title>
  <!-- Broadcast v2: same stack as gameplay-hud.html/map-pick.html/hero-bans.html
       — no Google Fonts (Geist via @font-face in fonts-v2.css); theme-v2.css/
       fonts-v2.css/animations.css own tokens + shared component-internal
       styles; this file's own <style> owns scene-local layout. UNLIKE the
       other three scenes, this one stays TRANSPARENT with only a dark
       gradient wash (it renders OVER the map flythrough video) — NO
       applyTextureBg/petal texture, no bg-helper.js script tag. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Dark gradient over the flythrough video for text readability — static
       shell chrome, transparent center / darker edges (kept from the pre-v2
       scene's over-video treatment, not a new invention). */
    .bg-overlay {
      position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(0,0,0,0.72) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.05) 100%),
        radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,0.35) 100%);
    }

    /* ── Two positioned wrapper slots (built ONCE by shell) ──────────────
       #mi-top: continuity with the HUD/map-pick's top frame. topFrame()
       returns ONE flex row (plate·center·plate, no wings here) rather than
       the HUD's three split regions, so exact coordinate parity with the
       HUD's edge-anchored plates isn't achievable — spec §7's "morph" is
       cross-scene coordinated coordinates + an entrance animation, NOT a
       true FLIP (that would need to track DOM nodes across a page reload,
       which OBS's browser-source reload on scene switch makes impossible).
       This scene instead places the frame in the SAME top-of-screen band the
       HUD/map-pick occupy (top edge, horizontally centered) so the eye reads
       it as "the same object, moved" even though it's a fresh element. */
    /* max-width caps the frame at 1840px (40px canvas margin either side) so
       a long event name hits shared CSS's .v2-event-name ellipsis path
       (theme-v2.css) instead of pushing the whole top frame off-canvas —
       same carry-over fix as gameplay-hud/map-pick's top frame. */
    #mi-top { top: 22px; left: 0; right: 0; margin: 0 auto; width: fit-content; max-width: 1840px; }
    /* #mi-deck: lower deck — ban tiles flanking the score deck (mockup: the
       card sits ~9% off the bottom, ~76% wide, horizontally centered).
       Centered via left/right:0 + margin:auto on an explicit-width box
       rather than left:50%+translateX(-50%): the slideUp shell entrance
       below animates `transform`, and its `both` fill would otherwise
       clobber a translateX and de-center the deck permanently (same
       gotcha gameplay-hud.html's #hud-center comment documents). */
    #mi-deck { left: 0; right: 0; bottom: 9%; margin: 0 auto; width: 76%; }

    .mi-slot { position: absolute; }

    /* overlay-core appends its volatile render container as #root's LAST
       child (after the shell wrappers + bg-overlay). This scene never uses
       it — render() writes into each wrapper's persistent .slot-content
       instead (the render-vs-reflow split, same as the other v2 scenes) —
       so the trailing, id-less container is hidden. EVERY child shell()
       builds (including .bg-overlay) must carry an id so this selector
       matches ONLY that trailing container, not a real piece of chrome. */
    #root > div:not([id]) { display: none; }

    /* ── Chips above the deck (MATCH POINT / MAP n · NAME · MODE) ────────── */
    .mi-chips { display: flex; justify-content: center; gap: 8px; margin-bottom: 10px; }
    .mi-chip-point {
      background: #fff; color: #0a0c11; font-weight: 800; font-size: 22px;
      letter-spacing: 1px; padding: 6px 16px; border-radius: var(--panel-radius);
      text-transform: uppercase;
    }
    .mi-chip-map {
      background: var(--panel-bg); border: var(--panel-border); color: #fff;
      font-weight: 800; font-size: 22px; letter-spacing: 1px;
      padding: 6px 16px; border-radius: var(--panel-radius); text-transform: uppercase;
    }

    /* ── Deck row: ban tile | ban tile | score deck | ban tile | ban tile ── */
    .mi-row { display: flex; align-items: stretch; gap: 8px; }

    /* Ban render tile (deck scale — smaller, simpler sibling of hero-bans.html's
       full-screen reveal panels: same art/fallback/name anatomy via the
       shared banArtTile() (components-v2.js, Plan 3 Task 1 consolidation),
       no slam/sweep animation — this is a steady-state card, not a reveal
       moment. Layout only here — background/border/border-radius/
       box-sizing/overflow/position live on the shared .v2-ban-art-tile
       class; this scene keeps only its own width/aspect-ratio/flex sizing. */
    .mi-ban-tile {
      width: 108px; aspect-ratio: 1 / 1.1; flex: none;
    }

    /* Score deck: dark panel, team blocks flanking a mini pinwheel hub. */
    .mi-deck-panel {
      flex: 1 1 auto; min-width: 0; background: var(--panel-bg); border: var(--panel-border);
      border-radius: var(--panel-radius); display: flex; align-items: center;
      justify-content: center; gap: 28px; padding: 14px 20px;
    }
    .mi-team-block { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .mi-team-block-right { flex-direction: row-reverse; text-align: right; }
    .mi-team-logo {
      width: 44px; height: 44px; border-radius: var(--panel-radius); object-fit: cover;
      flex: none; border: 1px solid rgba(255,255,255,0.15);
    }
    .mi-team-swatch { width: 44px; height: 44px; border-radius: var(--panel-radius); flex: none; }
    .mi-team-text { min-width: 0; }
    .mi-team-name {
      font-size: 28px; font-weight: 800; color: #fff; text-transform: uppercase;
      letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .mi-team-tag {
      margin-top: 3px; font-size: 22px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    }

    .mi-hub { display: flex; align-items: center; gap: 0; flex: none; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders must all be
       global before overlay-core wires the render loop. NO bg-helper.js —
       this scene never calls applyTextureBg (see the CSS comment above). NO
       ?./?? in the inline script (OBS Chromium 103 floor); var/function/
       string-concat style for consistency with the other v2 scenes. -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];

    // Dep (overlay-core loads it before the first render).
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }

    // One deck-scale ban tile. Shared render/portrait-fallback/slash/name
    // anatomy via banArtTile() (components-v2.js, Plan 3 Task 1 carry-over
    // consolidation with hero-bans.html's panelHtml()) — deck scale
    // (size: 108, matching this tile's own width so the fallback bust comes
    // out at banArtTile's documented exact 64px), animated: false and NO
    // entrance/sweep animation — the deck is a steady-state card (visible
    // for the whole map-intro hold), not a reveal moment. nameOverlay: true
    // reproduces the tile-bottom name bar this scene always had.
    function banTileDeck(heroKey, teamColor) {
      var hero = findHeroEntry(heroData, heroKey);
      var heroName = hero ? hero.name : heroKey;
      var renderUrl = hero ? hero.render : null;
      var portrait = hero ? hero.portrait : '';

      return banArtTile({
        renderUrl: renderUrl, portrait: portrait, heroName: heroName, teamColor: teamColor,
        size: 108, animated: false, nameOverlay: true,
        wrapperClass: 'mi-ban-tile'
      });
    }

    // One deck-scale team block: logo/swatch + name + optional tag. `side`
    // picks which edge the block sits on (mirrors the row so the logo stays
    // toward the outer edge, name/tag toward the hub — same left/right
    // mirroring convention as teamPlate()/.v2-wash-right in components-v2.js).
    function teamBlockHtml(team, color, tag, side) {
      var sideClass = side === 'right' ? ' mi-team-block-right' : '';
      var logoHtml = team.logo
        ? safeImg(team.logo, { 'class': 'mi-team-logo', alt: team.name || '' })
        : '<div class="mi-team-swatch" style="background:' + escapeHtml(color) + '"></div>';
      var tagHtml = tag ? '<div class="mi-team-tag" style="color:' + escapeHtml(color) + '">' + escapeHtml(tag) + '</div>' : '';
      return '<div class="mi-team-block' + sideClass + '">' + logoHtml +
        '<div class="mi-team-text"><div class="mi-team-name">' + escapeHtml(team.name || '') + '</div>' + tagHtml + '</div></div>';
    }

    // ── shell: builds the two entrance-animated wrappers exactly ONCE ────────
    // Same inline-animation-string mechanism as the other v2 scenes:
    // state-sync's replayAnimation() re-runs these on OBS show/hide; render()
    // only ever rewrites the inner .slot-content divs so they never replay on
    // a data tick. #mi-top slides down (echoes the HUD center band's own
    // slideDown), #mi-deck slides up a beat later, staggered.
    function shell(root) {
      root.setAttribute('data-shell-marker', 'map-intro-v2');
      root.innerHTML =
        '<div id="mi-bg" class="bg-overlay"></div>' +
        '<div id="mi-top" class="mi-slot" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="mi-deck" class="mi-slot" style="animation: slideUp 0.5s ease-out 0.25s both;">' +
          '<div class="slot-content"></div></div>';
    }

    // ── key: EXACTLY the state leaves render reads ──────────────────────────
    // maps is reduced to [name, mode, status, picker] per entry — that's
    // findCurrentMapIndex/findCurrentMap (status/name), the MAP n · NAME ·
    // MODE chip (name/mode), and the ATTACK FIRST/MAP PICK tags (picker).
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var hb = state.heroBans || {};
      var maps = (state.maps || []).map(function (m) {
        return [m.name, m.mode, m.status, m.picker];
      });
      return [
        t1.name, t1.logo, t1.score, t1.color,
        t2.name, t2.logo, t2.score, t2.color,
        maps,
        hb.team1, hb.team2,
        state.bestOf, state.eventName, state.swapSides,
        theme.team1Color, theme.team2Color
      ];
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var maps = state.maps || [];
      var bestOf = state.bestOf || maps.length || 5;
      var currentMap = findCurrentMap(maps);
      var currentIdx = findCurrentMapIndex(maps);

      // ── Map-number fix ────────────────────────────────────────────────
      // The old scene computed the displayed map number as
      // `(t1.score + t2.score) + 1` — a "count of maps decided so far"
      // heuristic that breaks the instant any map is a draw/void (doesn't
      // add to either score) or the series has a completed-but-scoreless
      // edge case: the number silently drifts from the actual map[] index.
      // findCurrentMapIndex walks the real per-map status (current ->
      // upcoming -> last played), so it's correct whenever state.maps is
      // populated. The score-sum heuristic is kept ONLY as a fallback for
      // the (pre-FACEIT-sync) moment state.maps is genuinely empty, where
      // there's no index to walk at all.
      var mapNum = maps.length > 0 ? currentIdx + 1 : (scoreOf(t1) + scoreOf(t2) + 1);

      var heroBans = state.heroBans || {};
      var t1bans = (heroBans.team1 || []).slice(0, 2);
      var t2bans = (heroBans.team2 || []).slice(0, 2);

      // ── Top frame: continuity with the HUD/map-pick top frame ──────────
      // banWings: null — bans are shown bigger in the deck below (spec §6:
      // "ban wings hide on scenes where bans are shown bigger elsewhere").
      // hubText mirrors gameplay-hud's "t1·t2" score hub. currentMapName
      // comes from findCurrentMap so the pill never blanks between maps.
      var hubText = scoreOf(t1) + '·' + scoreOf(t2);
      var topFrameHtml = topFrame({
        team1: { name: t1.name, logo: t1.logo, score: scoreOf(t1), color: t1color },
        team2: { name: t2.name, logo: t2.logo, score: scoreOf(t2), color: t2color },
        eventName: state.eventName,
        bestOf: bestOf,
        maps: maps,
        banWings: null,
        hubText: hubText,
        swapSides: state.swapSides,
        currentMapName: currentMap.name || null
      });
      document.querySelector('#mi-top .slot-content').innerHTML = topFrameHtml;

      // ── Chips: MATCH POINT + MAP n · NAME · MODE ────────────────────────
      // Winning threshold: first-to ceil(bestOf/2) maps == floor(bestOf/2)+1
      // (BO5 -> 3, BO3 -> 2). "Match point" fires the moment either team sits
      // ONE map below that (BO5: score 2; BO3: score 1) — win the current map
      // and the series ends.
      var threshold = Math.floor(bestOf / 2) + 1;
      var matchPoint = scoreOf(t1) === threshold - 1 || scoreOf(t2) === threshold - 1;
      var chipsHtml = '';
      if (matchPoint) {
        chipsHtml += '<div class="mi-chip-point">MATCH POINT</div>';
      }
      if (currentMap.name) {
        var mapChipText = 'MAP ' + mapNum + ' · ' + currentMap.name + (currentMap.mode ? ' · ' + currentMap.mode : '');
        chipsHtml += '<div class="mi-chip-map">' + escapeHtml(mapChipText) + '</div>';
      }

      // ── Lower deck: ban tiles flanking the score deck ───────────────────
      // Tags: read straight off the mockup (ban-reveal-map-intro.html §2) —
      // the NON-picker team carries "ATTACK FIRST", the picker carries
      // "MAP PICK". No picker on this map yet -> neither tag (there's no
      // real data to report, and guessing would be misleading on air).
      var picker = currentMap.picker || null;
      var t1Tag = picker === 'team1' ? 'MAP PICK' : (picker === 'team2' ? 'ATTACK FIRST' : '');
      var t2Tag = picker === 'team2' ? 'MAP PICK' : (picker === 'team1' ? 'ATTACK FIRST' : '');

      // Same swap invariant as topFrame/gameplay-hud: the team OBJECTS (logo,
      // name, tag, bans, screen side) flip with swapSides so the deck reads
      // as the SAME arrangement as the top frame right above it, but the
      // mini hub keeps TRUE team1/team2 colors + score order (a map result/
      // score belongs to the team, not to whichever side of the screen it's
      // currently drawn on — same invariant mapPips/the HUD medallion use).
      var swap = !!state.swapSides;
      var leftTeam = swap ? t2 : t1;
      var rightTeam = swap ? t1 : t2;
      var leftColor = swap ? t2color : t1color;
      var rightColor = swap ? t1color : t2color;
      var leftTag = swap ? t2Tag : t1Tag;
      var rightTag = swap ? t1Tag : t2Tag;
      var leftBans = swap ? t2bans : t1bans;
      var rightBans = swap ? t1bans : t2bans;

      var leftTilesHtml = '';
      for (var i = 0; i < leftBans.length; i++) leftTilesHtml += banTileDeck(leftBans[i], leftColor);
      var rightTilesHtml = '';
      for (var j = 0; j < rightBans.length; j++) rightTilesHtml += banTileDeck(rightBans[j], rightColor);

      // Mini hub reuses the same TRUE-identity "t1·t2" hubText as the top
      // frame's medallion above it (hubText, computed earlier).
      var deckHtml =
        teamBlockHtml(leftTeam, leftColor, leftTag, 'left') +
        '<div class="mi-hub">' + pinwheelSVG({ color1: t1color, color2: t2color, size: 48, hubText: hubText }) + '</div>' +
        teamBlockHtml(rightTeam, rightColor, rightTag, 'right');

      document.querySelector('#mi-deck .slot-content').innerHTML =
        '<div class="mi-chips">' + chipsHtml + '</div>' +
        '<div class="mi-row">' +
          leftTilesHtml +
          '<div class="mi-deck-panel">' + deckHtml + '</div>' +
          rightTilesHtml +
        '</div>';
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render,
      deps: [loadHeroes]
    });
  </script>
</body>
</html>
