<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Map Intro Overlay</title>
  <!-- Broadcast v2: same stack as gameplay-hud.html/map-pick.html/hero-bans.html
       — no Google Fonts (Geist via @font-face in fonts-v2.css); theme-v2.css/
       fonts-v2.css/animations.css own tokens + shared component-internal
       styles; this file's own <style> owns scene-local layout.

       OWNER QA BATCH 2 REDESIGN: the old scene was a HUD-style top frame bar
       plus a wide, mostly-empty lower score deck. Owner verdict: the top bar
       felt "squished/linear" and the bottom bar was "mostly empty… kind of
       meh", and — crucially — the flythrough video behind this scene does NOT
       need to stay visible ("we can have anything in the middle or any
       space"). So this is now a CENTERED full-screen BEAT (same family as
       hero-bans.html's Ban Reveal / series-winner.html's winner reveal): a big
       map name is the star, with a matchup band beneath flanked by ban art
       tiles. The topFrame() bar is gone entirely.

       Like map-pick/hero-bans it renders OVER the map flythrough video (an OBS
       media source) — so NO petal texture / applyTextureBg / bg-helper.js.
       Legibility over the moving video comes from (1) the dark over-video
       gradient wash kept from the pre-v2 scene (.bg-overlay, #mi-bg — an id'd
       child so #root>div:not([id]) still only hides overlay-core's trailing
       container) and (2) subtle team washes + solid panel/chip backgrounds +
       text-shadows, which is what lets the composition read on both a dark and
       a light/gray moving background.

       RENDER-OUTPUT ANIMATIONS (hero-bans.html's documented, plan-sanctioned
       deviation from the package's "shell owns the only entrance animations"
       rule, applied here too): shell() builds ONLY the persistent, id'd,
       build-once chrome (one-shot entrance fades only) — the gradient wash, the two team washes (colors
       set later via a CSS custom property, never a rebuild), and the centered
       stage wrapper. EVERY visible piece of the beat — eyebrow, map name,
       underline, chips, matchup band, ban tiles — is emitted fresh by render()
       with its own inline `animation:...both` shorthand, staggered, and all of
       it is rebuilt together on every keyed render. That's correct here: every
       field in this scene's key changing (a new map, a score/match-point flip,
       a swap, a ban change) really is a new broadcast moment that should
       re-play the entrance, exactly like hero-bans' ban panels. state-sync's
       replayAnimation() round-trips these via data-anim on OBS show/hide (the
       full inline shorthand — not a bare animation-delay longhand — is what
       survives that stash/restore; see banArtTile()'s comment). -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Dark gradient over the flythrough video for text readability — static
       shell chrome, transparent-ish center / darker edges (kept from the
       pre-v2 scene's over-video treatment, not a new invention). Sits behind
       everything. */
    .bg-overlay {
      position: absolute; inset: 0; pointer-events: none;
      background:
        linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.30) 45%, rgba(0,0,0,0.20) 100%),
        radial-gradient(ellipse 70% 60% at center, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.10) 60%, rgba(0,0,0,0.35) 100%);
    }

    /* Team washes (shell chrome, built ONCE, colors set via --wash-color) —
       same pattern as hero-bans.html: gives the over-video scene team-colored
       life without ever replaying their fade on a data tick (render() only
       calls setProperty on the persistent nodes). Stretched full-screen. */
    .mi-wash { position: absolute; inset: 0; pointer-events: none; }

    /* Centered stage: a full-screen flex column that vertically + horizontally
       centers the single .slot-content block render() writes into. No entrance
       animation of its own — its CHILDREN carry the staged inline animations
       (see the file-header comment). */
    #mi-stage {
      position: absolute; inset: 0; z-index: 2;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    #mi-stage > .slot-content { width: 100%; }

    /* overlay-core appends its volatile render container as #root's LAST child
       (after the shell wrappers). This scene never uses it — render() writes
       into each wrapper's persistent .slot-content instead — so the trailing,
       id-less container is hidden. EVERY child shell() builds carries an id so
       this selector matches ONLY that trailing container. */
    #root > div:not([id]) { display: none; }

    /* ── Eyebrow (event name, dim brand context above the name) ──────────── */
    .mi-eyebrow {
      font-size: 26px; font-weight: 700; letter-spacing: 6px; text-transform: uppercase;
      color: rgba(255,255,255,0.62); text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      margin-bottom: 18px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      max-width: 1400px; margin-left: auto; margin-right: auto;
    }

    /* ── Map name — the star (mobile floor >=72px; this goes BIG) ─────────── */
    .mi-name {
      font-size: 132px; font-weight: 800; line-height: 0.98; letter-spacing: 2px;
      text-transform: uppercase; color: #fff;
      text-shadow: 0 6px 34px rgba(0,0,0,0.8), 0 2px 8px rgba(0,0,0,0.7);
      max-width: 1720px; margin: 0 auto;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .mi-underline { width: 420px; height: 4px; margin: 24px auto 0; border-radius: 2px; }

    /* ── Chips row (MAP n · MODE, MATCH POINT) ───────────────────────────── */
    .mi-chips { display: flex; justify-content: center; gap: 14px; margin-top: 26px; }
    .mi-chip-map {
      background: var(--panel-bg); border: var(--panel-border); color: #fff;
      font-weight: 800; font-size: 30px; letter-spacing: 1.5px;
      padding: 10px 24px; border-radius: var(--panel-radius); text-transform: uppercase;
      text-shadow: 0 1px 4px rgba(0,0,0,0.7);
    }
    .mi-chip-point {
      background: #fff; color: #0a0c11; font-weight: 800; font-size: 30px;
      letter-spacing: 2px; padding: 10px 24px; border-radius: var(--panel-radius);
      text-transform: uppercase; box-shadow: 0 0 26px rgba(255,255,255,0.35);
    }

    /* ── Matchup band: [bans] team ··· score-hub ··· team [bans] ──────────── */
    .mi-match {
      display: flex; align-items: center; justify-content: center; gap: 26px;
      margin-top: 52px;
    }
    .mi-bans { display: flex; gap: 10px; flex: none; }
    /* Ban art tile (deck scale — shared banArtTile() anatomy: render/portrait
       fallback + red slash + name overlay). Layout only here; the shared look
       lives on .v2-ban-art-tile. */
    .mi-ban-tile { width: 140px; aspect-ratio: 1 / 1.12; flex: none; }

    /* Team block: logo + name/tag. Left block reads logo→text (text toward the
       center hub); right block mirrors it. max-width sized so full org names
       ("TORONTO DEFIANT", "LONDON SPITFIRE") fit without ellipsis; a genuinely
       long name still ellipsizes rather than blowing out the row. */
    .mi-team { display: flex; align-items: center; gap: 18px; flex: none; min-width: 0; max-width: 560px; }
    .mi-team-right { flex-direction: row-reverse; text-align: right; }
    .mi-logo {
      width: 76px; height: 76px; border-radius: var(--panel-radius); object-fit: cover;
      flex: none; border: 1px solid rgba(255,255,255,0.2); background: rgba(8,10,15,0.6);
    }
    .mi-swatch { width: 76px; height: 76px; border-radius: var(--panel-radius); flex: none; }
    .mi-team-text { min-width: 0; }
    .mi-team-name {
      font-size: 40px; font-weight: 800; color: #fff; text-transform: uppercase;
      letter-spacing: 0.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .mi-tag {
      margin-top: 6px; font-size: 24px; font-weight: 700; letter-spacing: 1.5px;
      text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,0,0,0.8);
    }

    /* Score hub: big team-colored scores flanking a pinwheel crest. */
    .mi-hub { display: flex; align-items: center; gap: 22px; flex: none; padding: 0 10px; }
    .mi-score {
      font-size: 78px; font-weight: 800; line-height: 1; flex: none;
      text-shadow: 0 2px 16px rgba(0,0,0,0.7);
    }

    /* Series pips beneath the matchup — adds series rhythm/context and keeps
       the beat feeling full without a "mostly empty" bar. Scaled up from the
       component default (transform-free — the row is a leaf, so it doesn't
       fight the wrapper's entrance animation). */
    .mi-pips { margin-top: 30px; display: flex; justify-content: center; }
    .mi-pips .v2-pips { gap: 8px; }
    .mi-pips .v2-pip {
      width: 46px; height: 38px; border-radius: 3px; font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders must all be
       global before overlay-core wires the render loop. NO bg-helper.js —
       this scene never calls applyTextureBg. NO ?./?? in the inline script
       (OBS Chromium 103 floor); var/function/string-concat for consistency
       with the other v2 scenes. -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';
    var heroData = [];

    // Dep (overlay-core loads it before the first render).
    function loadHeroes() {
      if (window.__HERO_DATA__) { heroData = window.__HERO_DATA__; return Promise.resolve(); }
      return fetch(API + '/api/heroes')
        .then(function (r) { return r.json(); })
        .then(function (d) { heroData = d || []; })
        .catch(function () { heroData = []; });
    }

    function scoreOf(team) {
      return (team.score === undefined || team.score === null) ? 0 : team.score;
    }

    // One matchup-scale ban art tile. Shared render/portrait-fallback/slash/
    // name anatomy via banArtTile() (components-v2.js). animated:false — the
    // whole beat's entrance lives on the wrapper's inline animation below; the
    // slash is steady-state here (a card held for the whole map-intro hold),
    // not a reveal sweep. nameOverlay:true keeps the hero name on the tile.
    function banTile(heroKey, teamColor) {
      var hero = findHeroEntry(heroData, heroKey);
      var heroName = hero ? hero.name : heroKey;
      var renderUrl = hero ? hero.render : null;
      var portrait = hero ? hero.portrait : '';
      return banArtTile({
        renderUrl: renderUrl, portrait: portrait, heroName: heroName, teamColor: teamColor,
        size: 140, animated: false, nameOverlay: true,
        wrapperClass: 'mi-ban-tile'
      });
    }

    function bansGroupHtml(bans, teamColor) {
      var html = '';
      for (var i = 0; i < bans.length; i++) html += banTile(bans[i], teamColor);
      return '<div class="mi-bans">' + html + '</div>';
    }

    // One team block: logo/swatch + name + optional tag. `side` mirrors the
    // row (logo outer, text toward the center hub) — same left/right
    // convention as the rest of the package.
    function teamBlockHtml(team, color, tag, side) {
      var sideClass = side === 'right' ? ' mi-team-right' : '';
      // v2-idle-breathe (Owner QA batch 2 Task 3b): leaf under .mi-match's
      // own entrance `both` fill (slideUp) — safe, see theme-v2.css's
      // idle-motion rules.
      var logoHtml = team.logo
        ? safeImg(team.logo, { 'class': 'mi-logo v2-idle-breathe', alt: team.name || '' })
        : '<div class="mi-swatch" style="background:' + escapeHtml(color) + '"></div>';
      var tagHtml = tag
        ? '<div class="mi-tag" style="color:' + escapeHtml(color) + '">' + escapeHtml(tag) + '</div>'
        : '';
      return '<div class="mi-team' + sideClass + '">' + logoHtml +
        '<div class="mi-team-text"><div class="mi-team-name">' + escapeHtml(team.name || '') + '</div>' +
        tagHtml + '</div></div>';
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    // Gradient wash + the two team washes + the centered stage wrapper. None of
    // these are rebuilt by render(): the washes only get a CSS custom property
    // set on them, and the stage's .slot-content is the ONLY thing render()
    // rewrites (with fully self-animated children). See the file-header
    // comment for why the beat lives in render() output here.
    function shell(root) {
      root.setAttribute('data-shell-marker', 'map-intro-v2');
      root.innerHTML =
        '<div id="mi-bg" class="bg-overlay"></div>' +
        '<div id="mi-wash-left" class="mi-wash v2-wash-left" style="animation: fadeIn 0.6s ease-out 0.05s both;"></div>' +
        '<div id="mi-wash-right" class="mi-wash v2-wash-right" style="animation: fadeIn 0.6s ease-out 0.05s both;"></div>' +
        '<div id="mi-stage"><div class="slot-content"></div></div>';
    }

    // ── key: EXACTLY the state leaves render reads ──────────────────────────
    // maps reduced to [name, mode, status, picker] per entry — findCurrentMap
    // fallback (status/name), the MAP n · MODE chip + map name (name/mode), and
    // the MAP PICK / ATTACK FIRST tags (picker). activeBanMapIdx is the
    // server's derived ban-map resolver answer — preferred for the map context
    // so the labeled map (name/number/mode) matches the bans shown, exactly
    // like hero-bans.html.
    function key(state) {
      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var hb = state.heroBans || {};
      var maps = (state.maps || []).map(function (m) {
        return [m.name, m.mode, m.status, m.picker, m.winner];
      });
      return [
        t1.name, t1.logo, t1.score, t1.color,
        t2.name, t2.logo, t2.score, t2.color,
        maps, state.activeBanMapIdx,
        hb.team1, hb.team2,
        state.bestOf, state.eventName, state.swapSides,
        theme.team1Color, theme.team2Color
      ];
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      var maps = state.maps || [];
      var bestOf = state.bestOf || maps.length || 5;

      // ── Map context ────────────────────────────────────────────────────
      // Prefer state.activeBanMapIdx (the server's DERIVED getActiveBanIdx
      // answer) so the labeled map — name, number, mode, picker — is the SAME
      // map whose bans (heroBans, derived from that index) are shown in the
      // matchup band below. Fall back to findCurrentMap for pre-fix/persisted
      // states that carry no activeBanMapIdx (-1/undefined), and finally to the
      // score-sum heuristic only when maps is genuinely empty (pre-sync).
      var abIdx = (typeof state.activeBanMapIdx === 'number') ? state.activeBanMapIdx : -1;
      var mapIdx = (abIdx >= 0 && maps[abIdx]) ? abIdx : findCurrentMapIndex(maps);
      var currentMap = (mapIdx >= 0 && maps[mapIdx]) ? maps[mapIdx] : {};
      var mapNum = maps.length > 0 ? mapIdx + 1 : (scoreOf(t1) + scoreOf(t2) + 1);

      var heroBans = state.heroBans || {};
      var t1bans = (heroBans.team1 || []).slice(0, 2);
      var t2bans = (heroBans.team2 || []).slice(0, 2);

      // ── MATCH POINT ─────────────────────────────────────────────────────
      // Winning threshold: floor(bestOf/2)+1 (BO5 -> 3, BO3 -> 2). Fires the
      // moment either team sits ONE map below it (win the current map and the
      // series ends) — same logic as the pre-redesign scene.
      var threshold = Math.floor(bestOf / 2) + 1;
      var matchPoint = scoreOf(t1) === threshold - 1 || scoreOf(t2) === threshold - 1;

      // Tags from the map picker: the picker team carries MAP PICK, the other
      // ATTACK FIRST. No picker -> neither tag (no real data to report).
      var picker = currentMap.picker || null;
      var t1Tag = picker === 'team1' ? 'MAP PICK' : (picker === 'team2' ? 'ATTACK FIRST' : '');
      var t2Tag = picker === 'team2' ? 'MAP PICK' : (picker === 'team1' ? 'ATTACK FIRST' : '');

      // Swap invariant: the team OBJECTS (logo, name, tag, bans, screen side)
      // flip with swapSides so the band reads left→right as OBS shows the
      // teams; the score hub keeps TRUE team1/team2 identity — the pinwheel
      // petal colors are always color1=t1/color2=t2, and each flanking score is
      // its own team's (a score belongs to the team, not a screen side). Same
      // invariant mapPips/the HUD medallion use.
      var swap = !!state.swapSides;
      var leftTeam = swap ? t2 : t1;
      var rightTeam = swap ? t1 : t2;
      var leftColor = swap ? t2color : t1color;
      var rightColor = swap ? t1color : t2color;
      var leftTag = swap ? t2Tag : t1Tag;
      var rightTag = swap ? t1Tag : t2Tag;
      var leftBans = swap ? t2bans : t1bans;
      var rightBans = swap ? t1bans : t2bans;

      // Washes — persistent nodes; setProperty repaints without a rebuild, so
      // their shell fade never replays on a data tick (hero-bans pattern).
      document.getElementById('mi-wash-left').style.setProperty('--wash-color', hexToAlpha(t1color, 0.20));
      document.getElementById('mi-wash-right').style.setProperty('--wash-color', hexToAlpha(t2color, 0.20));

      // ── Beat (all render-output, each with its own staggered inline
      // animation — see file-header comment) ─────────────────────────────
      var html = '';

      if (state.eventName) {
        html += '<div class="mi-eyebrow" style="animation: fadeIn 0.5s ease-out 0.10s both;">' +
          escapeHtml(state.eventName) + '</div>';
      }

      if (currentMap.name) {
        html += '<div class="mi-name" style="animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.16s both;">' +
          escapeHtml(currentMap.name) + '</div>';
        html += '<div class="mi-underline v2-underline" style="animation: fadeIn 0.6s ease-out 0.30s both;"></div>';
      }

      var chipsHtml = '';
      if (currentMap.name) {
        var mapChipText = 'MAP ' + mapNum + (currentMap.mode ? ' · ' + currentMap.mode : '');
        chipsHtml += '<div class="mi-chip-map">' + escapeHtml(mapChipText) + '</div>';
      }
      if (matchPoint) {
        chipsHtml += '<div class="mi-chip-point">MATCH POINT</div>';
      }
      if (chipsHtml) {
        html += '<div class="mi-chips" style="animation: slideUp 0.5s ease-out 0.36s both;">' + chipsHtml + '</div>';
      }

      // Score hub: the hub is this scene's ONLY score display, so the numbers
      // must sit next to the team they belong to — scores + their colors flip
      // WITH the team blocks under swapSides (review finding: a fixed-order
      // hub reads backwards when swapped). The pinwheel petals alone keep
      // true team identity (the package invariant for identity marks).
      var hubHtml =
        '<div class="mi-hub">' +
          '<div class="mi-score" style="color:' + escapeHtml(leftColor) + '">' + scoreOf(leftTeam) + '</div>' +
          '<div class="v2-medallion">' + pinwheelSVG({ color1: t1color, color2: t2color, size: 72 }) + '</div>' +
          '<div class="mi-score" style="color:' + escapeHtml(rightColor) + '">' + scoreOf(rightTeam) + '</div>' +
        '</div>';

      html += '<div class="mi-match" style="animation: slideUp 0.55s cubic-bezier(0.16,1,0.3,1) 0.46s both;">' +
        bansGroupHtml(leftBans, leftColor) +
        teamBlockHtml(leftTeam, leftColor, leftTag, 'left') +
        hubHtml +
        teamBlockHtml(rightTeam, rightColor, rightTag, 'right') +
        bansGroupHtml(rightBans, rightColor) +
        '</div>';

      // Series pips — TRUE winner colors (mapPips never swap-flips).
      if (maps.length > 0) {
        html += '<div class="mi-pips" style="animation: fadeIn 0.5s ease-out 0.56s both;">' +
          mapPips({ maps: maps, bestOf: bestOf, team1Color: t1color, team2Color: t2color }) + '</div>';
      }

      document.querySelector('#mi-stage .slot-content').innerHTML = html;
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render,
      deps: [loadHeroes]
    });
  </script>
</body>
</html>
