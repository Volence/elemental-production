<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BRB</title>
  <!-- Broadcast v2 (Plan 3 Task 6): countdown full-screen, rebuilt onto
       overlay-core's defineOverlay (was hand-rolled buildKey/lastBuildKey +
       raw stateSync(update), ES2020 ?. throughout — see starting-soon.html's
       file-header comment for the full writeup of why that's disallowed;
       this scene made the identical migration).

       TEXTURE LAYER: applyTextureBg() directly on #root (map-pick.html
       pattern) — no cam cutout in this full-screen scene. See
       starting-soon.html's file-header comment for the two-layer-vs-one
       rationale (shared across all three Task 6 scenes, documented once).

       BRAND MARK / BREATHING (spec §6, explicit for this scene): the raster
       ./org.png "breathe" logo (opacity 0.8<->1 CSS-class animation) is
       replaced by a small pinwheelSVG crest. Owner QA batch 2 (Task 3b)
       upgraded this to the package-wide idle-motion utilities (theme-v2.css):
       a slow spin + a glow pulse, same treatment as starting-soon/end-of-
       stream's crests — this file's own bespoke `@keyframes petalBreathe`
       (opacity + filter:brightness only, no transform) is GONE, consolidated
       into the shared `.v2-idle-glow`. The spin (`.v2-idle-spin`, transform:
       rotate) lives on a nested inner <span> around the SVG, NOT on
       #brb-crest itself: #brb-crest is a plain flex child of #brb-content
       (no transform of its own for positioning), and the package-wide
       convention for any animated wrapper that might ever need transform-
       based centering is to keep transform off animations applied to
       persistent page wrappers — see between-matches.html's "centered
       wrappers" comment for the same underlying gotcha (an animation's
       transform silently overwrites a positioning transform set elsewhere).
       Wrapping keeps that guarantee for #brb-crest while still letting the
       SVG itself spin. Crest colors are neutral ELEMENT BRAND accents
       (--elmt-red/--elmt-gold as literal hsl() strings — pinwheelSVG needs a
       literal color string, not a var(), since it lands in an SVG fill
       attribute), not team colors — this is an idle/context-free scene.

       STATIC CHROME: the heading ("WE'LL BE RIGHT BACK"), subtitle
       ("Please stand by"), and crest never depend on state, so — unlike the
       countdown box and event label — they're built once in shell()'s
       literal markup rather than being re-emitted by render() on every
       keyed repaint (the render-vs-reflow split: shell owns chrome that
       must never rebuild on data).

       COUNTDOWN CONTRACT (preserved EXACTLY, id `brb-timer-text`): same
       split as starting-soon.html/between-matches.html — render() (key-
       gated) owns the countdown box's PRESENCE (countdown.visible toggles
       the wrapper + rebuilds the digits node); a SECOND, independent
       stateSync subscriber (trackCountdown) keeps `latestCountdown` fresh
       and re-arms startLocalTick every real state change, decoupled from
       the keyed render. The resolver re-queries #brb-timer-text live so it
       survives #brb-cd's innerHTML rebuild.

       COUNTDOWN FORMATTING NOTE (v1.3.8 dashboard-bug-batch carry-over,
       still true here): countdown.js's formatTime() now formats
       unconditionally (0 -> "00:00"), matching starting-soon.html/between-
       matches.html. The pre-v2 brb.html was the one outlier that special-
       cased falsy/<=0 input to blank string — that divergence was already
       reconciled away when countdown.js was extracted (see that file's own
       header comment), so this v2 rewrite inherits the unconditional
       "00:00" display for free; no new behavior introduced here.

       KEY: unchanged read-set from the pre-v2 buildKey — eventName +
       countdown.visible. Neither the heading/subtitle/crest (static) nor
       anything else render() touches depends on more than that. -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    #brb-content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
    }
    #brb-event { position: absolute; left: 0; right: 0; bottom: 54px; margin: 0 auto; width: fit-content; }

    /* overlay-core appends its volatile render container as #root's LAST
       child; this scene never uses it directly (render() writes into each
       wrapper's persistent .slot-content). Every shell child above carries
       an id, so this only matches that trailing container. */
    #root > div:not([id]) { display: none; }

    /* Idle spin+glow crest (see file-header comment) — the utilities and their
       @keyframes now live in theme-v2.css (.v2-idle-spin/.v2-idle-glow),
       shared with starting-soon.html/end-of-stream.html's crests. */
    #brb-crest { margin-bottom: 26px; }

    .brb-heading {
      font-size: 118px; font-weight: 800; letter-spacing: 9px; text-transform: uppercase;
      line-height: 0.95; text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }
    .brb-sub {
      font-size: 24px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase;
      color: rgba(255,255,255,0.45); margin-top: 14px;
    }
    #brb-cd { margin-top: 34px; }
    /* Floor for this scene: countdown digits >=48px (spec). */
    .brb-cd-digits {
      font-size: 80px; font-weight: 800; letter-spacing: 3px; line-height: 1;
      font-variant-numeric: tabular-nums;
      background: var(--grad4); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + bg helper
       + countdown engine must all be global before overlay-core wires the
       render loop. NO ?./?? in the inline script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./countdown.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    // Brand crest palette — literal hsl() strings mirroring theme-v2.css's
    // --elmt-red/--elmt-gold/--elmt-green/--elmt-blue in canonical order
    // (see file-header comment). Neutral scene → full 4-color brand mark.
    var BRB_BRAND = ['hsl(0 85% 60%)', 'hsl(45 95% 55%)', 'hsl(140 70% 50%)', 'hsl(200 90% 55%)'];

    // ── shell: builds the persistent chrome exactly ONCE — heading/subtitle/
    // crest are 100% static (never state-driven), so they live here rather
    // than being re-emitted by render() (see file-header comment). ─────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'brb-v2');
      applyTextureBg(root);
      root.innerHTML =
        '<div id="brb-content">' +
          '<div id="brb-crest">' +
            '<span class="v2-idle-glow"><span class="v2-idle-spin" style="display:inline-block;">' +
              pinwheelSVG({ colors: BRB_BRAND, size: 96 }) +
            '</span></span>' +
          '</div>' +
          '<div class="brb-heading" style="animation: fadeIn 0.7s ease-out 0.15s both;">WE&#39;LL BE RIGHT BACK</div>' +
          '<div class="brb-sub" style="animation: fadeIn 0.7s ease-out 0.25s both;">Please stand by</div>' +
          '<div id="brb-cd" style="animation: fadeIn 0.7s ease-out 0.35s both;"><div class="slot-content"></div></div>' +
        '</div>' +
        '<div id="brb-event" style="animation: slideUp 0.5s ease-out 0.20s both;"><div class="slot-content"></div></div>';
    }

    // ── key: eventName + countdown.visible — unchanged from the pre-v2
    // buildKey (see file-header comment). ───────────────────────────────
    function key(state) {
      var countdown = state.countdown || {};
      return [state.eventName, countdown.visible !== false];
    }

    function render(state) {
      applyTheme(state);

      var countdown = state.countdown || null;
      var countdownVisible = !countdown || countdown.visible !== false;
      var cdWrap = document.getElementById('brb-cd');
      cdWrap.style.display = countdownVisible ? '' : 'none';
      document.querySelector('#brb-cd .slot-content').innerHTML = countdownVisible
        ? '<div class="brb-cd-digits" id="brb-timer-text">' + formatTime(getRemaining(countdown, Date.now())) + '</div>'
        : '';

      document.querySelector('#brb-event .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT SEASON 8' });
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });

    // ── Countdown live-tick wiring (decoupled from the keyed render above —
    // see file-header comment; same split as starting-soon.html/between-
    // matches.html). ─────────────────────────────────────────────────────
    var latestCountdown = null;
    function trackCountdown(state) {
      latestCountdown = state.countdown || null;
      startLocalTick(function () { return document.getElementById('brb-timer-text'); }, function () { return latestCountdown; });
    }
    stateSync(trackCountdown);
  </script>
</body>
</html>
