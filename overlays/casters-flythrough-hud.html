<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Casters Flythrough HUD</title>
  <!-- Broadcast v2 (Plan 3 Task 4): the OVER-VIDEO cam-scene variant. Unlike
       casters.html/casters-scoreboard.html/casters-lobby.html/
       casters-map-score.html, this scene paints NOTHING opaque at all — it
       sits on top of the map flythrough video (an OBS media source), so
       there is no petal texture, no #cd-bg layer, and no cutout mask
       (there's nothing to punch a hole IN; the whole page is already
       transparent). bg-helper.js is therefore not loaded — this scene has
       no use for applyTextureBg/applyCutoutMask. The old scene had no dark
       gradient wash either (compare map-intro.html, which keeps one because
       ITS v1 predecessor had one) — legibility over the moving video instead
       comes from eventHeader's and camFrame's own opaque panel-bg chips
       (dark solid, not translucent-over-a-wash), same as the old scene's
       per-element rgba(0,0,0,0.45-0.55) + backdrop-blur chips. No deck (the
       flythrough IS the visual; this overlay is frame + names + title only).

       Cam frames: CAM_LAYOUTS.flythrough (legacy OBS-measured coordinates,
       preserved verbatim in cam-layout.js — NOT the desk rects). The old
       hardcoded per-caster rainbow gradient accent bars are gone; camFrame's
       built-in gradient-4 underline replaces them (same swap casters.html
       made for its own old rainbow bars). -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* Positioned wrapper slots (built ONCE by shell). #cd-header uses
       width:fit-content + margin:auto rather than left:50%+translateX so the
       slideDown entrance transform doesn't clobber the centering (same
       gotcha documented on casters.html's #cd-header). */
    #cd-header { position: absolute; top: 40px; left: 0; right: 0; margin: 0 auto; width: fit-content; }
    /* Cam frames sit directly in canvas coordinates (CAM_LAYOUTS rects are
       already 1920x1080-space) — plain full-canvas positioning context. */
    #cd-cams { position: absolute; inset: 0; }

    /* Hide overlay-core's trailing volatile container (this scene renders into
       each shell wrapper's .slot-content instead). Every shell child is id'd,
       so this only matches that container. */
    #root > div:not([id]) { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- No bg-helper.js: this scene never builds a texture/cutout layer. No
       pinwheel.js: neither eventHeader nor camFrame use pinwheelSVG. -->
  <script src="./theme-helpers.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./cam-layout.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    function normalizeLayout(v) {
      return (v === undefined || v === null) ? 2 : v;
    }

    // ── shell: builds the persistent chrome exactly ONCE ────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'casters-flythrough-v2');
      root.innerHTML =
        '<div id="cd-header" style="animation: slideDown 0.5s ease-out 0.10s both;">' +
          '<div class="slot-content"></div></div>' +
        '<div id="cd-cams" style="animation: fadeIn 0.5s ease-out 0.15s both;">' +
          '<div class="slot-content"></div></div>';
    }

    // ── key: casters names, casterLayout, eventName, theme team colors (v1
    // read-set — no teams/maps at all, this scene draws no deck). ───────────
    function key(state) {
      var theme = state.theme || {};
      var casters = (state.casters || []).map(function (c) { return c && c.name; });
      return [casters, state.casterLayout, state.eventName, theme.team1Color, theme.team2Color];
    }

    function render(state) {
      applyTheme(state);

      var casters = state.casters || [];
      var layout = normalizeLayout(state.casterLayout);
      var camRects = layout === 0 ? [] : (layout === 1 ? CAM_LAYOUTS.flythrough.single : CAM_LAYOUTS.flythrough.dual);

      document.querySelector('#cd-header .slot-content').innerHTML =
        eventHeader({ eventName: state.eventName || 'FACEIT Season 8', subtitle: 'CASTED BY' });

      var camsHtml = '';
      for (var i = 0; i < camRects.length; i++) {
        var caster = casters[i] || {};
        camsHtml += camFrame({ rect: camRects[i], name: caster.name || '' });
      }
      document.querySelector('#cd-cams .slot-content').innerHTML = camsHtml;
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });
  </script>
</body>
</html>
