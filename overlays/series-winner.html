<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Series Winner</title>
  <!-- Broadcast v2 (Plan 3 Task 7): full-screen reveal, rebuilt onto
       overlay-core's defineOverlay (was hand-rolled buildKey-less raw
       stateSync(update), ES2020 ?. on state.teams?.team1/team2 throughout —
       the OBS Chromium 103 floor + this package's "ES2019-safe, no ?./??"
       rule both forbid that; see starting-soon.html's file-header comment
       for the full writeup of why the whole package made this migration).

       WINNER LOGIC PRESERVED EXACTLY: state.seriesWinner (explicit override)
       wins over the computed fallback (either team's score >= ceil(bestOf/2)
       once at least one team has scored) which wins over the "Series in
       progress…" waiting state. Not touched beyond swapping `?.` for `||{}`
       reads — see render() below, byte-for-byte the same branching as the
       pre-v2 update().

       RENDER-OUTPUT ANIMATIONS (hero-bans.html's documented deviation,
       applied here too): everywhere else in the v2 package, shell() owns
       the ONLY entrance animations and render() never puts `animation` on
       anything it writes, so a routine data tick can't replay chrome. This
       scene is the other sanctioned exception (alongside hero-bans' ban
       panels): shell() builds nothing but the two persistent, ID'd,
       animation-free wrappers (#sw-stage, #sw-event-bar); EVERY visible
       element — waiting message, pinwheel, glow burst, logo, name, score,
       chip, event pill — is emitted fresh by render() with its own inline
       `animation:...both` shorthand, and ALL of it is rebuilt together on
       every keyed render. That's correct here because every field in this
       scene's key (teams, bestOf, seriesWinner, eventName, theme colors)
       changing really does mean a new broadcast moment — a winner being
       declared, a series score correction, or a total team swap — never an
       incidental tick that should stay invisible. So a winner FLIP (e.g. a
       correction from team1 to team2) replays the whole reveal exactly like
       the first reveal, which is the desired "re-reveal" behavior called
       out in the plan.

       PINWHEEL SPIN-UP (spec §6 "winner-color pinwheel spins up... behind
       the winning team logo"): #sw-pinwheel is a large (620px) pinwheelSVG
       instance, winner color for the 'p' petal group and white for the 's'
       group (the plan's explicit "winner color + white" option — reads as
       a genuine glow/starburst behind a single logo rather than a two-team
       medallion). It's absolutely centered behind the logo via
       inset:0;margin:auto on a sized box (NOT left/top 50% + translate) so
       the entrance animation's own rotate+scale transform is the ONLY
       transform touching the element — no positioning transform for the
       animation to clobber (the same "centered wrappers" pitfall documented
       in between-matches.html/brb.html/starting-soon.html, side-stepped
       here the auto-margin way instead of their width:fit-content way,
       since this wrapper needs two-axis centering). #sw-glow-burst is a
       second, larger auto-margin-centered layer doing a pure scale+fade
       "burst" (spec: "petal glow burst") that decays away while the
       pinwheel settles into its final rotated/scaled resting pose — both
       are one-shot entrances (fill:both), not a perpetual spinner; an
       infinitely-rotating element would be a retained transform on
       render-output chrome, the same class of thing the package's idle-
       animation rule (opacity/filter only, no transform) exists to avoid.

       CHIP: the old 🏆 emoji badge is replaced by a text-only "SERIES
       CHAMPION" chip in the v2 panel/chip vocabulary (interview.html's
       .iv-chip, hero-bans.html's roleMeta() comment) — no emoji glyph,
       consistent with the package-wide rationale that OBS's embedded CEF
       renders emoji inconsistently.

       KEY: unchanged read-set from the pre-v2 buildKey-equivalent — teams,
       bestOf, seriesWinner, eventName, theme (team colors only, via
       applyTheme's state.theme + state.teams.*.color inputs — same
       array-of-primitives shape the old renderKey used, just JSON-keyed by
       overlay-core instead of a hand-rolled comparison). -->
  <link rel="stylesheet" href="./theme-v2.css">
  <link rel="stylesheet" href="./fonts-v2.css">
  <link rel="stylesheet" href="./animations.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: transparent; overflow: hidden; width: 1920px; height: 1080px;
      font-family: var(--font-v2); color: #fff;
    }
    #root { position: relative; width: 1920px; height: 1080px; }

    /* ── Persistent, animation-free wrappers (shell-built ONCE) ───────────
       See file-header comment: the reveal itself lives entirely in render()
       output inside these two boxes, which is why neither wrapper carries
       an entrance animation of its own. */
    #sw-stage {
      position: absolute; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; z-index: 1;
    }
    #sw-event-bar { position: absolute; left: 0; right: 0; bottom: 60px; display: flex; justify-content: center; z-index: 1; }

    /* overlay-core appends its volatile render container as #root's LAST
       child; this scene never uses it (render() writes into the shell
       wrappers' .slot-content instead). Both shell children above carry an
       id, so this only matches that trailing container. */
    #root > div:not([id]) { display: none; }

    /* ── Waiting state ─────────────────────────────────────────────────── */
    .sw-waiting { color: rgba(255,255,255,0.35); font-size: 26px; font-weight: 700; letter-spacing: 1px; }
    .sw-waiting-logo { width: 84px; height: 84px; object-fit: contain; margin-bottom: 18px; opacity: 0.5; }

    /* ── Winner label ─────────────────────────────────────────────────── */
    .sw-label {
      font-size: 26px; font-weight: 800; letter-spacing: 10px; text-transform: uppercase;
      color: rgba(255,255,255,0.55); margin-bottom: 20px;
      /* The 620px pinwheel in the later .sw-logo-wrap sibling overflows
         upward across this label — lift the label above it (owner QA batch
         3: "series winner text is behind the icon") and shadow it so it
         stays legible over petals of any team color. */
      position: relative; z-index: 2;
      text-shadow: 0 2px 8px rgba(0,0,0,0.85), 0 0 18px rgba(0,0,0,0.6);
    }

    /* ── Logo + pinwheel-behind-logo stack ────────────────────────────────
       Fixed-size positioned box so the large pinwheel/glow layers (bigger
       than the box itself) have a containing block to auto-margin-center
       against (see file-header comment). */
    /* margin:0 auto (not just flex align-items on the ancestor #sw-stage) —
       .sw-logo-wrap sits inside .slot-content, a plain block, so #sw-stage's
       flex centering doesn't reach it; a fixed-width block only self-centers
       via auto side margins (same fix already applied by the package's other
       "explicit-width block among text-align:center siblings" cases). */
    .sw-logo-wrap { position: relative; width: 160px; height: 160px; margin: 0 auto 22px; display: flex; align-items: center; justify-content: center; }
    /* Oversized-abspos centering: an element BIGGER than its containing block
       cannot use inset:0;margin:auto (the over-constrained rule pins it to the
       left edge in LTR). Negative half-size margins center it without touching
       transform — which stays reserved for the entrance rotate+scale. */
    #sw-pinwheel { position: absolute; left: 50%; top: 50%; margin: -310px 0 0 -310px; width: 620px; height: 620px; z-index: 0; pointer-events: none; }
    #sw-glow-burst {
      position: absolute; left: 50%; top: 50%; margin: -310px 0 0 -310px; width: 620px; height: 620px; border-radius: 50%;
      z-index: 0; pointer-events: none;
      background: radial-gradient(circle, var(--sw-glow, rgba(255,255,255,0.4)) 0%, transparent 70%);
    }
    .sw-logo { position: relative; z-index: 1; width: 148px; height: 148px; object-fit: contain; filter: drop-shadow(0 0 30px var(--sw-glow, rgba(255,255,255,0.3))); }

    @keyframes swPinwheelSpinUp {
      0%   { opacity: 0;    transform: rotate(-220deg) scale(0.25); }
      55%  { opacity: 1; }
      100% { opacity: 0.85; transform: rotate(0deg) scale(1); }
    }
    @keyframes swGlowBurst {
      0%   { opacity: 0.9; transform: scale(0.2); }
      55%  { opacity: 0.55; }
      100% { opacity: 0;   transform: scale(1.6); }
    }

    /* ── Winner name — the star (spec: keep ~100px, Geist) ───────────────── */
    .sw-name {
      font-size: 100px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; line-height: 1;
      text-shadow: 0 4px 30px rgba(0,0,0,0.5);
    }

    /* margin:0 auto — same fixed-width-block-among-text-align:center-siblings
       fix as .sw-logo-wrap above (a block with an explicit width isn't
       centered by an ancestor's text-align, only its own inline content is). */
    .sw-underline { width: 220px; height: 3px; margin: 22px auto; }

    /* ── Score line ───────────────────────────────────────────────────── */
    .sw-score { font-size: 60px; font-weight: 800; letter-spacing: 6px; color: rgba(255,255,255,0.7); }
    .sw-score .sw-winner-score { font-size: 72px; }
    .sw-vs { font-size: 22px; font-weight: 700; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-top: 10px; text-transform: uppercase; }

    /* ── Champion chip (replaces the old 🏆 emoji badge — see file-header) ── */
    .sw-chip {
      margin-top: 32px; padding: 12px 40px; background: var(--panel-bg); border: 1px solid;
      border-radius: var(--panel-radius); font-size: 22px; font-weight: 800; letter-spacing: 6px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- Script order matters: helpers + SVG + component builders + bg helper
       must all be global before overlay-core wires the render loop. NO
       ?./?? in the inline script (OBS Chromium 103 floor). -->
  <script src="./theme-helpers.js"></script>
  <script src="./pinwheel.js"></script>
  <script src="./components-v2.js"></script>
  <script src="./bg-helper.js"></script>
  <script src="./overlay-core.js"></script>
  <script src="./state-sync.js"></script>
  <script>
    var API = 'http://localhost:3001';

    // Waiting-state brand crest palette — literal hsl() strings mirroring
    // theme-v2.css's --elmt-red/--elmt-gold/--elmt-green/--elmt-blue in
    // canonical order. Before a winner exists this scene is neutral (no team
    // yet), so it shows the vector 4-color brand mark. The WINNER state keeps
    // the winning team's color (pinwheelSVG color1/color2 below).
    var SW_BRAND = ['hsl(0 85% 60%)', 'hsl(45 95% 55%)', 'hsl(140 70% 50%)', 'hsl(200 90% 55%)'];

    // Darken a hex color by factor f (0..1 of original brightness). The
    // winner pinwheel's secondary petal group used to be hardcoded WHITE
    // (owner QA batch 3: "are the side petals just always white?") — now
    // it's a darker shade of the winner's own color, so the whole crest
    // reads as the winning team with tonal depth instead of a neutral wing.
    // Non-hex input (hsl()/rgba() theme values) falls back to a neutral.
    function swShade(hex, f) {
      var m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim());
      if (!m) return 'rgba(255,255,255,0.75)';
      var n = parseInt(m[1], 16);
      var r = Math.round(((n >> 16) & 255) * f);
      var g = Math.round(((n >> 8) & 255) * f);
      var b = Math.round((n & 255) * f);
      return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    // ── shell: builds ONLY the two persistent, animation-free wrappers —
    // see file-header comment for why every visible pixel is render output
    // here instead of shell chrome. ─────────────────────────────────────
    function shell(root) {
      root.setAttribute('data-shell-marker', 'series-winner-v2');
      applyTextureBg(root);
      root.innerHTML =
        '<div id="sw-stage"><div class="slot-content"></div></div>' +
        '<div id="sw-event-bar"><div class="slot-content"></div></div>';
    }

    // ── key: teams, bestOf, seriesWinner, eventName, theme team colors —
    // EXACTLY the pre-v2 renderKey read-set (see file-header comment). ───
    function key(state) {
      return [state.teams, state.bestOf, state.seriesWinner, state.eventName, state.theme];
    }

    function waitingHtml() {
      return '<div class="sw-waiting" style="animation: fadeIn 0.5s ease-out both;">' +
        '<div class="sw-waiting-logo">' + pinwheelSVG({ colors: SW_BRAND, size: 84, glow: false }) + '</div>' +
        '<div>Series in progress&hellip;</div>' +
        '</div>';
    }

    function winnerHtml(winner, loser, wScore, lScore, teamColor, teamColorAlt) {
      // safeImg() already routes src through _proxyImg() internally —
      // pass the raw logo URL, not a pre-proxied one (double-proxying is
      // idempotent but redundant; this matches every other v2 scene's
      // safeImg() call sites).
      // v2-idle-breathe (Owner QA batch 2 Task 3b) goes on a dedicated inner
      // <span>, NOT on .sw-logo itself: .sw-logo sits in the reveal stack
      // alongside #sw-pinwheel/#sw-glow-burst's own entrance transforms, and
      // per theme-v2.css's idle-motion rules a leaf that's part of an
      // entrance stack gets its idle class on a wrapping span so a future
      // entrance treatment added directly to .sw-logo can't collide with it.
      var logoHtml = winner.logo
        ? '<span class="v2-idle-breathe" style="display:inline-block;line-height:0;">' +
            safeImg(winner.logo, { 'class': 'sw-logo' }) +
          '</span>'
        : '';
      return (
        '<div class="sw-label" style="animation: slideDown 0.5s ease-out 0.05s both;">Series Winner</div>' +
        '<div class="sw-logo-wrap">' +
          '<div id="sw-pinwheel" style="animation: swPinwheelSpinUp 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.15s both;">' +
            pinwheelSVG({ color1: teamColor, color2: teamColorAlt || swShade(teamColor, 0.55), size: 620, glow: false }) +
          '</div>' +
          '<div id="sw-glow-burst" style="animation: swGlowBurst 1.3s ease-out 0.15s both;"></div>' +
          logoHtml +
        '</div>' +
        '<div class="sw-name" style="color:' + escapeHtml(teamColor) + '; animation: scaleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s both;">' + escapeHtml(winner.name || '') + '</div>' +
        '<div class="sw-underline v2-underline" style="animation: fadeIn 0.6s ease-out 0.5s both;"></div>' +
        '<div class="sw-score" style="animation: slideUp 0.5s ease-out 0.6s both;">' +
          '<span class="sw-winner-score" style="color:' + escapeHtml(teamColor) + '">' + wScore + '</span>' +
          '<span style="margin: 0 10px; opacity: 0.3">&mdash;</span>' +
          '<span>' + lScore + '</span>' +
        '</div>' +
        '<div class="sw-vs" style="animation: fadeIn 0.5s ease-out 0.72s both;">vs ' + escapeHtml(loser.name || '') + '</div>' +
        '<div class="sw-chip" style="color:' + escapeHtml(teamColor) + '; border-color:' + escapeHtml(teamColor) + '; animation: scaleIn 0.5s ease-out 0.8s both;">Series Champion</div>'
      );
    }

    function render(state) {
      applyTheme(state);

      var teams = state.teams || {};
      var t1 = teams.team1 || {};
      var t2 = teams.team2 || {};
      var theme = state.theme || {};
      // theme.team1Color/team2Color override team.color — same precedence
      // every other v2 scene applies (gameplay-hud/hero-bans/map-pick); the
      // pre-v2 series-winner only read team.color directly, but the plan's
      // key explicitly calls out "theme team colors", so this scene now
      // honors the same override the rest of the package does.
      var t1color = theme.team1Color || t1.color || '#3b82f6';
      var t2color = theme.team2Color || t2.color || '#ef4444';

      // Determine winner — byte-for-byte the pre-v2 branching (see
      // file-header comment): explicit override first, then the
      // score >= ceil(bestOf/2) computed fallback, else no winner yet.
      var winner = null, loser = null, winKey = null;
      if (state.seriesWinner) {
        winKey = state.seriesWinner;
        winner = state.seriesWinner === 'team1' ? t1 : t2;
        loser = state.seriesWinner === 'team1' ? t2 : t1;
      } else if (t1 && t2 && ((t1.score || 0) > 0 || (t2.score || 0) > 0)) {
        var needed = Math.ceil((state.bestOf || 3) / 2);
        if ((t1.score || 0) >= needed) { winner = t1; loser = t2; winKey = 'team1'; }
        else if ((t2.score || 0) >= needed) { winner = t2; loser = t1; winKey = 'team2'; }
      }

      var stageSlot = document.querySelector('#sw-stage .slot-content');
      var eventSlot = document.querySelector('#sw-event-bar .slot-content');

      if (!winner) {
        stageSlot.innerHTML = waitingHtml();
        eventSlot.innerHTML = '';
        return;
      }

      var teamColor = winKey === 'team1' ? t1color : t2color;
      // The logo's second distinct color (auto-extracted alongside the
      // primary — see src/lib/color-extract.js pickTwoColors). Empty when
      // the logo only has one color family; the pinwheel then falls back to
      // a darker shade of the primary.
      var teamColorAlt = winKey === 'team1' ? (theme.team1ColorAlt || '') : (theme.team2ColorAlt || '');
      // Scene-local custom property (unlike applyTheme()'s globals on
      // document.documentElement) — only #sw-glow-burst/.sw-logo below
      // consume it, so it's set on #root, matching v1's `el.style.
      // setProperty(...)` scoping (el was the local root/container there).
      document.getElementById('root').style.setProperty('--sw-glow', hexToAlpha(teamColor, 0.35));

      var wScore = winKey === 'team1' ? t1.score : t2.score;
      var lScore = winKey === 'team1' ? t2.score : t1.score;

      stageSlot.innerHTML = winnerHtml(winner, loser, wScore, lScore, teamColor, teamColorAlt);
      eventSlot.innerHTML = eventHeader({ eventName: state.eventName || 'FACEIT SEASON 8' });
    }

    defineOverlay({
      el: document.getElementById('root'),
      shell: shell,
      key: key,
      render: render
    });
  </script>
</body>
</html>
